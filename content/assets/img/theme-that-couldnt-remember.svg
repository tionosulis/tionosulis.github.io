    <text x="176" y="186" font-size="9" fill="#D1D6CC" opacity="0.7">data-theme="light"</text>
    <rect x="320" y="174" width="80" height="16" rx="3" fill="#10D9A8" fill-opacity="0.12" />
    <text x="340" y="186" font-size="9" fill="#10D9A8">localStorage &#10003;</text>

    <rect x="168" y="196" width="130" height="16" rx="3" fill="#10D9A8" fill-opacity="0.08" />
    <text x="176" y="208" font-size="9" fill="#10D9A8">DOM matches storage</text>

