    <text x="340" y="284" font-size="9" fill="#10D9A8">localStorage &#10003;</text>

    <rect x="168" y="294" width="130" height="16" rx="3" fill="#10D9A8" fill-opacity="0.08" />
    <text x="176" y="306" font-size="9" fill="#10D9A8">DOM matches storage</text>

