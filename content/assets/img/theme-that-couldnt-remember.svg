    <text x="176" y="408" font-size="9" fill="#10D9A8">localStorage.setItem("theme","dark") &#10003;</text>

    <rect x="168" y="418" width="220" height="16" rx="3" fill="#10D9A8" fill-opacity="0.08" />
    <text x="176" y="430" font-size="9" fill="#10D9A8">DOM &amp; storage now "dark" &#10003;</text>

