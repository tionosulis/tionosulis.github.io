    <polygon points="313,236 309,228 317,228" fill="#F59E0B" opacity="0.6" />

    <!-- Step 2: Posts -->
    <rect x="148" y="240" width="330" height="74" rx="6" fill="#2E2924" stroke="#453E38" stroke-width="0.5" />
