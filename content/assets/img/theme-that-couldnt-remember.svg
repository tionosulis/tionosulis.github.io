    <text x="728" y="284" font-size="9" fill="#D1D6CC" opacity="0.7">data-theme="light"</text>
    <rect x="870" y="272" width="80" height="16" rx="3" fill="#10D9A8" fill-opacity="0.12" />
    <text x="890" y="284" font-size="9" fill="#10D9A8">storage = dark</text>

