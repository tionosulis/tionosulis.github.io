    <circle cx="978" cy="158" r="4" fill="#F59E0B" />
    <text x="988" y="162" font-size="10" fill="#F59E0B">DARK</text>

    <rect x="720" y="174" width="140" height="16" rx="3" fill="#F8F5F0" fill-opacity="0.05" />
    <text x="728" y="186" font-size="9" fill="#D1D6CC" opacity="0.7">data-theme="dark"</text>
    <rect x="870" y="174" width="80" height="16" rx="3" fill="#10D9A8" fill-opacity="0.12" />
    <text x="890" y="186" font-size="9" fill="#10D9A8">storage = dark</text>

    <rect x="720" y="196" width="130" height="16" rx="3" fill="#10D9A8" fill-opacity="0.08" />
    <text x="728" y="208" font-size="9" fill="#10D9A8">DOM matches storage</text>

    <!-- ══ DIVIDER ══ -->
    <line x1="148" y1="448" x2="1152" y2="448" stroke="#453E38" stroke-width="1" opacity="0.2" />

    <!-- ══ BOTTOM EXPLANATION ══ -->
    <text x="148" y="472" font-size="11" fill="#D1D6CC">* inline &lt;script&gt; in &lt;head&gt; runs once — not on bfcache restore</text>
    <text x="148" y="490" font-size="11" fill="#D1D6CC">* "Dark Mode Done Right" needed one more thing: pageshow event listener</text>
    <text x="148" y="508" font-size="11" fill="#D1D6CC">* SW update &#8594; clients.claim() &#8594; Chromium bug #504335759 &#8594; bfcache eviction</text>

    <!-- Stats bar -->
    <rect x="148" y="524" width="954" height="28" rx="6" fill="#29241F" stroke="#453E38" stroke-width="0.5" />

    <circle cx="180" cy="538" r="3" fill="#10D9A8" />
    <text x="192" y="542" font-size="11" fill="#D1D6CC">pageshow + persisted detect bfcache restore</text>

    <line x1="530" y1="526" x2="530" y2="550" stroke="#453E38" stroke-width="1" opacity="0.3" />

    <circle cx="550" cy="538" r="3" fill="#E05050" />
    <text x="562" y="542" font-size="11" fill="#D1D6CC">no-transition guard prevents CSS flash</text>

    <line x1="880" y1="526" x2="880" y2="550" stroke="#453E38" stroke-width="1" opacity="0.3" />

    <circle cx="900" cy="538" r="3" fill="#F59E0B" />
    <text x="912" y="542" font-size="11" fill="#D1D6CC">3 files changed for the fix</text>

  </g>

  <!-- ── STATUS BAR (45px) ── -->
  <rect x="0" y="555" width="1200" height="45" fill="#29241F" />
