    <rect x="700" y="142" width="330" height="74" rx="6" fill="#2E2924" stroke="#10D9A8" stroke-width="0.5" />
    <rect x="700" y="142" width="4" height="74" rx="2" fill="#10D9A8" />

    <text x="720" y="162" font-size="11" fill="#D1D6CC" opacity="0.7">Step 5 &#8592; back</text>
