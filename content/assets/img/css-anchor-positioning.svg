<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect x="0" y="0" width="1200" height="630" fill="#23211F"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="44" fill="#1E1E1E"/>

  <!-- Window controls (left) -->
  <circle cx="35" cy="22" r="7" fill="#EF4444"/>
  <circle cx="60" cy="22" r="7" fill="#F59E0B"/>
  <circle cx="85" cy="22" r="7" fill="#10B981"/>

  <!-- File tab -->
  <rect x="110" y="56" width="240" height="36" rx="8" fill="#363330"/>
  <text x="130" y="81" font-family="'JetBrains Mono', monospace" font-size="14" fill="#F8F5F0" font-weight="600">anchor-positioning.css</text>

  <!-- Title divider -->
  <line x1="0" y1="84" x2="1200" y2="84" stroke="#3D3A37" stroke-width="1.5"/>

  <!-- ── LEFT PANEL ── -->
  <rect x="30" y="100" width="530" height="455" fill="#2A2826" rx="8"/>

  <!-- anchor-name annotation -->
  <rect x="195" y="120" width="200" height="26" fill="#363330" stroke="#3D3A37" stroke-width="1" rx="4"/>
  <text x="295" y="138" font-family="'JetBrains Mono', monospace" font-size="13" fill="#F59E0B" text-anchor="middle" dominant-baseline="middle">anchor-name: --anchor-btn</text>

  <!-- Trigger button -->
  <rect x="185" y="165" width="220" height="55" fill="#32302D" stroke="#F59E0B" stroke-width="2" rx="6"/>
  <text x="295" y="198" font-family="'JetBrains Mono', monospace" font-size="18" fill="#F8F5F0" text-anchor="middle" dominant-baseline="middle" font-weight="600">Trigger</text>

  <!-- Connector line -->
  <line x1="295" y1="220" x2="295" y2="267" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
  <polygon points="295,273 288,263 302,263" fill="#F59E0B" opacity="0.8"/>

  <!-- Tooltip -->
  <rect x="185" y="277" width="220" height="45" fill="#32302D" stroke="#F59E0B" stroke-width="2" rx="4"/>
  <text x="295" y="306" font-family="'JetBrains Mono', monospace" font-size="15" fill="#F8F5F0" text-anchor="middle" dominant-baseline="middle">Tooltip label</text>

  <!-- position-area annotation -->
  <rect x="195" y="336" width="200" height="26" fill="#363330" stroke="#3D3A37" stroke-width="1" rx="4"/>
  <text x="295" y="354" font-family="'JetBrains Mono', monospace" font-size="13" fill="#D1D6CC" text-anchor="middle" dominant-baseline="middle">position-area: bottom center</text>

  <!-- 3×3 position-area grid -->
  <rect x="228" y="380" width="135" height="135" fill="none" stroke="#3D3A37" rx="2"/>

  <line x1="273" y1="380" x2="273" y2="515" stroke="#3D3A37" stroke-width="1" opacity="0.5"/>
  <line x1="318" y1="380" x2="318" y2="515" stroke="#3D3A37" stroke-width="1" opacity="0.5"/>
  <line x1="228" y1="425" x2="363" y2="425" stroke="#3D3A37" stroke-width="1" opacity="0.5"/>
  <line x1="228" y1="470" x2="363" y2="470" stroke="#3D3A37" stroke-width="1" opacity="0.5"/>

  <!-- Column headers -->
  <text x="250" y="402" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D1D6CC" text-anchor="middle" dominant-baseline="middle">top</text>
  <text x="295" y="402" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D1D6CC" text-anchor="middle" dominant-baseline="middle">cen</text>
  <text x="340" y="402" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D1D6CC" text-anchor="middle" dominant-baseline="middle">bot</text>

  <!-- Row labels -->
  <text x="218" y="402" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D1D6CC" text-anchor="end" dominant-baseline="middle">col:</text>
  <text x="218" y="447" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D1D6CC" text-anchor="end" dominant-baseline="middle">row:</text>

  <!-- Mid row labels -->
  <text x="250" y="447" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D1D6CC" text-anchor="middle" dominant-baseline="middle">L</text>
  <text x="340" y="447" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D1D6CC" text-anchor="middle" dominant-baseline="middle">R</text>

  <!-- Center cell highlight -->
  <rect x="273" y="425" width="45" height="45" fill="#F59E0B" opacity="0.15" rx="2"/>
  <text x="295" y="447" font-family="'JetBrains Mono', monospace" font-size="14" fill="#F59E0B" text-anchor="middle" dominant-baseline="middle" font-weight="600">✓</text>

  <!-- Grid label -->
  <text x="295" y="522" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1D6CC" text-anchor="middle">position-area 3×3</text>

  <!-- ── RIGHT PANEL ── -->
  <rect x="585" y="100" width="585" height="455" fill="#2A2826" rx="8"/>

  <!-- Code panel title -->
  <rect x="585" y="100" width="585" height="34" fill="#363330" rx="8"/>
  <rect x="585" y="127" width="585" height="7" fill="#363330"/>
  <text x="605" y="125" font-family="'JetBrains Mono', monospace" font-size="13" fill="#D1D6CC" dominant-baseline="middle">style.css</text>

  <!-- Code lines -->
  <text x="605" y="148" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">1  <tspan fill="#F59E0B">.anchor-btn</tspan> <tspan fill="#F8F5F0">{</tspan></text>
  <text x="605" y="174" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">2    <tspan fill="#F59E0B">anchor-name</tspan><tspan fill="#F8F5F0">:</tspan> <tspan fill="#F8F5F0">--btn</tspan><tspan fill="#F8F5F0">;</tspan></text>
  <text x="605" y="200" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">3  <tspan fill="#F8F5F0">}</tspan></text>
  <text x="605" y="226" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">4  <tspan fill="#F59E0B">.tooltip</tspan> <tspan fill="#F8F5F0">{</tspan></text>
  <text x="605" y="252" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">5    <tspan fill="#F59E0B">position</tspan><tspan fill="#F8F5F0">:</tspan> <tspan fill="#F8F5F0">fixed</tspan><tspan fill="#F8F5F0">;</tspan></text>
  <text x="605" y="278" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">6    <tspan fill="#F59E0B">position-anchor</tspan><tspan fill="#F8F5F0">:</tspan> <tspan fill="#F8F5F0">--btn</tspan><tspan fill="#F8F5F0">;</tspan></text>
  <text x="605" y="304" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">7    <tspan fill="#F59E0B">position-area</tspan><tspan fill="#F8F5F0">:</tspan> <tspan fill="#F8F5F0">bottom center</tspan><tspan fill="#F8F5F0">;</tspan></text>
  <text x="605" y="330" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">8    <tspan fill="#F59E0B">position-try-fallbacks</tspan><tspan fill="#F8F5F0">:</tspan></text>
  <text x="605" y="356" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">9      <tspan fill="#F8F5F0">flip-block</tspan><tspan fill="#F8F5F0">;</tspan></text>
  <text x="605" y="382" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">10 <tspan fill="#F8F5F0">}</tspan></text>

  <!-- Divider -->
  <line x1="605" y1="402" x2="1155" y2="402" stroke="#3D3A37" stroke-width="1"/>

  <!-- Auto-flip section -->
  <text x="605" y="426" font-family="'JetBrains Mono', monospace" font-size="13" fill="#D1D6CC">/* Auto-flip on viewport overflow */</text>
  <text x="605" y="452" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">12 <tspan fill="#10B981">├── flip-block</tspan><tspan fill="#D1D6CC">: top ↔ bottom</tspan></text>
  <text x="605" y="478" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">13 <tspan fill="#10B981">├── flip-inline</tspan><tspan fill="#D1D6CC">: left ↔ right</tspan></text>
  <text x="605" y="504" font-family="'JetBrains Mono', monospace" font-size="14" fill="#D1D6CC">14 <tspan fill="#10B981">└── flip-block flip-inline</tspan><tspan fill="#D1D6CC">: both</tspan></text>

  <!-- Line 7 highlight rail -->
  <rect x="585" y="296" width="5" height="26" fill="#F59E0B" rx="2"/>

  <!-- Inline annotation -->
  <text x="885" y="318" font-family="'JetBrains Mono', monospace" font-size="13" fill="#10B981" dominant-baseline="middle">← 3×3 shorthand</text>

  <!-- ── STATUS BAR ── -->
  <rect x="0" y="555" width="1200" height="25" fill="#1E1E1E"/>
  <line x1="0" y1="555" x2="1200" y2="555" stroke="#3D3A37" stroke-width="1"/>
  <text x="50" y="573" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E0A868" font-weight="600">NORMAL</text>
  <text x="1155" y="573" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1D6CC" text-anchor="end">style.css  14L</text>
</svg>
