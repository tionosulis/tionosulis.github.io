<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A38"/>
      <stop offset="100%" stop-color="#1A2430"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#2A4055" opacity="0.5"/>
    </pattern>
    <filter id="panelShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="arrowGlow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E05050" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E05050" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E05050" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- Ambient glows -->
  <ellipse cx="280" cy="300" rx="320" ry="280" fill="#3A1010" opacity="0.08"/>
  <ellipse cx="920" cy="300" rx="320" ry="280" fill="#103A20" opacity="0.10"/>

  <!-- Outer frame -->
  <rect x="1" y="1" width="1198" height="673" rx="12" ry="12"
        fill="none" stroke="#3A5068" stroke-width="1.5" opacity="0.8"/>
  <path d="M 1 20 L 1 1 L 20 1" fill="none" stroke="#E05050" stroke-width="2" opacity="0.6"/>
  <path d="M 1180 1 L 1199 1 L 1199 20" fill="none" stroke="#10D9A8" stroke-width="2" opacity="0.6"/>
  <path d="M 1 655 L 1 674 L 20 674" fill="none" stroke="#6A8AAA" stroke-width="2" opacity="0.5"/>
  <path d="M 1180 674 L 1199 674 L 1199 655" fill="none" stroke="#6A8AAA" stroke-width="2" opacity="0.5"/>

  <!-- Top label -->
  <text x="600" y="46" font-family="Georgia, serif" font-size="15"
        fill="#7A9AB0" text-anchor="middle" letter-spacing="3">W3C VALIDATION AUDIT</text>
  <line x1="200" y1="56" x2="460" y2="56" stroke="#3A5068" stroke-width="1"/>
  <circle cx="600" cy="56" r="3" fill="#3B82F6" opacity="0.6"/>
  <line x1="740" y1="56" x2="1000" y2="56" stroke="#3A5068" stroke-width="1"/>

  <!-- ══════════════════════════════════════ -->
  <!-- BEFORE — LEFT PANEL                    -->
  <!-- ══════════════════════════════════════ -->
  <text x="270" y="90" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#E05050" text-anchor="middle"
        letter-spacing="3" font-weight="bold">BEFORE</text>

  <!-- Left panel background -->
  <rect x="60" y="108" width="420" height="440" rx="10"
        fill="#1A2634" stroke="#4A3A3A" stroke-width="1.5"
        filter="url(#panelShadow)"/>
  <rect x="60" y="108" width="420" height="3" rx="2" fill="#E05050" opacity="0.5"/>

  <!-- Error count — big 16 -->
  <text x="270" y="230" font-family="Georgia, serif" font-size="80"
        fill="#E05050" text-anchor="middle" font-weight="bold"
        filter="url(#redGlow)">16</text>

  <!-- ERRORS label -->
  <text x="270" y="270" font-family="'Courier New', Courier, monospace"
        font-size="18" fill="#E05050" text-anchor="middle"
        letter-spacing="5" font-weight="bold">ERRORS</text>

  <!-- Divider line -->
  <line x1="100" y1="295" x2="440" y2="295" stroke="#4A3A3A" stroke-width="1"/>

  <!-- Parse error details -->
  <text x="270" y="328" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#B08080" text-anchor="middle">CSS: Parse Error × 16</text>

  <!-- Error lines representing selectors -->
  <rect x="110" y="352" width="320" height="26" rx="4" fill="#2A1A1A" stroke="#4A2A2A" stroke-width="1"/>
  <text x="125" y="369" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#C07070">&amp;:hover { color: var(--accent-hover); }</text>

  <rect x="110" y="384" width="320" height="26" rx="4" fill="#2A1A1A" stroke="#4A2A2A" stroke-width="1"/>
  <text x="125" y="401" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#C07070">&amp;::before { content: &quot;— &quot;; }</text>

  <rect x="110" y="416" width="320" height="26" rx="4" fill="#2A1A1A" stroke="#4A2A2A" stroke-width="1"/>
  <text x="125" y="433" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#C07070">&amp;:focus-visible { outline: 2px solid; }</text>

  <rect x="110" y="448" width="320" height="26" rx="4" fill="#2A1A1A" stroke="#4A2A2A" stroke-width="1"/>
  <text x="125" y="465" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#C07070">&amp;:first-child { margin-top: 0; }</text>

  <!-- More errors indicator -->
  <text x="270" y="498" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#7A5A5A" text-anchor="middle">+ 12 more...</text>

  <!-- Red X mark -->
  <circle cx="420" cy="140" r="16" fill="none" stroke="#E05050" stroke-width="2.5" opacity="0.7"/>
  <line x1="412" y1="132" x2="428" y2="148" stroke="#E05050" stroke-width="2.5" opacity="0.7"/>
  <line x1="428" y1="132" x2="412" y2="148" stroke="#E05050" stroke-width="2.5" opacity="0.7"/>

  <!-- ══════════════════════════════════════ -->
  <!-- CENTER LIGHTNING CSS TRANSFORM         -->
  <!-- ══════════════════════════════════════ -->
  <g transform="translate(600, 300)">
    <!-- Arrow line -->
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#4A8AE0" stroke-width="2.5"
          stroke-dasharray="6,4" filter="url(#arrowGlow)"/>
    <polygon points="38,-8 54,0 38,8" fill="#4A8AE0" opacity="0.9"/>

    <!-- Lightning CSS label -->
    <rect x="-76" y="-44" width="152" height="26" rx="5" fill="#1A2A40" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="0" y="-27" font-family="'Courier New', Courier, monospace"
          font-size="11" fill="#60A8F0" text-anchor="middle" letter-spacing="2">LIGHTNING CSS</text>

    <!-- Transform label -->
    <rect x="-64" y="16" width="128" height="22" rx="4" fill="#1A2634" stroke="#3A5068" stroke-width="1"/>
    <text x="0" y="31" font-family="'Courier New', Courier, monospace"
          font-size="10" fill="#8ABCE0" text-anchor="middle">CSS Nesting → Flat</text>

    <!-- Minify label -->
    <rect x="-64" y="44" width="128" height="22" rx="4" fill="#1A2634" stroke="#3A5068" stroke-width="1"/>
    <text x="0" y="59" font-family="'Courier New', Courier, monospace"
          font-size="10" fill="#8ABCE0" text-anchor="middle">Minify · Targets</text>
  </g>

  <!-- ══════════════════════════════════════ -->
  <!-- AFTER — RIGHT PANEL                    -->
  <!-- ══════════════════════════════════════ -->
  <text x="930" y="90" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#10D9A8" text-anchor="middle"
        letter-spacing="3" font-weight="bold">AFTER</text>

  <!-- Right panel background -->
  <rect x="720" y="108" width="420" height="440" rx="10"
        fill="#1A2634" stroke="#1A4A2A" stroke-width="1.5"
        filter="url(#panelShadow)"/>
  <rect x="720" y="108" width="420" height="3" rx="2" fill="#10D9A8" opacity="0.6"/>

  <!-- Error count — big 0 -->
  <text x="930" y="230" font-family="Georgia, serif" font-size="80"
        fill="#10D9A8" text-anchor="middle" font-weight="bold"
        filter="url(#greenGlow)">0</text>

  <!-- ERRORS label -->
  <text x="930" y="270" font-family="'Courier New', Courier, monospace"
        font-size="18" fill="#10D9A8" text-anchor="middle"
        letter-spacing="5" font-weight="bold">ERRORS</text>

  <!-- Divider line -->
  <line x1="760" y1="295" x2="1100" y2="295" stroke="#1A4A2A" stroke-width="1"/>

  <!-- Clean status -->
  <text x="930" y="328" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#80B090" text-anchor="middle">No errors · No warnings</text>

  <!-- Green success state — clean selectors -->
  <rect x="770" y="352" width="320" height="26" rx="4" fill="#0A1A10" stroke="#0D3A16" stroke-width="1"/>
  <text x="785" y="369" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#50C070">.nav a: hover { color: ... }</text>

  <rect x="770" y="384" width="320" height="26" rx="4" fill="#0A1A10" stroke="#0D3A16" stroke-width="1"/>
  <text x="785" y="401" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#50C070">a::before { content: &quot;— &quot;; }</text>

  <rect x="770" y="416" width="320" height="26" rx="4" fill="#0A1A10" stroke="#0D3A16" stroke-width="1"/>
  <text x="785" y="433" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#50C070">.nav a: focus-visible { outline: ... }</text>

  <rect x="770" y="448" width="320" height="26" rx="4" fill="#0A1A10" stroke="#0D3A16" stroke-width="1"/>
  <text x="785" y="465" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#50C070">.blockquote p: first-child { ... }</text>

  <!-- Valid badge indicator -->
  <text x="930" y="498" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#3AB85A" text-anchor="middle">W3C Valid ✔</text>

  <!-- Green checkmark -->
  <circle cx="1060" cy="140" r="16" fill="none" stroke="#10D9A8" stroke-width="2.5" opacity="0.7"/>
  <polyline points="1050,140 1056,148 1070,132" fill="none" stroke="#10D9A8" stroke-width="2.5" opacity="0.7"/>

  <!-- ══════════════════════════════════════ -->
  <!-- BOTTOM CONFIG STRIP                    -->
  <!-- ══════════════════════════════════════ -->
  <rect x="0" y="618" width="1200" height="57" fill="#16202E" opacity="0.95"/>
  <line x1="0" y1="618" x2="1200" y2="618" stroke="#2A4055" stroke-width="1"/>

  <!-- Config line visualization -->
  <rect x="80" y="630" width="200" height="32" rx="4" fill="#1A2634" stroke="#3A5068" stroke-width="1"/>
  <text x="120" y="650" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#C08040">eleventy.config.js</text>

  <text x="310" y="650" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#6A8AAA">lightningcss.transform({</text>

  <text x="480" y="650" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#60A8F0">code</text>
  <text x="510" y="650" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#7A9AB0">: css,</text>

  <text x="640" y="650" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#60A8F0">minify</text>
  <text x="672" y="650" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#7A9AB0">: true });</text>

  <!-- Terminal prompt -->
  <text x="850" y="650" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4DC896">$ npm run build &amp;&amp; validate</text>

  <circle cx="80" cy="646" r="4" fill="#3B82F6" opacity="0.6"/>
</svg>
