        .text-muted { fill: #B08080; }
        .text-code-fail { fill: #C07070; }
        .text-code-success { fill: #50C070; }
        .text-center-badge { fill: #60A8F0; font-weight: normal; }
        .glow-fail { fill: #E05050; }
        .glow-success { fill: #10D9A8; }
        .status-fail { stroke: #E05050; fill: #E05050; }
        .status-success { stroke: #10D9A8; fill: #10D9A8; }
