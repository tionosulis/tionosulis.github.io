  <rect x="368" y="155" width="62" height="40" fill="#fff" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="399" y="173" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#15803d">posts</text>
  <text x="399" y="185" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#15803d">11tydata</text>

  <text x="477" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#15803d">reads the full project</text>
