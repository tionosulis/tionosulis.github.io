<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <rect width="640" height="380" fill="#fafafa" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">How AI Tools See Your Project</text>

  <!-- LEFT PANEL: Typical AI -->
  <rect x="20" y="44" width="285" height="320" fill="#f8f8f8" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <rect x="24" y="40" width="70" height="18" fill="#fee2e2" rx="3"/>
  <text x="59" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#b91c1c">Typical AI</text>

  <rect x="55" y="100" width="215" height="90" fill="#fff" stroke="#ef4444" stroke-width="1.5" rx="8"/>
  <rect x="65" y="110" width="24" height="28" fill="#fca5a5" rx="4"/>
  <rect x="69" y="116" width="16" height="2" fill="#ef4444"/>
  <rect x="69" y="122" width="12" height="2" fill="#ef4444"/>
  <rect x="69" y="128" width="14" height="2" fill="#ef4444"/>
  <text x="100" y="134" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#1a1a1a">dot-leader.css</text>
  <text x="162" y="167" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#636b78">One isolated file</text>

  <circle cx="162" cy="240" r="18" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="153" y1="231" x2="171" y2="249" stroke="#ef4444" stroke-width="2"/>
  <line x1="171" y1="231" x2="153" y2="249" stroke="#ef4444" stroke-width="2"/>
  <text x="162" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#b91c1c">disconnected</text>

  <!-- DIVIDER -->
  <line x1="317" y1="50" x2="317" y2="355" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- RIGHT PANEL: Big Pickle -->
  <rect x="335" y="44" width="285" height="320" fill="#f8f8f8" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <rect x="470" y="40" width="90" height="18" fill="#dcfce7" rx="3"/>
  <text x="515" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#15803d">Big Pickle</text>

  <!-- connection lines -->
  <line x1="477" y1="105" x2="555" y2="175" stroke="#86efac" stroke-width="2"/>
  <line x1="555" y1="175" x2="477" y2="255" stroke="#86efac" stroke-width="2"/>
  <line x1="477" y1="255" x2="399" y2="175" stroke="#86efac" stroke-width="2"/>
  <line x1="399" y1="175" x2="477" y2="105" stroke="#86efac" stroke-width="2"/>
  <line x1="477" y1="105" x2="477" y2="255" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="399" y1="175" x2="555" y2="175" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- node: postslist.njk (top) -->
  <rect x="446" y="85" width="62" height="40" fill="#fff" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="477" y="103" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#15803d">postslist</text>
  <text x="477" y="115" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#15803d">.njk</text>

  <!-- node: index.css (right) -->
  <rect x="524" y="155" width="62" height="40" fill="#fff" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="555" y="173" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#15803d">index</text>
  <text x="555" y="185" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#15803d">.css</text>

  <!-- node: eleventy.config (bottom) -->
  <rect x="446" y="235" width="62" height="40" fill="#fff" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="477" y="253" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#15803d">eleventy</text>
  <text x="477" y="265" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#15803d">config</text>

