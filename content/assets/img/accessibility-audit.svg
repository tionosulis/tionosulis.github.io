<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><defs><style> .canvas-bg { fill: #f8f5f0; } .grid-dots { fill: #332D28; opacity: 0.15; } .title-text { fill: #D97706; font-weight: bold; } .ui-border { stroke: #D1C9C0; } .sketch-box-trap { fill: #FFFFFF; stroke: #332D28; } .sketch-box-audit { fill: #FFFFFF; stroke: #D97706; } .connector-line { stroke: #8A8075; } .score-glow-trap { fill: #EF4444; stroke: #332D28; } .indicator-ring { fill: none; stroke: #059669; stroke-width: 3; } .text-dark { fill: #332D28; } .text-muted { fill: #8A8075; } .text-badge { fill: #F8F5F0; } .text-alert { fill: #DC2626; font-weight: bold; } .text-success { fill: #059669; font-weight: bold; } .statusbar-bg { fill: #332D28; } .statusbar-border { stroke: #4A423B; } .statusbar-badge { fill: #D97706; } @media (prefers-color-scheme: dark) { .canvas-bg { fill: #161616; } .grid-dots { fill: #453E38; opacity: 0.3; } .title-text { fill: #F59E0B; font-weight: bold; } .ui-border { stroke: #453E38; } .sketch-box-trap { fill: #241E1A; stroke: #F8F5F0; } .sketch-box-audit { fill: #14261C; stroke: #F59E0B; } .connector-line { stroke: #A09088; } .score-glow-trap { fill: #E05050; stroke: #F8F5F0; } .indicator-ring { stroke: #10D9A8; stroke-width: 3; } .text-dark { fill: #D1D6CC; } .text-muted { fill: #A09088; } .text-alert { fill: #E05050; } .text-success { fill: #10D9A8; } .statusbar-bg { fill: #222222; } .statusbar-border { stroke: #333333; } .statusbar-badge { fill: #F59E0B; } } </style><pattern id="dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse"><circle class="grid-dots" cx="13" cy="13" r="0.8"/></pattern><filter id="sketchy"><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="sketchyStrong"><feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect class="canvas-bg" width="1200" height="630"/><rect width="1200" height="630" fill="url(#dots)"/><text class="title-text" x="600" y="55" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="20" text-anchor="middle" letter-spacing="2">ACCESSIBILITY AUDIT WORKFLOW</text><line class="ui-border" x1="250" y1="75" x2="950" y2="75" stroke-width="1.5"/><g id="trap-group"><text class="text-dark" x="250" y="130" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="16" font-weight="bold" text-anchor="middle">THE LIGHTHOUSE TRAP</text><circle class="score-glow-trap" cx="250" cy="220" r="45" fill="none" stroke-width="6" stroke-dasharray="280 20" filter="url(#sketchyStrong)"/><text class="text-alert" x="250" y="227" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="26" text-anchor="middle">100</text><path class="connector-line" d="M 160 320 Q 250 290 340 320 T 250 380" fill="none" stroke-width="2" stroke-dasharray="5 4" filter="url(#sketchy)"/><text class="text-alert" x="250" y="340" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="14" text-anchor="middle">⚠ 14x Tab Presses to Menu</text><text class="text-muted" x="250" y="365" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="12" text-anchor="middle">Hidden outline: none</text><rect class="sketch-box-trap" x="100" y="400" width="300" height="65" rx="4" stroke-width="1.5" filter="url(#sketchy)"/><text class="text-dark" x="115" y="425" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="13" font-weight="bold">Automated Tools Catch</text><text class="text-alert" x="115" y="445" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="13">Only 30-40% of WCAG Errors</text><rect class="sketch-box-trap" x="70" y="150" width="360" height="350" fill="none" stroke-width="1.5" rx="6" opacity="0.4" filter="url(#sketchy)"/></g><g id="transform-group" trans