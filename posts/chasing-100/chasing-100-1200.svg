  <!-- AFTER — RIGHT SECTION                  -->
  <!-- ══════════════════════════════════════ -->
  <text x="930" y="90" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#10D9A8" text-anchor="middle"
        letter-spacing="3" font-weight="bold" filter="url(#greenGlow)">AFTER</text>

  <!-- All four 100s — green, glowing -->
  <!-- Performance 100 -->
  <g transform="translate(760, 200)">
    <circle cx="0" cy="0" r="72" fill="#0A1A0E" stroke="#0D3A12" stroke-width="2"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#0D2A12" stroke-width="8"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#10D9A8" stroke-width="8"
            stroke-dasharray="414 0" stroke-dashoffset="105"
            stroke-linecap="round" filter="url(#greenGlow)"/>
    <text x="0" y="8" font-family="Georgia, serif" font-size="36"
          fill="#10D9A8" text-anchor="middle" font-weight="bold"
          filter="url(#greenGlow)">100</text>
    <text x="0" y="98" font-family="'Courier New', Courier, monospace"
          font-size="11" fill="#2AD9A8" text-anchor="middle" letter-spacing="1">Performance</text>
  </g>

  <!-- Accessibility 100 -->
  <g transform="translate(940, 200)">
    <circle cx="0" cy="0" r="72" fill="#0A1A0E" stroke="#0D3A12" stroke-width="2"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#0D2A12" stroke-width="8"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#10D9A8" stroke-width="8"
            stroke-dasharray="414 0" stroke-dashoffset="105"
            stroke-linecap="round" filter="url(#greenGlow)"/>
    <text x="0" y="8" font-family="Georgia, serif" font-size="36"
          fill="#10D9A8" text-anchor="middle" font-weight="bold"
          filter="url(#greenGlow)">100</text>
    <text x="0" y="98" font-family="'Courier New', Courier, monospace"
          font-size="11" fill="#2AD9A8" text-anchor="middle" letter-spacing="1">Accessibility</text>
  </g>

  <!-- Best Practices 100 -->
  <g transform="translate(760, 370)">
    <circle cx="0" cy="0" r="72" fill="#0A1A0E" stroke="#0D3A12" stroke-width="2"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#0D2A12" stroke-width="8"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#10D9A8" stroke-width="8"
            stroke-dasharray="414 0" stroke-dashoffset="105"
            stroke-linecap="round" filter="url(#greenGlow)"/>
    <text x="0" y="8" font-family="Georgia, serif" font-size="36"
          fill="#10D9A8" text-anchor="middle" font-weight="bold"
          filter="url(#greenGlow)">100</text>
    <text x="0" y="98" font-family="'Courier New', Courier, monospace"
          font-size="11" fill="#2AD9A8" text-anchor="middle" letter-spacing="1">Best Practices</text>
  </g>

  <!-- SEO 100 -->
  <g transform="translate(940, 370)">
    <circle cx="0" cy="0" r="72" fill="#0A1A0E" stroke="#0D3A12" stroke-width="2"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#0D2A12" stroke-width="8"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#10D9A8" stroke-width="8"
            stroke-dasharray="414 0" stroke-dashoffset="105"
            stroke-linecap="round" filter="url(#greenGlow)"/>
    <text x="0" y="8" font-family="Georgia, serif" font-size="36"
          fill="#10D9A8" text-anchor="middle" font-weight="bold"
          filter="url(#greenGlow)">100</text>
    <text x="0" y="98" font-family="'Courier New', Courier, monospace"
          font-size="11" fill="#2AD9A8" text-anchor="middle" letter-spacing="1">SEO</text>
  </g>

  <!-- ══════════════════════════════════════ -->
  <!-- BOTTOM FIX CARDS                       -->
  <!-- ══════════════════════════════════════ -->
  <rect x="80" y="490" width="320" height="110" rx="10"
        fill="#1A2634" stroke="#3D536A" stroke-width="1.5"
        filter="url(#fixShadow)"/>
  <rect x="80" y="490" width="320" height="3" rx="2" fill="#F5A623" opacity="0.7"/>
  <text x="240" y="522" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#F5A623" text-anchor="middle" letter-spacing="2">FORCED REFLOW</text>
  <text x="240" y="548" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#A0B8D0" text-anchor="middle">offsetWidth triggers layout</text>
  <text x="240" y="568" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4DC896" text-anchor="middle">→ move to build-time</text>
  <text x="240" y="586" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4DC896" text-anchor="middle">→ CSS transform instead</text>

  <rect x="440" y="490" width="320" height="110" rx="10"
        fill="#1A2634" stroke="#3D536A" stroke-width="1.5"
        filter="url(#fixShadow)"/>
  <rect x="440" y="490" width="320" height="3" rx="2" fill="#F5A623" opacity="0.7"/>
  <text x="600" y="522" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#F5A623" text-anchor="middle" letter-spacing="2">CLS SHIFT</text>
  <text x="600" y="548" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#A0B8D0" text-anchor="middle">element size unknown</text>
  <text x="600" y="568" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4DC896" text-anchor="middle">→ explicit width + height</text>
  <text x="600" y="586" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4DC896" text-anchor="middle">→ layout stable ✔</text>

  <rect x="800" y="490" width="320" height="110" rx="10"
        fill="#1A2634" stroke="#3D536A" stroke-width="1.5"
        filter="url(#fixShadow)"/>
  <rect x="800" y="490" width="320" height="3" rx="2" fill="#F5A623" opacity="0.7"/>
  <text x="960" y="522" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#F5A623" text-anchor="middle" letter-spacing="2">CONTRAST FAIL</text>
  <text x="960" y="548" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#A0B8D0" text-anchor="middle">ratio below 4.5:1 WCAG</text>
  <text x="960" y="568" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4DC896" text-anchor="middle">→ WCAG-safe color override</text>
  <text x="960" y="586" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4DC896" text-anchor="middle">→ ratio 4.5:1 ✔</text>

  <!-- ══════════════════════════════════════ -->
  <!-- BOTTOM STRIP                           -->
  <!-- ══════════════════════════════════════ -->
  <rect x="0" y="628" width="1200" height="47" fill="#1A2634" opacity="0.9"/>
  <line x1="0" y1="628" x2="1200" y2="628" stroke="#35556B" stroke-width="1"/>
  <circle cx="84" cy="651" r="5" fill="#F5A623" opacity="0.7"/>
  <text x="100" y="656" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#D09040">99 · 97 · 100 · 100</text>
  <text x="600" y="656" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#6A8AAA" text-anchor="middle"
        letter-spacing="3">LIGHTHOUSE · PERFORMANCE · ACCESSIBILITY · SEO</text>
  <circle cx="960" cy="651" r="5" fill="#10D9A8" opacity="0.7"/>
  <text x="976" y="656" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#2AD9A8">100 · 100 · 100 · 100</text>

</svg>
