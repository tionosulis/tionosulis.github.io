<text class="text-muted" x="260" y="538" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">::view-transition-old</text>
<rect class="panel-bg" x="430" y="120" width="300" height="400" stroke-width="1.5" rx="3" opacity="0.35" filter="url(#sketchyStrong)"/>
<rect class="accent-amber" x="450" y="150" width="180" height="16" opacity="0.25" rx="2"/>
<rect class="diagram-strip" x="450" y="178" width="240" height="8" opacity="0.2" rx="1"/>
<rect class="diagram-strip" x="450" y="194" width="200" height="8" opacity="0.15" rx="1"/>
