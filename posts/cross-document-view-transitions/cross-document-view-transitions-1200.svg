<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"> <defs>
<style>
/* ── 1. TEMA ASLI MURNI: LIGHT MODE (Latar Blog Cream #f8f5f0) ── */
.canvas-bg { fill: #f8f5f0; }
.grid-dots { fill: #332D28; opacity: 0.15; }
.title-bar { fill: #332D28; }
.ui-border { stroke: #D1C9C0; }
.panel-bg { fill: #FFFFFF; stroke: #332D28; }
.panel-bg-alt { fill: #FFFFFF; stroke: #D97706; }
.diagram-bg { fill: #F4F1ED; }
.diagram-strip { fill: #E5DFD9; }
/* Teks &amp; Sintaks Light */
.text-base { fill: #F8F5F0; }
.text-dark { fill: #332D28; }
.text-muted { fill: #8A8075; }
/* Aksen Jalur &amp; Indikator */
.accent-amber { fill: #D97706; }
.accent-amber-stroke { stroke: #D97706; }
.accent-amber-text { fill: #D97706; }
/* Status Bar Light */
.statusbar-bg { fill: #332D28; }
.statusbar-border { stroke: #4A423B; }
.statusbar-badge { fill: #D97706; }
.statusbar-badge-text { fill: #F8F5F0; }
.statusbar-info { fill: #E5DFD9; }
/* ── 2. TEMA ASLI MURNI: DARK MODE (Latar Blog Charcoal #161616) ── */
@media (prefers-color-scheme: dark) {
.canvas-bg { fill: #161616; }
.grid-dots { fill: #453E38; opacity: 0.3; }
.title-bar { fill: #29241F; }
.ui-border { stroke: #453E38; }
.panel-bg { fill: #2E2924; stroke: #F8F5F0; }
.panel-bg-alt { fill: #2E2924; stroke: #F59E0B; }
.diagram-bg { fill: #3D3630; }
.diagram-strip { fill: #D1D6CC; }
.text-dark { fill: #D1D6CC; }
.text-muted { fill: #D1D6CC; }
.accent-amber { fill: #F59E0B; }
.accent-amber-stroke { stroke: #F59E0B; }
.accent-amber-text { fill: #F59E0B; }
.statusbar-bg { fill: #29241F; }
.statusbar-border { stroke: #453E38; }
.statusbar-badge { fill: #F59E0B; }
.statusbar-badge-text { fill: #1C1917; }
.statusbar-info { fill: #D1D6CC; }
}
</style>
<pattern id="dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
<circle class="grid-dots" cx="13" cy="13" r="0.8"/>
</pattern>
<filter id="sketchy">
<feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="sketchyStrong">
<feTurbulence type="turbulence" baseFrequency="0.025" numOctaves="3" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect class="canvas-bg" width="1200" height="630"/>
<rect width="1200" height="630" fill="url(#dots)"/>
<rect class="title-bar" x="0" y="0" width="1200" height="44"/>
