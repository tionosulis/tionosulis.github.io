<text class="accent-amber-text" x="950" y="520" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle" filter="url(#sketchy)">Page B</text>
<text class="text-muted" x="950" y="538" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">::view-transition-new</text>
<path d="M 415 305 C 430 295 440 305 455 300" class="accent-amber-stroke" stroke-width="2" fill="none" filter="url(#sketchy)"/>
<polygon points="455,295 465,300 455,305" class="accent-amber"/>
<path d="M 775 305 C 790 295 800 305 815 300" class="accent-amber-stroke" stroke-width="2" fill="none" filter="url(#sketchy)"/>
<polygon points="815,295 825,300 815,305" class="accent-amber"/>
<rect class="statusbar-bg" x="0" y="585" width="1200" height="45"/>
<line class="statusbar-border" x1="0" y1="585" x2="1200" y2="585" stroke-width="1"/>
