<text class="accent-amber-text" x="590" y="552" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">mid-transition</text>
<text class="text-muted" x="590" y="570" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">::view-transition-image-pair</text>
