<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A4053"/>
      <stop offset="100%" style="stop-color:#1E2D3D"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1C2A3A"/>
      <stop offset="100%" style="stop-color:#182436"/>
    </linearGradient>
    <linearGradient id="finalCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2E20"/>
      <stop offset="100%" style="stop-color:#162818"/>
    </linearGradient>


    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.7" fill="#3A5068" opacity="0.7"/>
    </pattern>


    <filter id="cardShadow">
      <feDropShadow dx="0" dy="5" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="outerLift" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="amberGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fixShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000" flood-opacity="0.3"/>
    </filter>


    <!-- Clip path for overflow demo -->
    <clipPath id="rowClip1">
      <rect x="80" y="130" width="1040" height="36"/>
    </clipPath>
    <clipPath id="rowClip2">
      <rect x="80" y="248" width="1040" height="36"/>
    </clipPath>
    <clipPath id="rowClip3">
      <rect x="80" y="366" width="1040" height="36"/>
    </clipPath>
  </defs>


  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>


  <!-- Ambient glow -->
  <ellipse cx="200" cy="300" rx="300" ry="220" fill="#E8B84B" opacity="0.04"/>
  <ellipse cx="1000" cy="350" rx="280" ry="200" fill="#7EB8D4" opacity="0.05"/>
  <ellipse cx="600" cy="560" rx="400" ry="120" fill="#2A9A5A" opacity="0.05"/>


  <!-- Outer frame -->
  <rect x="1" y="1" width="1198" height="673" rx="12" ry="12"
        fill="none" stroke="#3A5470" stroke-width="1.5" opacity="0.9"
        filter="url(#outerLift)"/>
  <!-- Corner accents: amber top, slate blue bottom -->
  <path d="M 1 20 L 1 1 L 20 1" fill="none" stroke="#E8B84B" stroke-width="2" opacity="0.8"/>
  <path d="M 1180 1 L 1199 1 L 1199 20" fill="none" stroke="#E8B84B" stroke-width="2" opacity="0.8"/>
  <path d="M 1 655 L 1 674 L 20 674" fill="none" stroke="#7EB8D4" stroke-width="2" opacity="0.7"/>
  <path d="M 1180 674 L 1199 674 L 1199 655" fill="none" stroke="#7EB8D4" stroke-width="2" opacity="0.7"/>


  <!-- ══════════════════════════════════════ -->
  <!-- TOP LABEL                              -->
  <!-- ══════════════════════════════════════ -->
  <text x="600" y="44" font-family="Georgia, serif" font-size="14"
        fill="#7EB8D4" text-anchor="middle" letter-spacing="3">THE DOT LEADER — 3 CSS CHALLENGES</text>
  <line x1="160" y1="54" x2="460" y2="54" stroke="#3A5470" stroke-width="1"/>
  <circle cx="600" cy="54" r="3" fill="#E8B84B" opacity="0.7"/>
  <line x1="740" y1="54" x2="1040" y2="54" stroke="#3A5470" stroke-width="1"/>


  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- CHALLENGE 1 — OVERFLOW                                     -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="48" y="70" width="1104" height="96" rx="10"
        fill="url(#cardGrad)" stroke="#2E4560" stroke-width="1.5"
        filter="url(#cardShadow)"/>
  <rect x="48" y="70" width="1104" height="3" rx="2" fill="#E05050" opacity="0.8"/>


  <!-- Challenge badge -->
  <rect x="68" y="84" width="130" height="22" rx="5" fill="#2A1515" stroke="#5A2A2A" stroke-width="1"/>
  <text x="133" y="99" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#E07070" text-anchor="middle" letter-spacing="1">Challenge 01</text>


  <text x="218" y="99" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#A07070" letter-spacing="1">dots overflow container bounds</text>


  <!-- Row content — clipped to show overflow problem -->
  <g clip-path="url(#rowClip1)">
    <text x="80" y="158" font-family="Georgia, serif" font-size="20"
          fill="#C8D8E8" font-weight="bold">Chasing 100: A Field Guide to Perfect Lighthouse Scores</text>
    <!-- Dots overflowing — rendered past title into date area -->
    <text x="680" y="158" font-family="Georgia, serif" font-size="20"
          fill="#E8B84B" opacity="0.9" filter="url(#amberGlow)"
          letter-spacing="4">· · · · · · · · · · · · · · · · · · · · · ·</text>
    <text x="1080" y="158" font-family="Georgia, serif" font-size="20"
          fill="#C8D8E8">Jun 2026</text>
  </g>


  <!-- Overflow indicator arrows -->
  <line x1="1048" y1="118" x2="1048" y2="158" stroke="#E05050" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="1056" y="136" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#E07070">overflow</text>
  <!-- Red clip marker line -->
  <line x1="1148" y1="112" x2="1148" y2="162" stroke="#E05050" stroke-width="1.5" opacity="0.6"/>


  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- CHALLENGE 2 — BASELINE MISALIGNMENT                        -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="48" y="188" width="1104" height="96" rx="10"
        fill="url(#cardGrad)" stroke="#2E4560" stroke-width="1.5"
        filter="url(#cardShadow)"/>
  <rect x="48" y="188" width="1104" height="3" rx="2" fill="#E8A030" opacity="0.8"/>


  <!-- Challenge badge -->
  <rect x="68" y="202" width="130" height="22" rx="5" fill="#201808" stroke="#5A4010" stroke-width="1"/>
  <text x="133" y="217" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#E8A030" text-anchor="middle" letter-spacing="1">Challenge 02</text>


  <text x="218" y="217" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#A08050" letter-spacing="1">dots float above text baseline</text>


  <!-- Row content — dots misaligned upward -->
  <g clip-path="url(#rowClip2)">
    <text x="80" y="276" font-family="Georgia, serif" font-size="20"
          fill="#C8D8E8" font-weight="bold">DIY Draft System for Eleventy v3</text>
    <!-- Dots rendered higher — misaligned baseline -->
    <text x="520" y="268" font-family="Georgia, serif" font-size="20"
          fill="#E8B84B" opacity="0.9" filter="url(#amberGlow)"
          letter-spacing="4">· · · · · · · · · · · · · · · · ·</text>
    <text x="1080" y="276" font-family="Georgia, serif" font-size="20"
          fill="#C8D8E8">Jun 2026</text>
  </g>


  <!-- Baseline indicators -->
  <line x1="80" y1="280" x2="1120" y2="280" stroke="#E8A030" stroke-width="0.8"
        stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Arrow pointing to misalignment — moved above dots -->
  <line x1="680" y1="232" x2="680" y2="248" stroke="#E8A030" stroke-width="1.5"/>
  <polygon points="676,248 680,256 684,248" fill="#E8A030" opacity="0.8"/>
  <text x="694" y="243" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#E8A030">↑ floats up</text>


  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- CHALLENGE 3 — TITLE SQUEEZE                                -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="48" y="306" width="1104" height="96" rx="10"
        fill="url(#cardGrad)" stroke="#2E4560" stroke-width="1.5"
        filter="url(#cardShadow)"/>
  <rect x="48" y="306" width="1104" height="3" rx="2" fill="#7EB8D4" opacity="0.8"/>


  <!-- Challenge badge -->
  <rect x="68" y="320" width="130" height="22" rx="5" fill="#081820" stroke="#1E4060" stroke-width="1"/>
  <text x="133" y="335" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#7EB8D4" text-anchor="middle" letter-spacing="1">Challenge 03</text>


  <text x="218" y="335" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#5A8AA0" letter-spacing="1">long title squeezes dots to zero</text>


  <!-- Row content — long title, dots nearly gone -->
  <g clip-path="url(#rowClip3)">
    <text x="80" y="394" font-family="Georgia, serif" font-size="20"
          fill="#C8D8E8" font-weight="bold">PWA with Vanilla JS: Why I Ditched Workbox for a 1KB Service Worker</text>
    <!-- Only 2-3 dots visible — squeezed -->
    <text x="1000" y="394" font-family="Georgia, serif" font-size="20"
          fill="#E8B84B" opacity="0.5" filter="url(#amberGlow)"
          letter-spacing="2">· ·</text>
    <text x="1080" y="394" font-family="Georgia, serif" font-size="20"
          fill="#C8D8E8">Jun 2026</text>
  </g>


  <!-- Squeeze indicator -->
  <line x1="988" y1="350" x2="988" y2="400" stroke="#7EB8D4" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="870" y="346" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#7EB8D4">title too long → min-width: 0 needed</text>


  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- DIVIDER                                                    -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <line x1="48" y1="424" x2="1152" y2="424" stroke="#3A5470" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="540" y="414" width="120" height="20" rx="5" fill="#2A4053" stroke="#3A5470" stroke-width="1"/>
  <text x="600" y="428" font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#7EB8D4" text-anchor="middle" letter-spacing="2">FIXED ✔</text>


  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- FINAL RESULT — PIXEL PERFECT                               -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="48" y="442" width="1104" height="148" rx="12"
        fill="url(#finalCard)" stroke="#1A5A30" stroke-width="2"
        filter="url(#cardShadow)"/>
  <rect x="48" y="442" width="1104" height="4" rx="2" fill="#2AD878" opacity="0.9"/>


  <!-- Final label -->
  <rect x="68" y="456" width="180" height="22" rx="5" fill="#0A2A14" stroke="#1A5A2A" stroke-width="1"/>
  <text x="158" y="471" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#2AD878" text-anchor="middle"
        letter-spacing="1" filter="url(#greenGlow)">✔ Final Result</text>


  <text x="262" y="471" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#2A8A4A" letter-spacing="1">pixel-perfect dot leader, all edge cases handled</text>


  <!-- Perfect row 1 -->
  <text x="80" y="516" font-family="Georgia, serif" font-size="22"
        fill="#E8F4F8" font-weight="bold">The Dot Leader: 3 CSS Challenges</text>
  <text x="660" y="516" font-family="Georgia, serif" font-size="22"
        fill="#E8B84B" letter-spacing="6" filter="url(#amberGlow)"
        >· · · · · · · · · · · ·</text>
  <text x="1040" y="516" font-family="Georgia, serif" font-size="22"
        fill="#E8F4F8">Jun 2026</text>


  <!-- Perfect row 2 — long title, ellipsis, minimal dots -->
  <text x="80" y="554" font-family="Georgia, serif" font-size="22"
        fill="#A8C8D8" font-weight="bold">PWA with Vanilla JS: Why I Ditched Workbox…</text>
  <text x="890" y="554" font-family="Georgia, serif" font-size="22"
        fill="#E8B84B" letter-spacing="6" filter="url(#amberGlow)"
        opacity="0.8">· · · ·</text>
  <text x="1040" y="554" font-family="Georgia, serif" font-size="22"
        fill="#A8C8D8">Jun 2026</text>


  <!-- CSS snippet hint -->
  <text x="80" y="578" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#2A6A3A">flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;</text>


  <!-- ══════════════════════════════════════ -->
  <!-- BOTTOM STRIP                           -->
  <!-- ══════════════════════════════════════ -->
  <rect x="0" y="628" width="1200" height="47" fill="#111E2C" opacity="0.95"/>
  <line x1="0" y1="628" x2="1200" y2="628" stroke="#3A5470" stroke-width="1"/>


  <circle cx="84" cy="651" r="5" fill="#E05050" opacity="0.7"/>
  <text x="100" y="656" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#7A5050">overflow · baseline · squeeze</text>


  <text x="600" y="656" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#3A5470" text-anchor="middle"
        letter-spacing="3">CSS · FLEXBOX · DOT LEADER · TYPOGRAPHY</text>


  <circle cx="960" cy="651" r="5" fill="#2AD878" opacity="0.7"/>
  <text x="976" y="656" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#2A7A4A">3 challenges · 1 elegant solution</text>


</svg>
