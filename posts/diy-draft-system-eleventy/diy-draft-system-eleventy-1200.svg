  <text class="text-muted" x="706" y="260" font-family="'JetBrains Mono', monospace" font-size="13">└── 📄 .eleventy.js</text>
  <text class="text-comment" x="706" y="284" font-family="'JetBrains Mono', monospace" font-size="12"># no _drafts/ needed 🎉</text>
