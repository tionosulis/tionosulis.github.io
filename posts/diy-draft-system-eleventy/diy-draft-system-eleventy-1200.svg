  <rect class="inner-badge-bg" x="72" y="324" width="460" height="26" rx="5" stroke-width="1"/>
  <text class="accent-err-txt" x="84" y="341" font-family="'JetBrains Mono', monospace" font-size="12">❌ requires a separate _drafts/ folder structure</text>
  <rect class="inner-badge-bg" x="72" y="358" width="460" height="26" rx="5" stroke-width="1"/>
  <text class="accent-err-txt" x="84" y="375" font-family="'JetBrains Mono', monospace" font-size="12">❌ no live hot-reload preview URL path available</text>
  <rect class="inner-badge-bg" x="72" y="392" width="460" height="24" rx="5" stroke-width="1"/>
  <text class="accent-err-txt" x="302" y="408" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">🔗 no preview url link activation supported</text>
  <circle class="canvas-bg frame-border" cx="600" cy="270" r="32" stroke-width="1.5"/>
  <text class="text-muted" x="600" y="278" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" text-anchor="middle">vs</text>
  <rect class="panel-bg-right" x="648" y="85" width="500" height="370" rx="14" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="648" y="85" width="500" height="4" rx="2" fill="#10D9A8" opacity="0.9"/>
  <text class="accent-ok-txt" x="898" y="120" font-family="'JetBrains Mono', monospace" font-size="17" text-anchor="middle" font-weight="bold">The DIY Way</text>
  <text class="text-comment" x="898" y="140" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="2">frontmatter flag approach</text>
  <line class="frame-border" x1="676" y1="154" x2="1120" y2="154" stroke-width="1"/>
  <text class="text-primary" x="686" y="184" font-family="'JetBrains Mono', monospace" font-size="13">📁 your-eleventy-site/</text>
