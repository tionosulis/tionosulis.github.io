  <text class="text-muted" x="110" y="260" font-family="'JetBrains Mono', monospace" font-size="13">├── 📁 posts/</text>
  <text class="text-muted" x="110" y="284" font-family="'JetBrains Mono', monospace" font-size="13">└── 📄 .eleventy.js</text>
