  <rect class="inner-badge-bg" x="668" y="324" width="460" height="26" rx="5" stroke-width="1"/>
  <text class="accent-ok-txt" x="680" y="341" font-family="'JetBrains Mono', monospace" font-size="12">✅ just one simple core frontmatter boolean flag</text>
  <rect class="inner-badge-bg" x="668" y="358" width="460" height="26" rx="5" stroke-width="1"/>
  <text class="accent-ok-txt" x="680" y="375" font-family="'JetBrains Mono', monospace" font-size="12">✅ isolated staging URLs via custom /drafts/ slugs</text>
  <rect class="inner-badge-bg" x="668" y="392" width="460" height="24" rx="5" stroke-width="1.5" stroke="#10B981"/>
  <circle cx="684" cy="404" r="4" fill="#10B981" opacity="0.8"/>
  <text class="accent-ok-txt" x="696" y="408" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">localhost:8080/drafts/my-post-slug/</text>
  <rect class="inner-badge-bg" x="200" y="475" width="800" height="86" rx="12" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="200" y="475" width="800" height="3" rx="2" fill="#4A8AE0" opacity="0.5"/>
  <text class="text-comment" x="245" y="507" font-family="'JetBrains Mono', monospace" font-size="13">---</text>
  <text class="text-primary" x="245" y="525" font-family="'JetBrains Mono', monospace" font-size="13">draft:<tspan class="text-title" font-weight="bold"> true</tspan> <tspan class="text-comment">  # remove this to publish</tspan></text>
  <text class="text-comment" x="245" y="543" font-family="'JetBrains Mono', monospace" font-size="13">---</text>
  <line class="frame-border" x1="600" y1="487" x2="600" y2="549" stroke-width="1"/>
  <text class="text-primary" x="625" y="507" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">➔ <tspan class="accent-err-txt">One line</tspan> to isolate drafts cleanly</text>
  <text class="text-primary" x="625" y="531" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">➔ <tspan class="accent-ok-txt">One line</tspan> to trigger live production</text>
  <line class="frame-border" x1="60" y1="585" x2="1140" y2="585" stroke-width="0.5"/>
  <text class="text-title" x="600" y="605" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">ELEVENTY v3 · DIY DRAFT SYSTEM · FRONTMATTER CONFIGS · ZERO DEPENDENCIES</text>
