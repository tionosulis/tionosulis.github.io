<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">  <defs>
    <style>
      .canvas-bg { fill: #f8f5f0; }
      .grid-dots { fill: #332D28; opacity: 0.15; }
      .frame-border { stroke: #D1C9C0; opacity: 0.8; }
      .panel-bg-left { fill: #FFFFFF; stroke: #DC2626; }
      .panel-bg-right { fill: #FFFFFF; stroke: #16A34A; }
      .inner-badge-bg { fill: #E5DFD9; stroke: #D1C9C0; }
      .text-primary { fill: #332D28; }
      .text-title { fill: #B45309; }
      .text-muted { fill: #8A8075; }
      .text-comment { fill: #8A8075; font-style: italic; }
      .accent-err-txt { fill: #B91C1C; }
      .accent-ok-txt { fill: #16A34A; }
      .folder-highlight { fill: #FEE2E2; }
      @media (prefers-color-scheme: dark) {
        .canvas-bg { fill: #161616; }
        .grid-dots { fill: #453E38; opacity: 0.3; }
        .frame-border { stroke: #453E38; opacity: 0.6; }
        .panel-bg-left { fill: #1E1414; stroke: #4A2020; }
        .panel-bg-right { fill: #0E1E16; stroke: #2A5A3A; }
        .inner-badge-bg { fill: #26221F; stroke: #453E38; }
        .text-primary { fill: #F8F5F0; }
        .text-title { fill: #F59E0B; }
        .text-muted { fill: #A3978E; }
        .text-comment { fill: #7A6A5C; }
        .accent-err-txt { fill: #E07060; }
        .accent-ok-txt { fill: #34D399; }
        .folder-highlight { fill: #1E1414; opacity: 0.7; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle class="grid-dots" cx="12" cy="12" r="0.8"/>
    </pattern>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect class="canvas-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect class="frame-border" x="1" y="1" width="1198" height="628" fill="none" stroke-width="1" rx="2"/>
  <text class="text-title" x="600" y="38" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="3">ELEVENTY DRAFT SYSTEM COMPARISON</text>
  <line class="frame-border" x1="230" y1="50" x2="500" y2="50" stroke-width="0.5"/>
