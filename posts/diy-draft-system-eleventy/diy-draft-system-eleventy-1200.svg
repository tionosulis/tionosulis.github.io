  <line class="frame-border" x1="82" y1="154" x2="522" y2="154" stroke-width="1"/>
  <text class="text-primary" x="90" y="184" font-family="'JetBrains Mono', monospace" font-size="13">📁 your-eleventy-site/</text>
  <text class="text-muted" x="110" y="208" font-family="'JetBrains Mono', monospace" font-size="13">├── 📁 _drafts/</text>
