<text x="320" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#2563eb">Key: Let the scroll container handle overflow, not the positioned parent</text>
<text x="320" y="337" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#636b78">position: absolute → belongs on pre · overflow-x: auto → belongs on inner wrapper</text>
