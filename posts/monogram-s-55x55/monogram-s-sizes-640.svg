<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450">
<rect width="640" height="450" fill="#fafafa" rx="12"/>
<text x="320" y="28" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">The S Monogram — Every Size, One Source</text>
<rect x="40" y="60" width="16" height="16" fill="none" stroke="#d1d5db" stroke-width="1"/>
<text x="48" y="73" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">S</text>
<text x="48" y="90" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">16x16</text>
<rect x="90" y="52" width="32" height="32" fill="none" stroke="#d1d5db" stroke-width="1"/>
<text x="106" y="73" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">S</text>
<text x="106" y="98" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">32x32</text>
<rect x="155" y="45" width="55" height="55" fill="#e0f2fe" stroke="#2563eb" stroke-width="2" rx="4"/>
<text x="182" y="79" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">S</text>
<text x="182" y="112" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">55x55 (Fibonacci)</text>
<rect x="250" y="42" width="40" height="40" fill="none" stroke="#d1d5db" stroke-width="1" rx="4"/>
<text x="270" y="68" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">S</text>
<text x="270" y="98" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">180x180</text>
<rect x="320" y="42" width="42" height="42" fill="none" stroke="#d1d5db" stroke-width="1" rx="4"/>
<text x="341" y="69" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">S</text>
<text x="341" y="98" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">192x192</text>
<rect x="395" y="40" width="48" height="48" fill="none" stroke="#d1d5db" stroke-width="1" rx="8"/>
<rect x="403" y="48" width="32" height="32" fill="#2563eb" rx="6"/>
<text x="419" y="69" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fafafa" text-anchor="middle">S</text>
<text x="419" y="102" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">512x512</text>
<line x1="40" y1="125" x2="600" y2="125" stroke="#d1d5db" stroke-width="1"/>
<text x="320" y="148" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">SVG Favicon: Dark Mode Aware</text>
<rect x="40" y="160" width="275" height="120" fill="#f0f0f0" rx="6"/>
<text x="55" y="178" font-family="monospace, monospace" font-size="9" fill="#5c6370" text-anchor="start">&lt;svg viewBox="0 0 55 55"&gt;</text>
<text x="55" y="192" font-family="monospace, monospace" font-size="9" fill="#b84d00" text-anchor="start"> &lt;rect fill="#fafafa"/&gt;</text>
<text x="55" y="206" font-family="monospace, monospace" font-size="9" fill="#2563eb" text-anchor="start"> &lt;text x="50%" y="37"&gt;S&lt;/text&gt;</text>
<text x="55" y="220" font-family="monospace, monospace" font-size="9" fill="#c92e3d" text-anchor="start"> &lt;style&gt;</text>
<text x="55" y="234" font-family="monospace, monospace" font-size="9" fill="#c92e3d" text-anchor="start"> @media (prefers-color-scheme: dark) {</text>
<text x="55" y="248" font-family="monospace, monospace" font-size="9" fill="#c92e3d" text-anchor="start"> rect { fill: #0a0a0b; }</text>
<text x="55" y="262" font-family="monospace, monospace" font-size="9" fill="#c92e3d" text-anchor="start"> text { fill: #e4e4e7; }</text>
<text x="55" y="276" font-family="monospace, monospace" font-size="9" fill="#636b78" text-anchor="start"> &lt;/style&gt;&lt;/svg&gt;</text>
<text x="177" y="296" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">One SVG, two themes, zero JavaScript</text>
<rect x="330" y="160" width="270" height="120" fill="#f0f0f0" rx="6"/>
<text x="465" y="182" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">Inline Attributes Rule</text>
<text x="465" y="200" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">No &lt;style&gt; block in SVG for &lt;img&gt;</text>
<text x="465" y="218" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">No HTML entities (&amp;times; → x)</text>
<text x="465" y="236" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">No &lt;defs&gt;-scoped CSS</text>
<text x="465" y="260" font-family="system-ui,sans-serif" font-size="9" fill="#b84d00" text-anchor="middle">inline fill, inline font-family</text>
<line x1="40" y1="300" x2="600" y2="300" stroke="#d1d5db" stroke-width="1"/>
<text x="320" y="320" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">The Golden Ratio Connection</text>
<rect x="160" y="335" width="55" height="55" fill="none" stroke="#2563eb" stroke-width="2" rx="4"/>
<text x="187" y="368" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">S</text>
<text x="187" y="403" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">55px</text>
<text x="260" y="368" font-family="system-ui,sans-serif" font-size="16" fill="#636b78" text-anchor="middle">&#x00F7; &#x03C6; = 34px</text>
<rect x="340" y="345" width="34" height="34" fill="none" stroke="#22c55e" stroke-width="2" rx="4"/>
<text x="357" y="368" font-family="system-ui,sans-serif" font-size="16" fill="#22c55e" text-anchor="middle">&#9681;</text>
<text x="357" y="393" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#22c55e" text-anchor="middle">34px</text>
<text x="440" y="362" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">55 / 1.618 = 33.98</text>
<text x="440" y="377" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">S box and toggle</text>
<text x="440" y="392" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">form a &#x03C6; pair</text>
</svg>