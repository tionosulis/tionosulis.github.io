<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">  <defs>
    <style>
      /* ── LIGHT MODE ── */
      .canvas-bg      { fill: #f8f5f0; }
      .grid-dots      { fill: #332D28; opacity: 0.15; }
      .title-bar      { fill: #332D28; }
      .ui-tab         { fill: #E5DFD9; }
      .ui-tab-text    { fill: #332D28; }
      .ui-border      { stroke: #D1C9C0; }
      .text-code      { fill: #332D28; }
      .text-muted     { fill: #6B6059; }
      .text-prompt    { fill: #D97706; }
      .text-base      { fill: #1C1917; }
      .text-dim       { fill: #332D28; opacity: 0.4; }
      .text-accent    { fill: #D97706; }
      .text-success   { fill: #059669; }
      .text-error     { fill: #DC2626; }
      .text-purple    { fill: #7C3AED; }
      .text-slate     { fill: #475569; }
      .divider-line   { stroke: #D1C9C0; opacity: 0.4; }
      .swatch-purple  { fill: #9a8fac; }
      .swatch-slate   { fill: #94a3b8; }
      .swatch-text    { fill: #1a1a1a; }
      .warn-bg        { fill: #FEF3C7; }
      .ok-bg          { fill: #D1FAE5; }
      .warn-icon      { fill: #D97706; }
      .ok-icon        { fill: #059669; }
      .warn-text      { fill: #332D28; }
      .ok-text        { fill: #332D28; }
      .separator-line { fill: #6B6059; opacity: 0.3; }
      .conclusion     { fill: #1C1917; }
      .monogram       { fill: #D97706; }
      .statusbar-bg   { fill: #332D28; }
      .statusbar-line { stroke: #4A423B; }
      .statusbar-badge { fill: #D97706; }
      .statusbar-badge-text { fill: #F8F5F0; }
      .statusbar-text { fill: #E5DFD9; }


      /* ── DARK MODE ── */
      @media (prefers-color-scheme: dark) {
        .canvas-bg      { fill: #161616; }
        .grid-dots      { fill: #453E38; opacity: 0.3; }
        .title-bar      { fill: #29241F; }
        .ui-tab         { fill: #3D3630; }
        .ui-tab-text    { fill: #F8F5F0; }
        .ui-border      { stroke: #453E38; }
        .text-code      { fill: #D1D6CC; }
        .text-muted     { fill: #7A6A5C; }
        .text-prompt    { fill: #F59E0B; }
        .text-base      { fill: #F8F5F0; }
        .text-dim       { fill: #D1D6CC; opacity: 0.4; }
        .text-accent    { fill: #F59E0B; }
        .text-success   { fill: #10D9A8; }
        .text-error     { fill: #E05050; }
        .text-purple    { fill: #a78bfa; }
        .text-slate     { fill: #94a3b8; }
        .divider-line   { stroke: #453E38; opacity: 0.4; }
        .swatch-purple  { fill: #9a8fac; }
        .swatch-slate   { fill: #94a3b8; }
        .swatch-text    { fill: #1a1a1a; }
        .warn-bg        { fill: #2d1512; }
        .ok-bg          { fill: #183023; }
        .warn-icon      { fill: #F59E0B; }
        .ok-icon        { fill: #10D9A8; }
        .warn-text      { fill: #D1D6CC; }
        .ok-text        { fill: #D1D6CC; }
        .separator-line { fill: #453E38; opacity: 0.4; }
        .conclusion     { fill: #F8F5F0; }
        .monogram       { fill: #F59E0B; }
        .statusbar-bg   { fill: #29241F; }
        .statusbar-line { stroke: #453E38; }
        .statusbar-badge { fill: #F59E0B; }
        .statusbar-badge-text { fill: #1C1917; }
        .statusbar-text { fill: #D1D6CC; }
      }
    </style>


    <pattern id="grid-dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle class="grid-dots" cx="13" cy="13" r="0.8"/>
    </pattern>
  </defs>


  <!-- Canvas -->
  <rect class="canvas-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#grid-dots)"/>


  <!-- Title bar: 44px -->
  <rect class="title-bar" x="0" y="0" width="1200" height="44"/>
  <circle cx="50" cy="22" r="7" fill="#EF4444"/>
  <circle cx="75" cy="22" r="7" fill="#F59E0B"/>
  <circle cx="100" cy="22" r="7" fill="#10B981"/>


  <!-- File tab -->
  <rect class="ui-tab" x="125" y="48" width="170" height="36" rx="8"/>
  <text class="ui-tab-text" x="145" y="73" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">gray-hue.sh</text>


  <!-- Title divider -->
  <line class="ui-border" x1="0" y1="84" x2="1200" y2="84" stroke-width="1.5"/>


  <!-- ── CONTENT: tidak ada transform, y dimulai dari 100 ── -->
  <g font-family="'JetBrains Mono', monospace">


    <!-- Prompt -->
    <text class="text-muted" x="66" y="106" font-size="15">~/blog</text>
    <text class="text-muted" x="142" y="106" font-size="15"> $</text>
    <text class="text-prompt" x="168" y="106" font-size="15"> ./hue --check --secondary</text>


    <!-- Divider -->
    <line class="divider-line" x1="66" y1="122" x2="1134" y2="122" stroke-width="0.5"/>


    <!-- Column labels -->
    <text class="text-purple" x="310" y="152" font-size="14" text-anchor="middle" letter-spacing="2" font-weight="600">PURPLE-GRAY</text>
    <text class="text-slate"  x="890" y="152" font-size="14" text-anchor="middle" letter-spacing="2" font-weight="600">BLUE-GRAY</text>


    <text class="text-muted" x="310" y="173" font-size="13" text-anchor="middle">HSL 265° 10% 65%</text>
    <text class="text-muted" x="890" y="173" font-size="13" text-anchor="middle">HSL 215° 16% 65%</text>


    <!-- vs label -->
    <text class="text-dim" x="600" y="222" font-size="14" text-anchor="middle">vs</text>


    <!-- Swatch left -->
    <rect class="swatch-purple" x="120" y="210" width="380" height="72" rx="6"/>
    <text class="swatch-text" x="310" y="252" font-size="15" text-anchor="middle" font-weight="600" letter-spacing="1">#9A8FAC  —  purple-gray</text>


    <!-- Swatch right -->
    <rect class="swatch-slate" x="700" y="210" width="380" height="72" rx="6"/>
    <text class="swatch-text" x="890" y="252" font-size="15" text-anchor="middle" font-weight="600" letter-spacing="1">#94A3B8  —  slate-400</text>


    <!-- Center vertical divider -->
    <line x1="600" y1="122" x2="600" y2="490" class="text-accent" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>


    <!-- Warn rows left -->
    <rect class="warn-bg" x="120" y="298" width="380" height="28" rx="4"/>
    <text class="warn-icon" x="140" y="317" font-size="13">⚠</text>
    <text class="warn-text" x="162" y="317" font-size="13">hue orphaned — no purple anchor in system</text>


    <rect class="warn-bg" x="120" y="334" width="380" height="28" rx="4"/>
    <text class="warn-icon" x="140" y="353" font-size="13">⚠</text>
    <text class="warn-text" x="162" y="353" font-size="13">warm accent + purple-gray = 3 competing hues</text>


    <!-- OK rows right -->
    <rect class="ok-bg" x="700" y="298" width="380" height="28" rx="4"/>
    <text class="ok-icon" x="720" y="317" font-size="13">✓</text>
    <text class="ok-text" x="742" y="317" font-size="13">warm accent + cool gray = temperature harmony</text>


    <rect class="ok-bg" x="700" y="334" width="380" height="28" rx="4"/>
    <text class="ok-icon" x="720" y="353" font-size="13">✓</text>
    <text class="ok-text" x="742" y="353" font-size="13">consistent hue family across light &amp; dark mode</text>


    <!-- Bottom divider -->
    <line class="divider-line" x1="66" y1="382" x2="1134" y2="382" stroke-width="0.5"/>


    <!-- Quadrant labels -->
    <text class="text-purple" x="310" y="415" font-size="13" text-anchor="middle" opacity="0.6">→ violet quadrant · requires purple accent</text>
    <text class="text-slate"  x="890" y="415" font-size="13" text-anchor="middle" opacity="0.6">→ blue quadrant · works with any warm accent</text>


    <!-- Separator dashes -->
    <text class="text-dim" x="600" y="460" font-size="14" text-anchor="middle">─────────────────────────────────</text>


    <!-- Conclusion -->
    <text class="conclusion" x="600" y="498" font-size="17" text-anchor="middle" font-weight="600">Gray carries a hue. Make it a deliberate one.</text>
</g>


  <!-- ── STATUS BAR: y=560, height=30 ── -->
  <rect class="statusbar-bg" x="0" y="560" width="1200" height="30"/>
  <line class="statusbar-line" x1="0" y1="560" x2="1200" y2="560" stroke-width="1"/>


  <!-- NORMAL badge -->
  <rect class="statusbar-badge" x="30" y="566" width="80" height="18" rx="3"/>
  <text class="statusbar-badge-text" x="70" y="579" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">NORMAL</text>


  <!-- File info -->
  <text class="statusbar-text" x="1170" y="579" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">gray-hue.sh  12L</text>
</svg>