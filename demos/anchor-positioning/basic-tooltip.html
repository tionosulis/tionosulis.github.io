<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Tooltip — CSS Anchor Positioning</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .demo-area {
    text-align: center;
    max-width: 600px;
  }

  .demo-area p {
    margin-bottom: 1rem;
    color: #555;
    font-size: 0.95rem;
  }

  .trigger {
    anchor-name: --tooltip-anchor;
    display: inline-block;
    padding: 0.8rem 1.6rem;
    background: #1d1d1f;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 500;
  }
  .trigger:hover { opacity: 0.85; }

  .tooltip {
    position: fixed;
    position-anchor: --tooltip-anchor;
    bottom: anchor(top);
    left: anchor(center);
    translate: -50% -8px;
    background: #1d1d1f;
    color: #f5f5f7;
    padding: 0.6rem 1rem;
    border-radius: 6px;
    font-size: 0.85rem;
    white-space: nowrap;
    pointer-events: none;
  }

  .tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    translate: -50% 0;
    border: 6px solid transparent;
    border-top-color: #1d1d1f;
  }

  .hint {
    margin-top: 3rem;
    font-size: 0.85rem;
    color: #999;
  }
</style>
</head>
<body>

<div class="demo-area">
  <p>Hover or focus the button below. The tooltip follows it automatically — scroll, resize, the browser handles everything.</p>

  <button class="trigger" id="triggerBtn">Hover me</button>
  <div class="tooltip" id="tooltip">I follow the button</div>

  <div class="hint">Try scrolling the page or resizing the viewport &mdash; the tooltip stays tethered.</div>
</div>

<script>
  // Accessibility: show/hide tooltip on focus/blur
  const btn = document.getElementById('triggerBtn');
  const tip = document.getElementById('tooltip');
  btn.addEventListener('mouseenter', () => tip.style.display = 'block');
  btn.addEventListener('mouseleave', () => tip.style.display = 'none');
  btn.addEventListener('focus', () => tip.style.display = 'block');
  btn.addEventListener('blur', () => tip.style.display = 'none');
  // Default hidden
  tip.style.display = 'none';
</script>
</body>
</html>
