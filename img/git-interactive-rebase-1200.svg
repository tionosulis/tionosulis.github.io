xt" d="M -50 -10 C -10 -25 10 5 40 -15" stroke-width="4" fill="none" filter="url(#sketchy)"/><polygon points="35,-25 55,-15 38,-3" class="title-text" filter="url(#sketchyStrong)"/><rect class="sketch-box-mess" x="-85" y="15" width="170" height="28" rx="4" stroke-width="1.5" filter="url(#sketchy)"/><text class="title-text" x="0" y="33" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">rebase -i HEAD~5</text><text class="text-muted" x="0" y="60" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="12" text-anchor="middle">squash &amp; fixup</text></g><g id="clean-group"><text class="title-text" x="950" y="130" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="bold" text-anchor="middle">THE BOTTOM LINE (After)</text><line class="timeline-axis" x1="950" y1="160" x2="950" y2="480" stroke-width="3" stroke-dasharray="4 4" filter="url(#sketchy)"/><circle class="commit-node-clean" cx="950" cy="310" r="18" filter="url(#sketchyStrong)"/><rect class="sketch-box-clean" x="710" y="345" width="340" height="85" rx="5" stroke-width="1.5" filter="url(#sketchy)"/><text class="text-dark" x="725" y="368" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" font-weight="bold">feat: add form validation</text><text class="text-muted" x="725" y="390" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="12">- Validate email format</text><text class="text-muted" x="725" y="408" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="12">- Show inline error messages</text><rect class="sketch-box-clean" x="680" y="150" width="450" height="350" stroke-width="1.5" rx="6" opacity="0.4" filter="url(#sketchy)"/></g><rect class="statusbar-bg" x="0" y="560" width="1200" height="30" rx="2"/><line class="statusbar-border" x1="0" y1="560" x2="1200" y2="560" stroke-width="1"/><rect class="statusbar-badge" x="30" y="565" width="140" height="20" rx="3"/><text cla