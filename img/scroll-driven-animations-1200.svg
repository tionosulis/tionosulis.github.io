<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><defs><style>      /* ── 1. LIGHT MODE SYSTEM (Cream Canvas #f8f5f0) ── */      .canvas-bg { fill: #f8f5f0; }      .grid-dots { fill: #332D28; opacity: 0.15; }      .title-text { fill: #D97706; font-weight: bold; }      .ui-border { stroke: #D1C9C0; }            /* Elemen Sketsa Animasi */      .sketch-box-old { fill: #FFFFFF; stroke: #332D28; }      .sketch-box-new { fill: #FFFFFF; stroke: #D97706; }      .connector-line { stroke: #8A8075; }      .viewport-frame { stroke: #332D28; fill: none; stroke-dasharray: 4 4; }      .progress-bar-fill { fill: #059669; opacity: 0.8; }            /* Tipografi */      .text-dark { fill: #332D28; }      .text-muted { fill: #8A8075; }      .text-badge { fill: #F8F5F0; }      .text-alert { fill: #DC2626; font-weight: bold; }      .text-success { fill: #059669; font-weight: bold; }            /* Status Bar Base */      .statusbar-bg { fill: #332D28; }      .statusbar-border { stroke: #4A423B; }      .statusbar-badge { fill: #D97706; }      .statusbar-info { fill: #F8F5F0; }      /* ── 2. DARK MODE SYSTEM (Charcoal Canvas #161616) ── */      @media (prefers-color-scheme: dark) {        .canvas-bg { fill: #161616; }        .grid-dots { fill: #453E38; opacity: 0.3; }        .title-text { fill: #F59E0B; font-weight: bold; }        .ui-border { stroke: #453E38; }                .sketch-box-old { fill: #241E1A; stroke: #F8F5F0; }        .sketch-box-new { fill: #14261C; stroke: #F59E0B; }        .connector-line { stroke: #A09088; }        .viewport-frame { stroke: #F8F5F0; }        .progress-bar-fill { fill: #10D9A8; }                .text-dark { fill: #D1D6CC; }        .text-muted { fill: #A09088; }        .text-alert { fill: #E05050; }        .text-success { fill: #10D9A8; }                .statusbar-bg { fill: #222222; }        .statusbar-border { stroke: #333333; }        .statusbar-badge { fill: #F59E0B; }        .statusbar-info { fill: #D1D6CC; }      }    </style><pattern id="dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse"><circle class="grid-dots" cx="13" cy="13" r="0.8"/></pattern><!-- Filter Efek Sketsa Tangan --><filter id="sketchy"><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="sketchyStrong"><feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs><!-- Kanvas Latar Belakang --><rect class="canvas-bg" width="1200" height="630"/><rect width="1200" height="630" fill="url(#dots)"/><!-- Header Judul Utama --><text class="title-text" x="600" y="55" font-family="'JetBrains Mono', monospace" font-size="20" text-anchor="middle" letter-spacing="2">SCROLL-DRIVEN ANIMATIONS</text><line class="ui-border" x1="250" y1="75" x2="950" y2="75" stroke-width="1.5"/><!-- KIRI: THE OLD WAY (Heavy Main Thread JavaScript) --><g id="old-way-group"><text class="text-dark" x="250" y="130" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">THE OLD WAY (JavaScript)</text><!-- Representasi Tumpukan Beban Script --><rect class="sketch-box-old" x="120" y="180" width="260" height="40" rx="4" stroke-width="1.5" filter="url(#sketchy)"/><text class="text-alert" x="140" y="205" font-family="'JetBrains Mono', monospace" font-size="13">window.addEventListener('scroll')</text><rect class="sketch-box-old" x="120" y="235" width="260" height="40" rx="4" stroke-width="1.5" filter="url(#sketchy)"/><text class="text-alert" x="140" y="260" font-family="'JetBrains Mono', monospace" font-size="13">getBoundingClientRect()</text><path class="connector-line" d="M 250 285 Q 210 320 250 350" fill="none" stroke-width="2" stroke-dasharray="5 4" filter="url(#sketchy)"/><!-- Indikator Dampak Buruk Kinerja --><text class="text-alert" x="250" y="380" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">⚠ Main Thread Jank</text><text class="text-muted" x="250" y="405" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">Forced synchronous layout</text><rect class="sketch-box-old" x="110" y="430" width="280" height="45" rx="4" stroke-width="1.5" filter="url(#sketchy)"/><text class="text-dark" x="125" y="458" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">~50 Lines of Extra Code</text><!-- Pembungkus Box Sketsa Luar Kiri --><rect class="sketch-box-old" x="70" y="150" width="360" height="350" fill="none" stroke-width="1.5" rx="6" opacity="0.4" filter="url(#sketchy)"/></g><!-- TENGAH: TRANSFORMATION (Compositor Thread Arrow) --><g id="migration-group" transform="translate(600, 310)"><path class="title-text" d="M -50 -10 C -10 -25 10 5 40 -15" stroke-width="4" fill="none" filter="url(#sketchy)"/><polygon points="35,-25 55,-15 38,-3" class="title-text" filter="url(#sketchyStrong)"/><rect class="sketch-box-old" x="-85" y="15" width="170" height="28" rx="4" stroke-width="1.5" filter="url(#sketchy)"/><text class="title-text" x="0" y="33" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">Native CSS</text><text class="text-muted" x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">Compositor Thread</text></g><!-- KANAN: THE CSS WAY (Scroll & View Timelines) --><g id="css-way-group"><text class="title-text" x="910" y="130" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">THE CSS WAY (Compositor)</text><!-- 1. Metafora scroll() Timeline --><rect class="sketch-box-new" x="700" y="180" width="360" height="45" rx="5" stroke-width="1.5" filter="url(#sketchy)"/><text class="text-success" x="715" y="208" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">scroll(root) Timeline</text><!-- Visual Progress Bar Mini --><rect class="canvas-bg ui-border" x="890" y="193" width="150" height="16" stroke-width="1"/><rect class="progress-bar-fill" x="890" y="193" width="95" height="16" filter="url(#sketchy)"/><!-- 2. Metafora view() Timeline --><rect class="sketch-box-new" x="700" y="245" width="360" height="185" rx="5" stroke-width="1.5" filter="url(#sketchy)"/><text class="text-success" x="715" y="275" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">view() Intersection Timeline</text><!-- Gambar Sketsa Viewport Simulasi --><rect class="viewport-frame" x="735" y="300" width="290" height="110" stroke-width="1.5" filter="url(#sketchy)"/><text class="text-muted" x="745" y="320" font-family="'JetBrains Mono', monospace" font-size="11">browser viewport</text><!-- Card yang Ter-reveal di dalam Viewport --><rect class="sketch-box-new" x="800" y="335" width="160" height="60" rx="3" stroke-width="1.5" filter="url(#sketchyStrong)"/><text class="text-dark" x="820" y="360" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">reveal-card</text><text class="text-muted" x="820" y="378" font-family="'JetBrains Mono', monospace" font-size="11">opacity: 0 → 1</text><!-- Pembungkus Box Sketsa Luar Kanan --><rect class="sketch-box-new" x="660" y="150" width="440" height="350" fill="none" stroke-width="1.5" rx="6" opacity="0.4" filter="url(#sketchy)"/></g><!-- RE-ENGINEERED FLOATING STATUS BAR & EXACT 40px BOTTOM WHITESPACE --><rect class="statusbar-bg" x="0" y="560" width="1200" height="30" rx="2"/><line class="statusbar-border" x1="0" y1="560" x2="1200" y2="560" stroke-width="1"/><rect class="statusbar-badge" x="30" y="565" width="140" height="20" rx="3"/><text class="text-badge" x="100" y="579" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">DECLARATIVE CSS</text><text class="statusbar-info" x="1170" y="579" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">animation-timeline · compositor-driven</text></svg>