<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#243447"/>
      <stop offset="100%" style="stop-color:#1E2C3A"/>
    </linearGradient>
    <linearGradient id="leftPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1414"/>
      <stop offset="100%" style="stop-color:#1E1414"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0E1E16"/>
      <stop offset="100%" style="stop-color:#0E1E16"/>
    </linearGradient>


    <!-- Grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#2D4055" stroke-width="0.6"/>
    </pattern>


    <!-- Glow filters -->
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#E06050" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="tintedBlur"/>
      <feMerge><feMergeNode in="tintedBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mintGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="subtleGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerLift" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>


  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>


  <!-- Ambient glow orbs -->
  <ellipse cx="280" cy="338" rx="320" ry="260" fill="#1A3A20" opacity="0.12"/>
  <ellipse cx="920" cy="338" rx="300" ry="240" fill="#1A4A30" opacity="0.14"/>


  <!-- Outer frame — lifts image on light mode -->
  <rect x="1" y="1" width="1198" height="673" rx="10" ry="10"
        fill="none" stroke="#3D536A" stroke-width="2" opacity="0.7"
        filter="url(#outerLift)"/>
  <!-- Corner accents -->
  <path d="M 1 18 L 1 1 L 18 1" fill="none" stroke="#E06050" stroke-width="2" opacity="0.6"/>
  <path d="M 1182 1 L 1199 1 L 1199 18" fill="none" stroke="#10D9A8" stroke-width="2" opacity="0.6"/>
  <path d="M 1 657 L 1 674 L 18 674" fill="none" stroke="#E06050" stroke-width="2" opacity="0.5"/>
  <path d="M 1182 674 L 1199 674 L 1199 657" fill="none" stroke="#10D9A8" stroke-width="2" opacity="0.5"/>


  <!-- Top accent line — split color -->
  <rect x="0" y="0" width="594" height="3" fill="#E06050" opacity="0.7"/>
  <rect x="606" y="0" width="594" height="3" fill="#10D9A8" opacity="0.7"/>
  <rect x="594" y="0" width="12" height="3" fill="#3D536A" opacity="0.5"/>


  <!-- ═══════════════════════════════════ -->
  <!-- LEFT PANEL — ERROR STATE           -->
  <!-- ═══════════════════════════════════ -->
  <rect x="60" y="72" width="500" height="531" rx="12"
        fill="url(#leftPanel)" stroke="#4A2020" stroke-width="1.5"
        filter="url(#softShadow)"/>


  <!-- Terminal bar -->
  <rect x="60" y="72" width="500" height="36" rx="12" fill="#1E1414"/>
  <rect x="60" y="90" width="500" height="18" fill="#1E1414"/>
  <!-- Traffic lights -->
  <circle cx="92" cy="90" r="6" fill="#E06050"/>
  <circle cx="114" cy="90" r="6" fill="#E06050"/>
  <circle cx="136" cy="90" r="6" fill="#2D4055"/>
  <!-- Terminal title -->
  <text x="310" y="95" font-family="'Courier New', Courier, monospace" font-size="12"
        fill="#E07060" text-anchor="middle">eleventy build — error</text>


  <!-- STATE label -->
  <text x="310" y="142" font-family="'Courier New', Courier, monospace"
        font-size="13" font-weight="bold" fill="#E06050"
        text-anchor="middle" letter-spacing="4">BEFORE</text>


  <!-- Code block: the failing snippet -->
  <rect x="88" y="158" width="444" height="72" rx="6" fill="#1A2634" stroke="#4A2020" stroke-width="1"/>
  <!-- Syntax: backtick fence with njk -->
  <text x="108" y="181" font-family="'Courier New', Courier, monospace" font-size="15" fill="#6A8AAA">```</text>
  <text x="145" y="181" font-family="'Courier New', Courier, monospace" font-size="15" fill="#E07060" font-weight="bold">njk</text>
  <text x="108" y="204" font-family="'Courier New', Courier, monospace" font-size="13" fill="#A0B8D0">{% set ogImage = image %}</text>
  <text x="108" y="222" font-family="'Courier New', Courier, monospace" font-size="15" fill="#6A8AAA">```</text>


  <!-- Error output block — the hero element -->
  <rect x="88" y="248" width="444" height="130" rx="6" fill="#1E1414" stroke="#4A2020" stroke-width="1.5"/>


  <!-- Red left border accent -->
  <rect x="88" y="248" width="4" height="130" rx="2" fill="#E06050" opacity="0.9"/>


  <!-- Error icon -->
  <text x="112" y="280" font-family="'Courier New', Courier, monospace" font-size="14" fill="#E06050">✖</text>


  <!-- Error text — big and readable -->
  <text x="132" y="280" font-family="'Courier New', Courier, monospace"
        font-size="14" fill="#E06050" font-weight="bold">[11ty] ShikiError:</text>


  <text x="108" y="308" font-family="'Courier New', Courier, monospace"
        font-size="20" fill="#E06050" font-weight="bold"
        filter="url(#redGlow)">Language `njk` not found</text>


  <text x="108" y="338" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#E07060">you may need to load it first</text>


  <text x="108" y="364" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#B05040">→ syntax highlighting failed</text>


  <!-- What this means -->
  <text x="310" y="418" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#E07060" text-anchor="middle">Nunjucks (.njk) is not a</text>
  <text x="310" y="438" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#E07060" text-anchor="middle">bundled Shiki language</text>


  <!-- Tag pills showing what failed -->
  <rect x="138" y="462" width="100" height="34" rx="6" fill="#1E1414" stroke="#4A2020" stroke-width="1.5"/>
  <text x="188" y="484" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#E06050" text-anchor="middle">```njk</text>


  <rect x="252" y="462" width="120" height="34" rx="6" fill="#1E1414" stroke="#4A2020" stroke-width="1.5"/>
  <text x="312" y="484" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#E07060" text-anchor="middle">not found</text>


  <rect x="386" y="462" width="100" height="34" rx="6" fill="#1E1414" stroke="#4A2020" stroke-width="1.5"/>
  <text x="436" y="484" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#E06050" text-anchor="middle">✖ build</text>


  <!-- Bottom status -->
  <rect x="88" y="516" width="444" height="66" rx="6" fill="#1E1414" stroke="#4A2020" stroke-width="1"/>
  <text x="108" y="540" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#B05040">$ eleventy --serve</text>
  <text x="108" y="560" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#E06050">✖ Build failed · 1 error</text>
  <text x="108" y="574" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#B05040">plain text fallback — no colors</text>


  <!-- ═══════════════════════════════════ -->
  <!-- ARROW / DIVIDER                     -->
  <!-- ═══════════════════════════════════ -->
  <!-- Arrow shaft -->
  <line x1="578" y1="338" x2="622" y2="338" stroke="#3D536A" stroke-width="2"/>
  <!-- Arrow head -->
  <polygon points="622,330 638,338 622,346" fill="#4A8AE0" opacity="0.7"/>
  <!-- fix label -->
  <text x="600" y="324" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4A8AE0" text-anchor="middle" opacity="0.8">fix</text>


  <!-- ═══════════════════════════════════ -->
  <!-- RIGHT PANEL — RESOLVED STATE        -->
  <!-- ═══════════════════════════════════ -->
  <rect x="640" y="72" width="500" height="531" rx="12"
        fill="url(#rightPanel)" stroke="#2A5A3A" stroke-width="1.5"
        filter="url(#softShadow)"/>


  <!-- Terminal bar -->
  <rect x="640" y="72" width="500" height="36" rx="12" fill="#0E1E16"/>
  <rect x="640" y="90" width="500" height="18" fill="#0E1E16"/>
  <!-- Traffic lights -->
  <circle cx="672" cy="90" r="6" fill="#2D4055"/>
  <circle cx="694" cy="90" r="6" fill="#2D4055"/>
  <circle cx="716" cy="90" r="6" fill="#0FCC50"/>
  <!-- Terminal title -->
  <text x="890" y="95" font-family="'Courier New', Courier, monospace" font-size="12"
        fill="#4DC896" text-anchor="middle">eleventy build — ok</text>


  <!-- STATE label -->
  <text x="890" y="142" font-family="'Courier New', Courier, monospace"
        font-size="13" font-weight="bold" fill="#10D9A8"
        text-anchor="middle" letter-spacing="4"
        filter="url(#subtleGlow)">AFTER</text>


  <!-- Code block: fixed snippet -->
  <rect x="668" y="158" width="444" height="72" rx="6" fill="#0E1E16" stroke="#2A5A3A" stroke-width="1"/>
  <text x="688" y="181" font-family="'Courier New', Courier, monospace" font-size="15" fill="#6A8AAA">```</text>
  <text x="725" y="181" font-family="'Courier New', Courier, monospace" font-size="15" fill="#10D9A8" font-weight="bold">html</text>
  <text x="688" y="204" font-family="'Courier New', Courier, monospace" font-size="13" fill="#A0B8D0">{% set ogImage = image %}</text>
  <text x="688" y="222" font-family="'Courier New', Courier, monospace" font-size="15" fill="#6A8AAA">```</text>


  <!-- Success output block -->
  <rect x="668" y="248" width="444" height="130" rx="6" fill="#0E1E16" stroke="#2A5A3A" stroke-width="1.5"/>


  <!-- Green left border accent -->
  <rect x="668" y="248" width="4" height="130" rx="2" fill="#10D9A8" opacity="0.8"/>


  <!-- Success icon -->
  <text x="692" y="280" font-family="'Courier New', Courier, monospace" font-size="14" fill="#10D9A8">✔</text>


  <text x="712" y="280" font-family="'Courier New', Courier, monospace"
        font-size="14" fill="#10D9A8" font-weight="bold">[11ty] Build finished:</text>


  <text x="688" y="308" font-family="'Courier New', Courier, monospace"
        font-size="20" fill="#10D9A8" font-weight="bold"
        filter="url(#mintGlow)">Highlighting works</text>


  <text x="688" y="338" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#4DC896">html tag → 90% syntax coverage</text>


  <text x="688" y="364" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#4DC896">→ zero config changes needed</text>


  <!-- What this means -->
  <text x="890" y="418" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#4DC896" text-anchor="middle">Use html — Nunjucks is</text>
  <text x="890" y="438" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#4DC896" text-anchor="middle">mostly HTML anyway</text>


  <!-- Tag pills showing what works -->
  <rect x="718" y="462" width="104" height="34" rx="6" fill="#0E1E16" stroke="#2A5A3A" stroke-width="1.5"/>
  <text x="770" y="484" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#10D9A8" text-anchor="middle">```html</text>


  <rect x="836" y="462" width="120" height="34" rx="6" fill="#0E1E16" stroke="#2A5A3A" stroke-width="1.5"/>
  <text x="896" y="484" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#4DC896" text-anchor="middle">highlighted</text>


  <rect x="970" y="462" width="100" height="34" rx="6" fill="#0E1E16" stroke="#2A5A3A" stroke-width="1.5"/>
  <text x="1020" y="484" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#10D9A8" text-anchor="middle">✔ build</text>


  <!-- Bottom status -->
  <rect x="668" y="516" width="444" height="66" rx="6" fill="#0E1E16" stroke="#2A5A3A" stroke-width="1"/>
  <text x="688" y="540" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#4DC896">$ eleventy --serve</text>
  <text x="688" y="560" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#10D9A8">✔ Wrote 12 files in 1.23s</text>
  <text x="688" y="574" font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4DC896">syntax colors applied · no errors</text>


  <!-- ═══════════════════════════════════ -->
  <!-- BOTTOM STRIP                        -->
  <!-- ═══════════════════════════════════ -->
  <rect x="0" y="628" width="1200" height="47" fill="#1A2634" opacity="0.9"/>
  <line x1="0" y1="628" x2="1200" y2="628" stroke="#2D4055" stroke-width="1"/>


  <circle cx="84" cy="651" r="5" fill="#E06050" opacity="0.7"/>
  <text x="100" y="656" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#B05040">ShikiError: Language `njk` not found</text>


  <text x="600" y="656" font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#6A8AAA" text-anchor="middle"
        letter-spacing="3">SHIKI · ELEVENTY · NUNJUCKS · SYNTAX HIGHLIGHTING</text>


  <circle cx="1020" cy="651" r="5" fill="#10D9A8" opacity="0.7"/>
  <text x="1036" y="656" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#2A8A5A">fixed with html tag</text>


</svg>
