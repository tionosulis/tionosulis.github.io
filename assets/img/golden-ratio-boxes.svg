<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .box-before { fill: #f0f0f0; stroke: #d1d5db; stroke-width: 1; }
      .box-after { fill: #f0f0f0; stroke: #2563eb; stroke-width: 1.5; }
      .cell { fill: #fafafa; stroke: #d1d5db; stroke-width: 1.5; }
      .cell-accent { fill: #fafafa; stroke: #2563eb; stroke-width: 1.5; }
      .title { fill: #1a1a1a; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .label { fill: #5c6370; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-after { fill: #2563eb; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .s-char { fill: #1a1a1a; font-family: system-ui, sans-serif; font-size: 24px; font-weight: 700; text-anchor: middle; }
      .s-char-after { fill: #1a1a1a; font-family: system-ui, sans-serif; font-size: 26px; font-weight: 700; text-anchor: middle; }
      .toggle-char { fill: #5c6370; font-family: system-ui, sans-serif; font-size: 18px; text-anchor: middle; }
      .dim { fill: #636b78; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .accent-text { fill: #2563eb; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .mono { fill: #2563eb; font-family: ui-monospace, monospace; font-size: 11px; text-anchor: start; }
      .arrow { fill: #636b78; font-family: system-ui, sans-serif; font-size: 24px; text-anchor: middle; }
      .line-phi { stroke: #2563eb; stroke-width: 1; stroke-dasharray: 3, 3; }
      .footer { fill: #636b78; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #18181b; }
        .box-before { fill: #27272a; stroke: #3f3f46; }
        .box-after { fill: #27272a; stroke: #60a5fa; }
        .cell { fill: #18181b; stroke: #3f3f46; }
        .cell-accent { fill: #18181b; stroke: #60a5fa; }
        .title { fill: #e4e4e7; }
        .label { fill: #a1a1aa; }
        .label-after { fill: #60a5fa; }
        .s-char { fill: #e4e4e7; }
        .s-char-after { fill: #e4e4e7; }
        .toggle-char { fill: #a1a1aa; }
        .dim { fill: #8a8a94; }
        .accent-text { fill: #60a5fa; }
        .mono { fill: #60a5fa; }
        .arrow { fill: #8a8a94; }
        .line-phi { stroke: #60a5fa; }
        .footer { fill: #8a8a94; }
      }
    </style>
  </defs>

  <rect class="bg" width="640" height="320" rx="12"/>

  <text x="320" y="28" class="title">Golden Ratio: S Monogram &amp; Theme Toggle</text>

  <!-- Before -->
  <rect x="30" y="50" width="260" height="250" class="box-before" rx="8"/>
  <text x="160" y="75" class="label">Before — No Proportional Relationship</text>

  <rect x="134" y="100" width="52" height="52" class="cell" rx="6"/>
  <text x="160" y="134" class="s-char">S</text>
  <text x="160" y="172" class="dim">52 &#x00D7; 52</text>

  <rect x="142" y="210" width="36" height="32" class="cell" rx="6"/>
  <text x="160" y="231" class="toggle-char">&#x25C9;</text>
  <text x="160" y="272" class="dim">~30 &#x00D7; 35 (padding-driven)</text>
  <text x="160" y="286" class="dim">No relation to S box</text>

  <!-- Arrow -->
  <text x="320" y="180" class="arrow">&#x2192;</text>

  <!-- After -->
  <rect x="350" y="50" width="260" height="250" class="box-after" rx="8"/>
  <text x="480" y="75" class="label-after">After — &#x03C6; Relationship</text>

  <rect x="452.5" y="97.5" width="55" height="55" class="cell-accent" rx="6"/>
  <text x="480" y="134" class="s-char-after">S</text>
  <text x="480" y="172" class="accent-text">55 &#x00D7; 55 (Fibonacci)</text>

  <rect x="463" y="213" width="34" height="34" class="cell-accent" rx="6"/>
  <text x="480" y="235" class="toggle-char">&#x25C9;</text>
  <text x="480" y="272" class="accent-text">34 &#x00D7; 34 = 55 &#x00F7; &#x03C6;</text>

  <line x1="480" y1="152.5" x2="480" y2="213" class="line-phi"/>
  <text x="490" y="185" class="mono">&#x00F7; &#x03C6;</text>

  <text x="320" y="313" class="footer">&#x03C6; (phi) = 1.618 — the golden ratio</text>
</svg>
