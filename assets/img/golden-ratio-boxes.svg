<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <rect width="640" height="320" fill="#fafafa" rx="12"/>
  <text x="320" y="28" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Golden Ratio: S Monogram and Theme Toggle</text>

  <rect x="30" y="50" width="260" height="250" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <text x="160" y="75" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#5c6370" text-anchor="middle">Before - No Proportional Relationship</text>

  <rect x="134" y="100" width="52" height="52" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="160" y="134" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="middle">S</text>
  <text x="160" y="172" font-family="system-ui,sans-serif" font-size="11" fill="#636b78" text-anchor="middle">52 x 52</text>

  <rect x="142" y="210" width="36" height="32" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="160" y="231" font-family="system-ui,sans-serif" font-size="18" fill="#5c6370" text-anchor="middle">O</text>
  <text x="160" y="272" font-family="system-ui,sans-serif" font-size="11" fill="#636b78" text-anchor="middle">~30 x 35 (padding-driven)</text>

  <text x="320" y="180" font-family="system-ui,sans-serif" font-size="24" fill="#636b78" text-anchor="middle">-></text>

  <rect x="350" y="50" width="260" height="250" fill="#f0f0f0" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="480" y="75" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">After - phi Relationship</text>

  <rect x="452.5" y="97.5" width="55" height="55" fill="#fafafa" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="480" y="134" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">S</text>
  <text x="480" y="172" font-family="system-ui,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">55 x 55 (Fibonacci)</text>

  <rect x="463" y="213" width="34" height="34" fill="#fafafa" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="480" y="235" font-family="system-ui,sans-serif" font-size="16" fill="#5c6370" text-anchor="middle">O</text>
  <text x="480" y="272" font-family="system-ui,sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">34 x 34 = 55 / phi</text>

  <line x1="480" y1="152.5" x2="480" y2="213" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="494" y="185" font-family="ui-monospace,monospace" font-size="11" fill="#2563eb">/ phi</text>

  <text x="320" y="313" font-family="system-ui,sans-serif" font-size="11" fill="#636b78" text-anchor="middle">phi (phi) = 1.618 - the golden ratio</text>
</svg>
