<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">  <defs>
    <style>
      .canvas-bg { fill: #f8f5f0; }
      .grid-dots { fill: #332D28; opacity: 0.15; }
      .title-bar { fill: #332D28; }
      .ui-tab { fill: #E5DFD9; }
      .ui-tab-text { fill: #332D28; }
      .ui-border { stroke: #D1C9C0; }
      .panel-bg { fill: #FFFFFF; }
      .callout-bg { fill: #F4F1ED; }
      .text-base { fill: #F8F5F0; }
      .text-dark { fill: #332D28; }
      .text-muted { fill: #8A8075; }
      .text-prompt { fill: #D97706; font-weight: 700; }
      .cursor-color { fill: #D97706; }
      .status-success { fill: #059669; }
      .accent-amber { fill: #D97706; }
      .badge-note { fill: #E5DFD9; }
      .statusbar-bg { fill: #332D28; }
      .statusbar-border { stroke: #4A423B; }
      .statusbar-badge { fill: #D97706; }
      .statusbar-badge-text { fill: #F8F5F0; }
      .statusbar-info { fill: #E5DFD9; }
      @media (prefers-color-scheme: dark) {
        .canvas-bg { fill: #161616; }
        .grid-dots { fill: #453E38; opacity: 0.3; }
        .title-bar { fill: #29241F; }
        .ui-tab { fill: #3D3630; }
        .ui-tab-text { fill: #F8F5F0; }
        .ui-border { stroke: #453E38; }
        .panel-bg { fill: #2E2924; }
        .callout-bg { fill: #1A1A1A; }
        .text-base { fill: #F8F5F0; }
        .text-dark { fill: #D1D6CC; }
        .text-muted { fill: #7A6A5C; }
        .text-prompt { fill: #F59E0B; font-weight: normal; }
        .cursor-color { fill: #F59E0B; }
        .status-success { fill: #10D9A8; }
        .accent-amber { fill: #F59E0B; }
        .badge-note { fill: #332D28; }
        .statusbar-bg { fill: #29241F; }
        .statusbar-border { stroke: #453E38; }
        .statusbar-badge { fill: #F59E0B; }
        .statusbar-badge-text { fill: #1C1917; }
        .statusbar-info { fill: #D1D6CC; }
      }
    </style>
    <pattern id="dynamic-dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle class="grid-dots" cx="13" cy="13" r="0.8"/>
    </pattern>
  </defs>
  <rect class="canvas-bg" width="1200" height="630"/>
  <rect width="1200" height="630" fill="url(#dynamic-dots)"/>
  <rect class="title-bar" x="0" y="0" width="1200" height="44"/>
  <circle cx="50" cy="22" r="7" fill="#EF4444"/>
  <circle cx="75" cy="22" r="7" fill="#F59E0B"/>
  <circle cx="100" cy="22" r="7" fill="#10B981"/>
  <rect class="ui-tab" x="125" y="44" width="200" height="36" rx="8"/>
  <text class="ui-tab-text" x="145" y="67" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">notice-redesign.md</text>
  <line class="ui-border" x1="0" y1="84" x2="1200" y2="84" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', monospace">
    <text class="accent-amber" x="80" y="120" font-size="19" font-weight="700">$</text>
    <text class="text-dark" x="102" y="120" font-size="19">cat posts/golden.md | grep redesign</text>
    <text class="text-muted" x="80" y="155" font-size="19">redesign_notice: true</text>
    <text class="accent-amber" x="80" y="195" font-size="19" font-weight="700">$</text>
    <text class="text-dark" x="102" y="195" font-size="19">./build --preview</text>
    <rect class="callout-bg ui-border" x="230" y="235" width="740" height="135" rx="6" stroke-width="0.75"/>
    <rect class="accent-amber" x="230" y="235" width="3" height="135" opacity="0.8"/>
    <rect class="badge-note" x="254" y="226" width="47" height="18"/>
    <text class="accent-amber" x="259" y="240" font-size="12" font-weight="700" letter-spacing="1">NOTE</text>
    <text class="accent-amber" x="267" y="280" font-size="18">&gt;</text>
    <text class="text-dark" x="290" y="280" font-size="18">This post describes the previous blog design.</text>
    <text class="text-dark" x="290" y="315" font-size="18">The site has since been redesigned.</text>
    <text class="accent-amber" x="80" y="415" font-size="19" font-weight="700">$</text>
    <text class="text-dark" x="102" y="415" font-size="19">echo "done"</text>
    <text class="text-muted" x="235" y="415" font-size="19" opacity="0.7">// one line, zero JS</text>
    <rect class="accent-amber" x="80" y="445" width="380" height="1" opacity="0.2"/>
    <text class="accent-amber" x="80" y="485" font-size="19" font-weight="700">$</text>
    <text class="text-dark" x="102" y="485" font-size="19">find . -name "*.md" | xargs grep redesign_notice | wc -l</text>
    <text class="status-success" x="80" y="520" font-size="19" font-weight="700">3</text>
    <text class="accent-amber" x="80" y="548" font-size="19" font-weight="700">$</text>
    <text class="cursor-color" x="102" y="548" font-size="20" opacity="0.7">▇<animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/></text>
  </g>
  <rect class="statusbar-bg" x="0" y="560" width="1200" height="30"/>
  <line class="statusbar-border" x1="0" y1="560" x2="1200" y2="560" stroke-width="1"/>
  <rect class="statusbar-badge" x="30" y="566" width="80" height="18" rx="3"/>
  <text class="statusbar-badge-text" x="70" y="579" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">NORMAL</text>
  <text class="statusbar-info" x="1170" y="579" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">notice-redesign.md  10L</text>
</svg>
