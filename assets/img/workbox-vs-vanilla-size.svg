<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1A" stop-opacity="1" />
      <stop offset="100%" stop-color="#0D1929" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121D2E" stop-opacity="1" />
      <stop offset="100%" stop-color="#0E1825" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10D9A8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10D9A8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A2744" stroke-width="0.5"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="mintGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <ellipse cx="220" cy="160" rx="280" ry="200" fill="url(#blueGlow)"/>
  <ellipse cx="980" cy="500" rx="260" ry="180" fill="url(#mintGlow)"/>
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>
  <rect x="90" y="68" width="1020" height="539" rx="10" ry="10"
        fill="url(#cardGrad)" stroke="#1E3050" stroke-width="1.5"
        filter="url(#cardShadow)"/>
  <rect x="90" y="68" width="1020" height="40" rx="10" ry="10" fill="#111C2D"/>
  <rect x="90" y="88" width="1020" height="20" fill="#111C2D"/>
  <circle cx="122" cy="88" r="7" fill="#FF5F57"/>
  <circle cx="148" cy="88" r="7" fill="#FEBC2E"/>
  <circle cx="174" cy="88" r="7" fill="#27C840"/>
  <text x="600" y="93" font-family="Courier New, Courier, monospace" font-size="13"
        fill="#4A6080" text-anchor="middle" dominant-baseline="middle">service-worker-comparison.sh</text>
  <g transform="translate(160, 160)">
    <text x="160" y="-12" font-family="Courier New, Courier, monospace" font-size="12"
          fill="#B0C4D8" text-anchor="middle" letter-spacing="2">WORKBOX</text>
    <rect x="40" y="0" width="240" height="180" rx="6" fill="#1A2540" stroke="#2A3F62" stroke-width="1.5"/>
    <line x1="40" y1="60" x2="280" y2="60" stroke="#2A3F62" stroke-width="1"/>
    <line x1="40" y1="120" x2="280" y2="120" stroke="#2A3F62" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="180" stroke="#2A3F62" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="180" stroke="#2A3F62" stroke-width="1"/>
    <text x="80" y="35" font-family="Courier New, Courier, monospace" font-size="9"
          fill="#4A6080" text-anchor="middle">routing</text>
    <text x="160" y="35" font-family="Courier New, Courier, monospace" font-size="9"
          fill="#4A6080" text-anchor="middle">caching</text>
    <text x="240" y="35" font-family="Courier New, Courier, monospace" font-size="9"
          fill="#4A6080" text-anchor="middle">strategies</text>
    <text x="80" y="95" font-family="Courier New, Courier, monospace" font-size="9"
          fill="#4A6080" text-anchor="middle">plugins</text>
    <text x="160" y="95" font-family="Courier New, Courier, monospace" font-size="9"
          fill="#4A6080" text-anchor="middle">expiration</text>
    <text x="240" y="95" font-family="Courier New, Courier, monospace" font-size="9"
          fill="#4A6080" text-anchor="middle">broadcast</text>
    <text x="80" y="155" font-family="Courier New, Courier, monospace" font-size="9"
          fill="#4A6080" text-anchor="middle">precache</text>
    <text x="160" y="155" font-family="Courier New, Courier, monospace" font-size="9"
          fill="#4A6080" text-anchor="middle">background</text>
    <text x="240" y="155" font-family="Courier New, Courier, monospace" font-size="9"
          fill="#4A6080" text-anchor="middle">sync</text>
    <text x="160" y="210" font-family="Courier New, Courier, monospace" font-size="28"
          fill="#3B82F6" text-anchor="middle" font-weight="bold">~50 KB</text>
    <text x="160" y="232" font-family="Courier New, Courier, monospace" font-size="11"
          fill="#4A6080" text-anchor="middle">+ build tooling dependency</text>
  </g>
  <circle cx="600" cy="255" r="28" fill="#0D1525" stroke="#1E3A5A" stroke-width="1.5"/>
  <text x="600" y="262" font-family="Georgia, serif" font-size="18"
        fill="#A0B4C8" text-anchor="middle" font-weight="bold">vs</text>
  <g transform="translate(640, 160)">
    <text x="160" y="-12" font-family="Courier New, Courier, monospace" font-size="12"
          fill="#10D9A8" text-anchor="middle" letter-spacing="2" filter="url(#mintGlowFilter)">VANILLA SW</text>
    <rect x="100" y="56" width="120" height="68" rx="5"
          fill="#0E2218" stroke="#10D9A8" stroke-width="1.5" opacity="0.9"/>
    <line x1="115" y1="74" x2="205" y2="74" stroke="#10D9A8" stroke-width="1.5" opacity="0.5"/>
    <line x1="115" y1="86" x2="185" y2="86" stroke="#10D9A8" stroke-width="1" opacity="0.35"/>
    <line x1="115" y1="98" x2="195" y2="98" stroke="#10D9A8" stroke-width="1" opacity="0.35"/>
    <line x1="115" y1="110" x2="175" y2="110" stroke="#10D9A8" stroke-width="1" opacity="0.35"/>
    <rect x="96" y="52" width="128" height="76" rx="7"
          fill="none" stroke="#10D9A8" stroke-width="1" opacity="0.2"/>
    <circle cx="60" cy="90" r="2" fill="#1A2744" opacity="0.5"/>
    <circle cx="280" cy="75" r="2" fill="#1A2744" opacity="0.5"/>
    <circle cx="270" cy="130" r="2" fill="#1A2744" opacity="0.5"/>
    <circle cx="50" cy="140" r="2" fill="#1A2744" opacity="0.5"/>
    <text x="85" y="100" font-family="Courier New, Courier, monospace" font-size="40"
          fill="#10D9A8" opacity="0.15" text-anchor="middle">{</text>
    <text x="240" y="100" font-family="Courier New, Courier, monospace" font-size="40"
          fill="#10D9A8" opacity="0.15" text-anchor="middle">}</text>
    <text x="160" y="210" font-family="Courier New, Courier, monospace" font-size="28"
          fill="#10D9A8" text-anchor="middle" font-weight="bold" filter="url(#mintGlowFilter)">~1 KB</text>
    <text x="160" y="232" font-family="Courier New, Courier, monospace" font-size="11"
          fill="#10D9A8" text-anchor="middle" opacity="0.7">zero dependencies</text>
  </g>
  <rect x="90" y="565" width="1020" height="42" rx="0" fill="#0B1520" opacity="0.8"/>
  <rect x="90" y="605" width="1020" height="2" rx="0" fill="#111C2D"/>
  <text x="120" y="591" font-family="Courier New, Courier, monospace" font-size="12"
        fill="#10D9A8" opacity="0.7">&#x25CF;</text>
  <text x="138" y="591" font-family="Courier New, Courier, monospace" font-size="12"
        fill="#4A6080">install:event &#xB7; fetch:event &#xB7; activate:event</text>
  <text x="1090" y="591" font-family="Courier New, Courier, monospace" font-size="12"
        fill="#3B82F6" text-anchor="end" opacity="0.8">Offline-First  &#xB7;  No Build Step</text>
  <path d="M 96 76 L 96 88 L 108 88" fill="none" stroke="#10D9A8" stroke-width="1.5" opacity="0.3"/>
  <path d="M 1104 76 L 1104 88 L 1092 88" fill="none" stroke="#10D9A8" stroke-width="1.5" opacity="0.3"/>
  <path d="M 96 598 L 96 586 L 108 586" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>
  <path d="M 1104 598 L 1104 586 L 1092 586" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>
  <text x="600" y="650" font-family="Courier New, Courier, monospace" font-size="12"
        fill="#2A3F5A" text-anchor="middle" letter-spacing="2">PROGRESSIVE WEB APPS &#xB7; VANILLA JS &#xB7; SERVICE WORKERS</text>
</svg>
