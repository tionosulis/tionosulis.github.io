<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D16"/>
      <stop offset="100%" stop-color="#0C1628"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111D30"/>
      <stop offset="100%" stop-color="#0D1726"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071A12"/>
      <stop offset="100%" stop-color="#050F0C"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#131F35" stroke-width="0.6"/>
    </pattern>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mintGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="labelGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
