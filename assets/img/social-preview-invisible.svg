<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EEF0F6"/>
      <stop offset="100%" style="stop-color:#E4E8F2"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#94A3B8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#9CA3B8" fill-opacity="0.2"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Title bar -->
  <text x="600" y="44" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="20" font-weight="700" fill="#1E1B4B" letter-spacing="-0.3">Why SVGs Break Social Media Previews</text>

  <!-- ════════════════════ PANEL 1: BROWSER ════════════════════ -->
  <g transform="translate(28,68)">
    <rect x="0" y="0" width="354" height="560" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- Accent -->
    <rect x="0" y="0" width="354" height="4" rx="2" fill="#6366F1"/>
    <!-- Browser chrome -->
    <rect x="0" y="0" width="354" height="40" rx="12" fill="#F8FAFC"/>
    <rect x="0" y="20" width="354" height="20" fill="#F8FAFC"/>
    <!-- Window dots -->
    <circle cx="20" cy="20" r="4.5" fill="#FF5F56" opacity="0.8"/>
    <circle cx="36" cy="20" r="4.5" fill="#FFBD2E" opacity="0.8"/>
    <circle cx="52" cy="20" r="4.5" fill="#27C93F" opacity="0.8"/>
    <!-- URL bar -->
    <rect x="72" y="13" width="260" height="14" rx="7" fill="#E8ECF4"/>
    <!-- SVG icon in browser content area -->
    <rect x="20" y="56" width="314" height="200" rx="6" fill="#F1F4F9"/>
    <!-- Simplified SVG icon representation -->
    <rect x="40" y="70" width="274" height="172" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <!-- Mini graph lines -->
    <line x1="60" y1="200" x2="120" y2="170" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="120" y1="170" x2="180" y2="180" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="180" y1="180" x2="240" y2="140" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="240" y1="140" x2="300" y2="155" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- SVG badge -->
    <rect x="55" y="75" width="40" height="18" rx="4" fill="#6366F1" opacity="0.15"/>
    <text x="75" y="88" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#6366F1" font-weight="700">SVG</text>
    <text x="285" y="88" text-anchor="end" font-family="'Courier New',monospace" font-size="8" fill="#9CA3AF">hero.svg — 21KB</text>
    <!-- More fake text lines -->
    <rect x="60" y="274" width="100" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="60" y="288" width="180" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="60" y="302" width="160" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="60" y="316" width="140" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="60" y="330" width="200" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="60" y="344" width="120" height="6" rx="3" fill="#D1D5DB"/>
    <!-- Status -->
    <rect x="90" y="380" width="174" height="34" rx="17" fill="#10B981" opacity="0.12"/>
    <text x="151" y="402" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#10B981" font-weight="700">&#10003; Renders perfectly</text>
    <text x="177" y="430" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#475569">SVG works great in browsers</text>
    <text x="177" y="446" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="10" fill="#94A3B8">But social media is not a browser</text>
    <!-- Panel label -->
    <rect x="0" y="530" width="354" height="30" fill="#6366F1" opacity="0.06"/>
    <text x="177" y="550" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#6366F1" letter-spacing="1.5" opacity="0.7">BROWSER</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(390,325)">
    <path d="M0 0 L12 0 L6 -8 M12 0 L6 8" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ════════════════════ PANEL 2: SOCIAL MEDIA EMPTY ════════════════════ -->
  <g transform="translate(423,68)">
    <rect x="0" y="0" width="354" height="560" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="354" height="4" rx="2" fill="#EF4444"/>
    <!-- Tweet composition -->
    <!-- Avatar circle -->
    <circle cx="30" cy="30" r="14" fill="#E8ECF4"/>
    <rect x="52" y="23" width="80" height="8" rx="4" fill="#D1D5DB"/>
    <rect x="52" y="35" width="50" height="6" rx="3" fill="#E8ECF4"/>
    <text x="30" y="64" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">Sharing my latest post...</text>
    <!-- Card preview — broken image -->
    <rect x="15" y="80" width="324" height="280" rx="8" fill="#F8FAFC" stroke="#E8ECF4" stroke-width="1"/>
    <!-- Image area — empty/broken -->
    <rect x="15" y="80" width="324" height="160" rx="8" fill="#F1F4F9"/>
    <!-- Broken image icon -->
    <rect x="15" y="80" width="324" height="160" rx="8" fill="#FAFAFA"/>
    <line x1="140" y1="130" x2="160" y2="155" stroke="#D1D5DB" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="160" y1="130" x2="140" y2="155" stroke="#D1D5DB" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="195" y1="130" x2="215" y2="155" stroke="#D1D5DB" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="215" y1="130" x2="195" y2="155" stroke="#D1D5DB" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="162" y1="145" x2="198" y2="145" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
    <text x="177" y="170" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#9CA3AF">No image</text>
    <!-- Card text -->
    <text x="30" y="262" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="600" fill="#1E1B4B">Dark Mode Done Right</text>
    <text x="30" y="280" font-family="Georgia,'Times New Roman',serif" font-size="10" fill="#64748B">tionosulis.github.io</text>
    <rect x="30" y="290" width="294" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="30" y="302" width="200" height="6" rx="3" fill="#E8ECF4"/>
    <!-- OG tag status -->
    <rect x="90" y="380" width="174" height="34" rx="17" fill="#EF4444" opacity="0.12"/>
    <text x="151" y="402" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#EF4444" font-weight="700">&#10007; No og:image</text>
    <text x="177" y="430" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#475569">SVG is not a supported format</text>
    <text x="177" y="446" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="10" fill="#94A3B8">Platforms require JPEG, PNG, or WebP</text>
    <rect x="0" y="530" width="354" height="30" fill="#EF4444" opacity="0.06"/>
    <text x="177" y="550" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#EF4444" letter-spacing="1.5" opacity="0.7">SOCIAL MEDIA SHARE</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(785,325)">
    <path d="M0 0 L12 0 L6 -8 M12 0 L6 8" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ════════════════════ PANEL 3: SOCIAL MEDIA FIXED ════════════════════ -->
  <g transform="translate(818,68)">
    <rect x="0" y="0" width="354" height="560" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="354" height="4" rx="2" fill="#10B981"/>
    <!-- Tweet composition -->
    <circle cx="30" cy="30" r="14" fill="#E8ECF4"/>
    <rect x="52" y="23" width="80" height="8" rx="4" fill="#D1D5DB"/>
    <rect x="52" y="35" width="50" height="6" rx="3" fill="#E8ECF4"/>
    <text x="30" y="64" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">Sharing my latest post...</text>
    <!-- Card preview — with image -->
    <rect x="15" y="80" width="324" height="280" rx="8" fill="#F8FAFC" stroke="#E8ECF4" stroke-width="1"/>
    <!-- Image area — visible PNG -->
    <rect x="15" y="80" width="324" height="160" rx="8" fill="#EEF0F6"/>
    <!-- Mini graph (same as panel 1) -->
    <line x1="50" y1="200" x2="110" y2="170" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="110" y1="170" x2="170" y2="180" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="170" y1="180" x2="230" y2="140" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="230" y1="140" x2="290" y2="155" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- PNG badge -->
    <rect x="40" y="85" width="44" height="18" rx="4" fill="#10B981" opacity="0.15"/>
    <text x="62" y="98" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#10B981" font-weight="700">PNG</text>
    <text x="290" y="98" text-anchor="end" font-family="'Courier New',monospace" font-size="8" fill="#9CA3AF">og:image — 141KB</text>
    <!-- Card text -->
    <text x="30" y="262" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="600" fill="#1E1B4B">Dark Mode Done Right</text>
    <text x="30" y="280" font-family="Georgia,'Times New Roman',serif" font-size="10" fill="#64748B">tionosulis.github.io</text>
    <rect x="30" y="290" width="294" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="30" y="302" width="200" height="6" rx="3" fill="#E8ECF4"/>
    <!-- OG tag status -->
    <rect x="90" y="380" width="174" height="34" rx="17" fill="#10B981" opacity="0.12"/>
    <text x="151" y="402" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#10B981" font-weight="700">&#10003; og:image set</text>
    <text x="177" y="430" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#475569">PNG fallback renders everywhere</text>
    <text x="177" y="446" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="10" fill="#94A3B8">Same sharp, same image — just rasterized</text>
    <rect x="0" y="530" width="354" height="30" fill="#10B981" opacity="0.06"/>
    <text x="177" y="550" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#10B981" letter-spacing="1.5" opacity="0.7">SOCIAL MEDIA SHARE — FIXED</text>
  </g>

  <!-- Bottom note -->
  <text x="600" y="660" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#94A3B8" font-style="italic">The fix: render SVG to PNG at 1200&#215;630, set og:image meta tag, add frontmatter fallback.</text>
</svg>
