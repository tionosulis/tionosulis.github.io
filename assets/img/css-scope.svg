<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#B45309" opacity="0.08"/>
    </pattern>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <filter id="sketchy">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="630" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="630" fill="#161616"/>
    <rect width="1200" height="630" fill="url(#dots)"/>
    <rect width="1200" height="630" fill="url(#amberGlow)"/>

    <!-- Inner frame -->
    <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#B45309" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Corner accents -->
    <path d="M 32 80 L 32 32 L 80 32"          fill="none" stroke="#B45309" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M 1120 32 L 1168 32 L 1168 80"    fill="none" stroke="#B45309" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M 32 550 L 32 598 L 80 598"       fill="none" stroke="#B45309" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M 1168 550 L 1168 598 L 1120 598" fill="none" stroke="#B45309" stroke-width="2" stroke-opacity="0.45"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="1200" height="44" fill="#B45309" fill-opacity="0.07"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#B45309" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="50" cy="22" r="5.5" fill="#ff5f57" opacity="0.75"/>
    <circle cx="72" cy="22" r="5.5" fill="#febc2e" opacity="0.75"/>
    <circle cx="94" cy="22" r="5.5" fill="#44e86c" opacity="0.75"/>
    <text x="126" y="28" font-family="'JetBrains Mono', monospace" font-size="14" fill="#B45309" opacity="0.95" letter-spacing="0.3" dominant-baseline="middle">css-scope.css</text>

    <!-- ── LEFT PANEL: Visual diagram ── -->
    <rect x="70" y="76" width="480" height="490" fill="#1e1e1e" rx="6"/>

    <!-- Scope boundary dashed rectangle -->
    <rect x="100" y="100" width="420" height="390" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="8 4" rx="8" opacity="0.75"/>

    <!-- "@scope (.card)" label -->
    <rect x="120" y="82" width="180" height="26" fill="#262626" stroke="#B45309" stroke-width="1" rx="3"/>
    <text x="210" y="100" font-family="'JetBrains Mono', monospace" font-size="13" fill="#B45309" text-anchor="middle" dominant-baseline="middle">@scope (.card)</text>

    <!-- Card panel inside scope -->
    <rect x="130" y="128" width="360" height="230" fill="#262626" rx="6"/>

    <!-- Card header -->
    <rect x="150" y="148" width="320" height="40" fill="#333333" rx="4"/>
    <text x="310" y="174" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4" text-anchor="middle" dominant-baseline="middle">:scope { border; padding; }</text>

    <!-- Card title (h3) -->
    <rect x="150" y="202" width="240" height="20" fill="#3a3a3a" rx="3"/>
    <text x="162" y="216" font-family="'JetBrains Mono', monospace" font-size="12" fill="#b8c4d4">h3 { font-weight: 600; }</text>

    <!-- Card body text -->
    <rect x="150" y="232" width="320" height="10" fill="#3a3a3a" rx="2" opacity="0.5"/>
    <rect x="150" y="250" width="280" height="10" fill="#3a3a3a" rx="2" opacity="0.5"/>
    <rect x="150" y="268" width="300" height="10" fill="#3a3a3a" rx="2" opacity="0.5"/>

    <!-- Card image placeholder -->
    <rect x="150" y="292" width="100" height="50" fill="#333333" rx="4"/>
    <text x="200" y="320" font-family="'JetBrains Mono', monospace" font-size="10" fill="#b8c4d4" text-anchor="middle" dominant-baseline="middle">img { border-radius; }</text>

    <!-- "Styles scoped here" annotation -->
    <rect x="280" y="375" width="200" height="28" fill="#262626" stroke="#44e86c" stroke-width="1" rx="3"/>
    <text x="380" y="395" font-family="'JetBrains Mono', monospace" font-size="12" fill="#44e86c" text-anchor="middle" dominant-baseline="middle">Styles stay inside scope</text>

    <!-- Donut scoping section (bottom of left panel) -->
    <rect x="130" y="418" width="360" height="70" fill="none" stroke="#5BA0F6" stroke-width="1.5" stroke-dasharray="4 3" rx="6" opacity="0.85"/>

    <text x="145" y="438" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5BA0F6">to (.card-footer)</text>
    <rect x="145" y="448" width="330" height="28" fill="#262626" rx="3"/>
    <text x="310" y="468" font-family="'JetBrains Mono', monospace" font-size="12" fill="#b8c4d4" text-anchor="middle" dominant-baseline="middle">Excluded from scope (donut hole)</text>

    <!-- ── RIGHT PANEL: Code ── -->
    <rect x="590" y="76" width="545" height="490" fill="#1e1e1e" rx="6"/>

    <!-- Code panel title bar -->
    <rect x="590" y="76" width="545" height="34" fill="#262626" rx="6"/>
    <rect x="590" y="96" width="545" height="14" fill="#262626"/>
    <text x="612" y="98" font-family="'JetBrains Mono', monospace" font-size="13" fill="#b8c4d4" dominant-baseline="middle">style.css</text>

    <!-- CSS code lines -->
    <text x="612" y="140" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">1  <tspan fill="#FBBF24">@scope</tspan> <tspan fill="#b8c4d4">(</tspan><tspan fill="#e4e8f0">.card</tspan><tspan fill="#b8c4d4">) {</tspan></text>
    <text x="612" y="170" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">2    <tspan fill="#b8c4d4">:</tspan><tspan fill="#FBBF24">scope</tspan> <tspan fill="#b8c4d4">{</tspan></text>
    <text x="612" y="196" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">3      <tspan fill="#FBBF24">border</tspan><tspan fill="#b8c4d4">:</tspan> <tspan fill="#5BA0F6">1px solid var(--border)</tspan><tspan fill="#b8c4d4">;</tspan></text>
    <text x="612" y="222" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">4      <tspan fill="#FBBF24">border-radius</tspan><tspan fill="#b8c4d4">:</tspan> <tspan fill="#5BA0F6">8px</tspan><tspan fill="#b8c4d4">;</tspan></text>
    <text x="612" y="248" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">5      <tspan fill="#FBBF24">padding</tspan><tspan fill="#b8c4d4">:</tspan> <tspan fill="#5BA0F6">1rem</tspan><tspan fill="#b8c4d4">;</tspan></text>
    <text x="612" y="274" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">6    <tspan fill="#b8c4d4">}</tspan></text>
    <text x="612" y="304" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">7    <tspan fill="#b8c4d4">&amp; </tspan><tspan fill="#FBBF24">h3</tspan> <tspan fill="#b8c4d4">{</tspan> <tspan fill="#FBBF24">font-weight</tspan><tspan fill="#b8c4d4">:</tspan> <tspan fill="#5BA0F6">600</tspan><tspan fill="#b8c4d4">; }</tspan></text>
    <text x="612" y="334" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">8    <tspan fill="#b8c4d4">&amp; </tspan><tspan fill="#FBBF24">p</tspan> <tspan fill="#b8c4d4">{</tspan> <tspan fill="#FBBF24">color</tspan><tspan fill="#b8c4d4">:</tspan> <tspan fill="#5BA0F6">var(--text-secondary)</tspan><tspan fill="#b8c4d4">; }</tspan></text>
    <text x="612" y="364" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">9    <tspan fill="#b8c4d4">&amp; </tspan><tspan fill="#FBBF24">img</tspan> <tspan fill="#b8c4d4">{</tspan> <tspan fill="#FBBF24">border-radius</tspan><tspan fill="#b8c4d4">:</tspan> <tspan fill="#5BA0F6">0.5rem</tspan><tspan fill="#b8c4d4">; }</tspan></text>
    <text x="612" y="394" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">10 <tspan fill="#b8c4d4">}</tspan></text>

    <!-- Divider -->
    <line x1="612" y1="420" x2="1115" y2="420" stroke="#3a3a3a" stroke-width="1"/>

    <!-- Donut scoping section -->
    <text x="612" y="448" font-family="'JetBrains Mono', monospace" font-size="13" fill="#b8c4d4">/* Donut scoping — exclude subtree */</text>
    <text x="612" y="478" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">11 <tspan fill="#FBBF24">@scope</tspan> <tspan fill="#b8c4d4">(</tspan><tspan fill="#e4e8f0">.card</tspan><tspan fill="#b8c4d4">) </tspan><tspan fill="#FBBF24">to</tspan> <tspan fill="#b8c4d4">(</tspan><tspan fill="#e4e8f0">.card-footer</tspan><tspan fill="#b8c4d4">) {</tspan></text>
    <text x="612" y="508" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">12   <tspan fill="#b8c4d4">&amp; </tspan><tspan fill="#FBBF24">a</tspan> <tspan fill="#b8c4d4">{</tspan> <tspan fill="#FBBF24">color</tspan><tspan fill="#b8c4d4">:</tspan> <tspan fill="#5BA0F6">var(--accent)</tspan><tspan fill="#b8c4d4">; }</tspan></text>
    <text x="612" y="538" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b8c4d4">13 <tspan fill="#b8c4d4">}</tspan></text>

    <!-- Status bar -->
    <rect x="0" y="606" width="1200" height="24" fill="#B45309" fill-opacity="0.05"/>
    <line x1="0" y1="606" x2="1200" y2="606" stroke="#B45309" stroke-width="1" stroke-opacity="0.15"/>
    <text x="20" y="620" font-family="'JetBrains Mono', monospace" font-size="12" fill="#B45309" opacity="0.8">NORMAL</text>
    <text x="900" y="620" font-family="'JetBrains Mono', monospace" font-size="12" fill="#b8c4d4" opacity="0.5">@scope · component isolation · July 2026</text>
  </g>

  <rect width="1200" height="630" rx="10" ry="10" fill="none" stroke="#B45309" stroke-width="1.5" stroke-opacity="0.35"/>
</svg>
