<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Main flat background -->
  <rect x="0" y="0" width="1200" height="630" fill="#332D28" />

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="44" fill="#29241F" />

  <!-- Window controls -->
  <circle cx="50" cy="22" r="7" fill="#EF4444" />
  <circle cx="75" cy="22" r="7" fill="#F59E0B" />
  <circle cx="100" cy="22" r="7" fill="#10B981" />

  <!-- File tab -->
  <rect x="125" y="48" width="220" height="36" rx="8" fill="#3D3630" />
  <text x="145" y="73" font-family="'JetBrains Mono', monospace" font-size="14" fill="#F8F5F0" font-weight="600">heading-anchor-fix.md</text>

  <!-- Title divider -->
  <line x1="0" y1="84" x2="1200" y2="84" stroke="#453E38" stroke-width="1.5" />

  <!-- ── LEFT PANEL: Before ── -->
  <rect x="30" y="100" width="555" height="455" fill="#2E2924" rx="8" />

  <!-- Label -->
  <text x="50" y="126" font-family="'JetBrains Mono', monospace" font-size="14" fill="#F59E0B" font-weight="700"># Before</text>
  <text x="160" y="126" font-family="'JetBrains Mono', monospace" font-size="12" fill="#D1D6CC" opacity="0.6">placement: after</text>

  <!-- Viewport card -->
  <rect x="50" y="140" width="515" height="390" rx="8" fill="#352F2A" stroke="#453E38" stroke-width="1" />

  <!-- Card inner title -->
  <text x="70" y="168" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1D6CC" opacity="0.5">~/posts/example.md</text>
  <line x1="50" y1="180" x2="565" y2="180" stroke="#453E38" stroke-width="1" opacity="0.3" />

  <!-- Heading line 1 -->
  <text x="70" y="215" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#F8F5F0">4. The Raw Wrapper</text>

  <!-- Heading line 2 -->
  <text x="70" y="245" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#F8F5F0">(for when you need</text>

  <!-- Heading line 3 — with # phantom -->
  <text x="70" y="275" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#F8F5F0">both)</text>
  <text x="154" y="275" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#E05050" opacity="0.7">#</text>

  <!-- Phantom annotation -->
  <rect x="70" y="286" width="56" height="16" rx="3" fill="none" stroke="#E05050" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />
  <text x="78" y="298" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E05050">phantom</text>

  <!-- Paragraph lines -->
  <rect x="70" y="342" width="380" height="4" rx="2" fill="#453E38" opacity="0.55" />
  <rect x="70" y="354" width="340" height="4" rx="2" fill="#453E38" opacity="0.55" />
  <rect x="70" y="366" width="360" height="4" rx="2" fill="#453E38" opacity="0.55" />

  <!-- Bracket indicator — phantom gap range -->
  <line x1="550" y1="215" x2="550" y2="370" stroke="#E05050" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
  <polygon points="550,215 546,225 554,225" fill="#E05050" opacity="0.5" />
  <polygon points="550,370 546,360 554,360" fill="#E05050" opacity="0.5" />

  <!-- ── RIGHT PANEL: After ── -->
  <rect x="615" y="100" width="555" height="455" fill="#2E2924" rx="8" />

  <!-- Panel header -->
  <rect x="615" y="100" width="555" height="34" fill="#3D3630" rx="8" />
  <rect x="615" y="127" width="555" height="7" fill="#3D3630" />
  <text x="635" y="121" font-family="'JetBrains Mono', monospace" font-size="13" fill="#D1D6CC" dominant-baseline="middle">style.css</text>

  <!-- Label -->
  <text x="635" y="160" font-family="'JetBrains Mono', monospace" font-size="14" fill="#F59E0B" font-weight="700"># After</text>
  <text x="745" y="160" font-family="'JetBrains Mono', monospace" font-size="12" fill="#D1D6CC" opacity="0.6">position: absolute</text>

  <!-- Viewport card -->
  <rect x="635" y="174" width="515" height="196" rx="8" fill="#352F2A" stroke="#453E38" stroke-width="1" />

  <!-- Card inner title -->
  <text x="655" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1D6CC" opacity="0.5">~/posts/example.md</text>
  <line x1="635" y1="208" x2="1150" y2="208" stroke="#453E38" stroke-width="1" opacity="0.3" />

  <!-- Heading line 1 — same text, clean -->
  <text x="655" y="236" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#F8F5F0">4. The Raw Wrapper</text>

  <!-- Heading line 2 -->
  <text x="655" y="264" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#F8F5F0">(for when you need</text>

  <!-- Heading line 3 — clean, no phantom -->
  <text x="655" y="292" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#F8F5F0">both)</text>

  <!-- Paragraph lines — no gap -->
  <rect x="655" y="316" width="380" height="4" rx="2" fill="#453E38" opacity="0.55" />
  <rect x="655" y="328" width="340" height="4" rx="2" fill="#453E38" opacity="0.55" />
  <rect x="655" y="340" width="360" height="4" rx="2" fill="#453E38" opacity="0.55" />

  <!-- Green indicator — clean spacing -->
  <line x1="614" y1="236" x2="614" y2="344" stroke="#10D9A8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
  <polygon points="614,236 610,246 618,246" fill="#10D9A8" opacity="0.5" />
  <polygon points="614,344 610,334 618,334" fill="#10D9A8" opacity="0.5" />

  <!-- CSS snippet -->
  <rect x="635" y="390" width="515" height="148" rx="6" fill="#352F2A" stroke="#453E38" stroke-width="0.5" />

  <!-- CSS comment -->
  <text x="650" y="412" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1D6CC" opacity="0.6">/* When hidden — removed from flow */</text>

  <text x="650" y="432" font-family="'JetBrains Mono', monospace" font-size="13" fill="#F8F5F0">.header-anchor {</text>

  <text x="650" y="454" font-family="'JetBrains Mono', monospace" font-size="13">
    <tspan fill="#F59E0B">  position</tspan><tspan fill="#F8F5F0">:</tspan><tspan fill="#D1D6CC"> absolute</tspan><tspan fill="#F8F5F0">;</tspan>
  </text>

  <text x="650" y="476" font-family="'JetBrains Mono', monospace" font-size="13">
    <tspan fill="#F59E0B">  opacity</tspan><tspan fill="#F8F5F0">:</tspan><tspan fill="#D1D6CC"> 0</tspan><tspan fill="#F8F5F0">;</tspan>
  </text>

  <text x="650" y="498" font-family="'JetBrains Mono', monospace" font-size="13" fill="#F8F5F0">}</text>

  <text x="650" y="520" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1D6CC" opacity="0.6">/* On hover — visible */</text>

  <!-- ── STATUS BAR (45px) ── -->
  <rect x="0" y="555" width="1200" height="45" fill="#29241F" />
  <line x1="0" y1="555" x2="1200" y2="555" stroke="#453E38" stroke-width="1" />

  <!-- NORMAL mode badge -->
  <rect x="30" y="566" width="80" height="24" rx="3" fill="#F59E0B" />
  <text x="70" y="583" font-family="'JetBrains Mono', monospace" font-size="12" fill="#1C1917" font-weight="800" text-anchor="middle">NORMAL</text>

  <!-- File info -->
  <text x="1170" y="583" font-family="'JetBrains Mono', monospace" font-size="12" fill="#D1D6CC" font-weight="600" text-anchor="end">heading-anchor-fix.md  22L</text>
</svg>
