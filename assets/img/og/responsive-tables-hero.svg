<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="600" y="56" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#1a1a1a" font-weight="700">Responsive Tables — Before &amp; After</text>
  
  <!-- Divider -->
  <line x1="100" y1="72" x2="1100" y2="72" stroke="#d0d0d0" stroke-width="1"/>
  
  <!-- ============ LEFT COLUMN (Before) ============ -->
  <text x="300" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#5c6370">Before: Uncontained Overflow</text>
  
  <!-- Phone outline -->
  <rect x="100" y="126" width="400" height="440" rx="20" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/>
  
  <!-- Phone notch -->
  <rect x="240" y="126" width="120" height="22" rx="11" fill="#1a1a1a"/>
  
  <!-- Table header row -->
  <rect x="116" y="168" width="368" height="32" fill="#f4f4f4" rx="4"/>
  <line x1="200" y1="168" x2="200" y2="200" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="290" y1="168" x2="290" y2="200" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="380" y1="168" x2="380" y2="200" stroke="#d0d0d0" stroke-width="0.5"/>
  
  <text x="160" y="188" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a" font-weight="600">Issue</text>
  <text x="246" y="188" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a" font-weight="600">Cause</text>
  <text x="336" y="188" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a" font-weight="600">Fix</text>
  <text x="430" y="188" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a" font-weight="600">Impact</text>
  
  <!-- Table rows -->
  <rect x="116" y="204" width="368" height="28" fill="#ffffff" rx="0"/>
  <line x1="200" y1="204" x2="200" y2="232" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="290" y1="204" x2="290" y2="232" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="380" y1="204" x2="380" y2="232" stroke="#d0d0d0" stroke-width="0.5"/>
  <text x="160" y="221" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Reflow</text>
  <text x="246" y="221" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">JS calls</text>
  <text x="336" y="221" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Transform</text>
  <text x="440" y="221" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#B45309">99 → 100</text>
  
  <rect x="116" y="236" width="368" height="28" fill="#fafafa" rx="0"/>
  <line x1="200" y1="236" x2="200" y2="264" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="290" y1="236" x2="290" y2="264" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="380" y1="236" x2="380" y2="264" stroke="#d0d0d0" stroke-width="0.5"/>
  <text x="160" y="253" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Shift</text>
  <text x="246" y="253" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">No dims</text>
  <text x="336" y="253" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">W+H attrs</text>
  <text x="440" y="253" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">CLS fix</text>
  
  <!-- Overflow indicator — the key visual: content spilling out -->
  <rect x="116" y="268" width="368" height="28" fill="#ffffff" rx="0"/>
  <line x1="200" y1="268" x2="200" y2="296" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="290" y1="268" x2="290" y2="296" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="380" y1="268" x2="380" y2="296" stroke="#d0d0d0" stroke-width="0.5"/>
  <text x="160" y="285" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Contrast</text>
  <text x="246" y="285" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Shiki</text>
  <text x="336" y="285" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Override</text>
  <text x="440" y="285" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">A11y 100</text>
  
  <!-- Overflow indicator — simulated content beyond viewport -->
  <rect x="484" y="168" width="60" height="128" fill="#ffffff" stroke="#EF4444" stroke-width="1.5" rx="4"/>
  <text x="514" y="196" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#EF4444">Overflow</text>
  <text x="514" y="212" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#EF4444">cut off</text>
  <text x="514" y="228" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#EF4444">→ invisible</text>
  
  <!-- Red arrow from table edge to overflow -->
  <path d="M 484 232 L 472 232 L 472 98" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <text x="472" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#EF4444">❌ Last column hidden</text>
  
  <!-- ============ RIGHT COLUMN (After) ============ -->
  <text x="900" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#5c6370">After: Table-Wrap Container</text>
  
  <!-- Phone outline -->
  <rect x="700" y="126" width="400" height="440" rx="20" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/>
  
  <!-- Phone notch -->
  <rect x="840" y="126" width="120" height="22" rx="11" fill="#1a1a1a"/>
  
  <!-- Scrollable wrapper visual (dashed box inside phone) -->
  <rect x="716" y="166" width="368" height="160" rx="6" fill="#f0f7f0" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="720" y="182" font-family="ui-monospace,monospace" font-size="8" fill="#16A34A" font-weight="600">div.table-wrap { overflow-x: auto; }</text>
  
  <!-- Table header row -->
  <rect x="726" y="190" width="348" height="30" fill="#f4f4f4" rx="4"/>
  <line x1="810" y1="190" x2="810" y2="220" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="890" y1="190" x2="890" y2="220" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="970" y1="190" x2="970" y2="220" stroke="#d0d0d0" stroke-width="0.5"/>
  
  <text x="770" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a1a1a" font-weight="600">Issue</text>
  <text x="852" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a1a1a" font-weight="600">Cause</text>
  <text x="932" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a1a1a" font-weight="600">Fix</text>
  <text x="1028" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a1a1a" font-weight="600">Impact</text>
  
  <!-- Row 1 -->
  <rect x="726" y="224" width="348" height="26" fill="#ffffff" rx="0"/>
  <line x1="810" y1="224" x2="810" y2="250" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="890" y1="224" x2="890" y2="250" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="970" y1="224" x2="970" y2="250" stroke="#d0d0d0" stroke-width="0.5"/>
  <text x="770" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5c6370">Reflow</text>
  <text x="852" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5c6370">JS calls</text>
  <text x="932" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5c6370">Transform</text>
  <text x="1028" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#16A34A">99 → 100</text>
  
  <!-- Row 2 -->
  <rect x="726" y="254" width="348" height="26" fill="#fafafa" rx="0"/>
  <line x1="810" y1="254" x2="810" y2="280" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="890" y1="254" x2="890" y2="280" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="970" y1="254" x2="970" y2="280" stroke="#d0d0d0" stroke-width="0.5"/>
  <text x="770" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5c6370">Shift</text>
  <text x="852" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5c6370">No dims</text>
  <text x="932" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5c6370">W+H attrs</text>
  <text x="1028" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#16A34A">CLS fix</text>
  
  <!-- Row 3 -->
  <rect x="726" y="284" width="348" height="26" fill="#ffffff" rx="0"/>
  <line x1="810" y1="284" x2="810" y2="310" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="890" y1="284" x2="890" y2="310" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="970" y1="284" x2="970" y2="310" stroke="#d0d0d0" stroke-width="0.5"/>
  <text x="770" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5c6370">Contrast</text>
  <text x="852" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5c6370">Shiki</text>
  <text x="932" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5c6370">Override</text>
  <text x="1028" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#16A34A">A11y 100</text>
  
  <!-- Scroll hint (arrows indicating scroll) -->
  <rect x="1068" y="320" width="28" height="28" rx="14" fill="#16A34A" opacity="0.15"/>
  <text x="1082" y="338" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" fill="#16A34A">›</text>
  <text x="718" y="338" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#16A34A">← scroll →</text>
  
  <!-- Check mark at bottom -->
  <circle cx="900" cy="380" r="16" fill="#16A34A" opacity="0.15"/>
  <text x="900" y="386" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#16A34A">✓</text>
  <text x="900" y="410" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#16A34A">All data visible</text>
  
  <!-- Footer code -->
  <rect x="116" y="440" width="368" height="28" rx="4" fill="#1a1a1a"/>
  <text x="124" y="458" font-family="ui-monospace,monospace" font-size="9" fill="#a1a1aa">&lt;div class="table-wrap"&gt;  &lt;!-- ❌ missing --&gt;</text>
  <text x="124" y="476" font-family="ui-monospace,monospace" font-size="9" fill="#EF4444">&lt;table&gt;... no overflow handling</text>
  
  <rect x="700" y="440" width="400" height="28" rx="4" fill="#1a1a1a"/>
  <text x="708" y="458" font-family="ui-monospace,monospace" font-size="9" fill="#16A34A"> &lt;div class="table-wrap"&gt;  &lt;!-- ✅ always present --&gt;</text>
  <text x="708" y="476" font-family="ui-monospace,monospace" font-size="9" fill="#a1a1aa">   &lt;table&gt;... </text>
  
  <!-- Bottom legend -->
  <rect x="230" y="520" width="740" height="60" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
  <circle cx="266" cy="548" r="6" fill="#EF4444"/>
  <text x="280" y="552" font-family="ui-monospace,monospace" font-size="11" fill="#5c6370">Uncontained table bleeds past viewport</text>
  <circle cx="266" cy="568" r="6" fill="#16A34A"/>
  <text x="280" y="572" font-family="ui-monospace,monospace" font-size="11" fill="#5c6370">Wrapper div enables scroll without affecting semantics</text>
</svg>
