<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="600" y="56" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#1a1a1a" font-weight="700">Scroll-Aware Table of Contents</text>
  
  <!-- Divider -->
  <line x1="100" y1="72" x2="1100" y2="72" stroke="#d0d0d0" stroke-width="1"/>
  
  <!-- ============ LEFT COLUMN: TOC ============ -->
  <rect x="100" y="96" width="280" height="440" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
  <text x="120" y="122" font-family="ui-monospace,monospace" font-size="12" fill="#1a1a1a" font-weight="600">On this page</text>
  
  <!-- TOC items -->
  <!-- Item 1: NOT active (default style) -->
  <line x1="120" y1="148" x2="120" y2="148" stroke="#d0d0d0" stroke-width="2"/>
  <text x="138" y="152" font-family="ui-monospace,monospace" font-size="10" fill="#5c6370">The Almost Perfect Score</text>
  
  <!-- Item 2: NOT active -->
  <line x1="120" y1="172" x2="120" y2="172" stroke="#d0d0d0" stroke-width="2"/>
  <text x="138" y="176" font-family="ui-monospace,monospace" font-size="10" fill="#5c6370">The Forced Reflow</text>
  
  <!-- Item 3: ACTIVE! (accent left border + accent text) -->
  <line x1="120" y1="196" x2="120" y2="196" stroke="#B45309" stroke-width="2"/>
  <text x="138" y="200" font-family="ui-monospace,monospace" font-size="10" fill="#B45309" font-weight="600">The CLS Culprit</text>
  
  <!-- Item 3a: sub-item -->
  <line x1="120" y1="216" x2="120" y2="216" stroke="#d0d0d0" stroke-width="2"/>
  <text x="156" y="220" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">The Problem</text>
  
  <!-- Item 3b: sub-item -->
  <line x1="120" y1="236" x2="120" y2="236" stroke="#d0d0d0" stroke-width="2"/>
  <text x="156" y="240" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">The Fix</text>
  
  <!-- Item 4: NOT active -->
  <line x1="120" y1="260" x2="120" y2="260" stroke="#d0d0d0" stroke-width="2"/>
  <text x="138" y="264" font-family="ui-monospace,monospace" font-size="10" fill="#5c6370">The Contrast Calculation</text>
  
  <!-- Item 5: NOT active -->
  <line x1="120" y1="284" x2="120" y2="284" stroke="#d0d0d0" stroke-width="2"/>
  <text x="138" y="288" font-family="ui-monospace,monospace" font-size="10" fill="#5c6370">The Big Picture</text>
  
  <!-- Item 6: NOT active -->
  <line x1="120" y1="308" x2="120" y2="308" stroke="#d0d0d0" stroke-width="2"/>
  <text x="138" y="312" font-family="ui-monospace,monospace" font-size="10" fill="#5c6370">What I Learned</text>
  
  <!-- Legend for active state -->
  <rect x="120" y="440" width="240" height="70" rx="6" fill="#fafafa" stroke="#d0d0d0" stroke-width="0.5"/>
  <rect x="132" y="452" width="4" height="12" rx="2" fill="#B45309"/>
  <text x="144" y="462" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Active section (IntersectionObserver)</text>
  <rect x="132" y="472" width="4" height="12" rx="2" fill="#d0d0d0"/>
  <text x="144" y="482" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Inactive section</text>
  <text x="144" y="498" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">:hover persist → navigation history</text>
  
  <!-- ============ RIGHT COLUMN: Article Preview ============ -->
  <rect x="420" y="96" width="680" height="440" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
  
  <!-- Article header -->
  <text x="450" y="126" font-family="ui-monospace,monospace" font-size="16" fill="#1a1a1a" font-weight="700">Chasing 100: A Field Guide</text>
  <text x="450" y="148" font-family="ui-monospace,monospace" font-size="11" fill="#5c6370">10 June 2026  •  meta, performance</text>
  
  <line x1="450" y1="162" x2="1070" y2="162" stroke="#d0d0d0" stroke-width="0.5"/>
  
  <!-- Article body — simulated text lines -->
  <text x="450" y="186" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">The day after publishing my blog revamp, I</text>
  <text x="450" y="202" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">ran Google PageSpeed Insights. I expected</text>
  <text x="450" y="218" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">validation — weeks of careful optimization</text>
  <text x="450" y="234" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">surely deserved a perfect score.</text>
  
  <text x="450" y="258" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">I got a 99.</text>
  
  <line x1="450" y1="280" x2="1070" y2="280" stroke="#d0d0d0" stroke-width="0.5"/>
  
  <!-- Heading 2 -->
  <text x="450" y="304" font-family="ui-monospace,monospace" font-size="13" fill="#1a1a1a" font-weight="700">The Almost Perfect Score</text>
  
  <text x="450" y="324" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">Not a 98, not a 95 — a 99. One single point</text>
  <text x="450" y="340" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">away from perfection.</text>
  
  <line x1="450" y1="360" x2="1070" y2="360" stroke="#d0d0d0" stroke-width="0.5"/>
  
  <!-- Heading 2 -->
  <text x="450" y="384" font-family="ui-monospace,monospace" font-size="13" fill="#1a1a1a" font-weight="700">The Forced Reflow</text>
  
  <text x="450" y="404" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">PageSpeed's warning read: A forced reflow</text>
  <text x="450" y="420" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">occurs when JavaScript queries geometric</text>
  <text x="450" y="436" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">properties after styles have been invalidated.</text>
  
  <!-- Reading zone indicator (the transparent overlay strip) -->
  <rect x="420" y="184" width="680" height="24" fill="#B45309" opacity="0.04" pointer-events="none"/>
  <line x1="420" y1="196" x2="1100" y2="196" stroke="#B45309" stroke-width="1" opacity="0.2" stroke-dasharray="3 3"/>
  <text x="1084" y="199" text-anchor="end" font-family="ui-monospace,monospace" font-size="8" fill="#B45309">reading zone</text>
  
  <!-- Arrow from reading zone to active TOC item -->
  <line x1="420" y1="196" x2="380" y2="196" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="380,192 388,196 380,200" fill="#B45309" opacity="0.5"/>
  
  <!-- Bottom "how it works" section -->
  <rect x="450" y="466" width="620" height="48" rx="6" fill="#f4f4f4"/>
  <circle cx="470" cy="490" r="12" fill="#B45309" opacity="0.15"/>
  <text x="470" y="495" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#B45309">1</text>
  <text x="492" y="486" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a" font-weight="600">IntersectionObserver</text>
  <text x="492" y="502" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Detects which heading is in the reading zone</text>
  
  <circle cx="700" cy="490" r="12" fill="#B45309" opacity="0.15"/>
  <text x="700" y="495" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#B45309">2</text>
  <text x="722" y="486" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a" font-weight="600">CSS Active State</text>
  <text x="722" y="502" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Border + text color update in the TOC</text>
  
  <circle cx="930" cy="490" r="12" fill="#B45309" opacity="0.15"/>
  <text x="930" y="495" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#B45309">3</text>
  <text x="952" y="486" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a" font-weight="600">Click Handler</text>
  <text x="952" y="502" font-family="ui-monospace,monospace" font-size="9" fill="#5c6370">Instant feedback, IO corrects after scroll</text>
</svg>
