<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <rect width="640" height="440" fill="#fafafa" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Dot Leader: Flex Layout &amp; Vertical Alignment</text>

  <!-- ===================== TOP PANEL: Flex Layout ===================== -->
  <rect x="20" y="44" width="600" height="120" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <rect x="24" y="40" width="92" height="16" fill="#e0f2fe" rx="3"/>
  <text x="70" y="51" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#2563eb">display: flex</text>

  <rect x="40" y="72" width="160" height="40" fill="#fff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="120" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">Post Title</text>
  <text x="120" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#636b78">max-width: 65%</text>

  <rect x="220" y="72" width="200" height="40" fill="#fff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="320" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2563eb">· · · · · · · · · · · · ·</text>
  <text x="320" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#2563eb">flex: 1 · min-width: 4em</text>

  <rect x="440" y="72" width="140" height="40" fill="#fff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="510" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">13 June 2026</text>
  <text x="510" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#636b78">flex-shrink: 0</text>

  <polygon points="205,92 215,92 210,86" fill="#d1d5db"/>
  <polygon points="425,92 435,92 430,86" fill="#d1d5db"/>

  <!-- ===================== BOTTOM PANEL: Before/After ===================== -->
  <rect x="20" y="180" width="600" height="230" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <text x="320" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Before vs After: Vertical Alignment</text>

  <!-- ===================== BEFORE (period on baseline) ===================== -->
  <rect x="30" y="215" width="280" height="140" fill="#fff" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="170" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Before — Period on Baseline</text>

  <text x="45" y="293" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Post Title</text>
  <text x="295" y="293" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#636b78">13 June 2026</text>

  <!-- Baseline indicator line -->
  <line x1="40" y1="290" x2="305" y2="290" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Period dots as circles on the baseline -->
  <circle cx="130" cy="290" r="3" fill="#ef4444"/>
  <circle cx="150" cy="290" r="3" fill="#ef4444"/>
  <circle cx="170" cy="290" r="3" fill="#ef4444"/>
  <circle cx="190" cy="290" r="3" fill="#ef4444"/>
  <circle cx="210" cy="290" r="3" fill="#ef4444"/>
  <circle cx="230" cy="290" r="3" fill="#ef4444"/>

  <text x="170" y="342" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#b91c1c">. (period) — red circles on the baseline</text>

  <!-- ===================== AFTER (middle dot centered) ===================== -->
  <rect x="330" y="215" width="280" height="140" fill="#fff" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="470" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#15803d">After — Middle Dot Centered</text>

  <text x="345" y="293" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Post Title</text>
  <text x="595" y="293" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#636b78">13 June 2026</text>

  <!-- Baseline line (reference) -->
  <line x1="340" y1="290" x2="605" y2="290" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- X-height center line -->
  <line x1="340" y1="278" x2="605" y2="278" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Vertical connector showing the shift -->
  <line x1="270" y1="290" x2="270" y2="278" stroke="#22c55e" stroke-width="1"/>
  <polygon points="274,284 270,276 266,284" fill="#22c55e"/>
  <text x="262" y="272" text-anchor="end" font-family="system-ui,sans-serif" font-size="8" fill="#22c55e">centered</text>

  <!-- Middle dots as circles at x-height center -->
  <circle cx="430" cy="278" r="3" fill="#22c55e"/>
  <circle cx="450" cy="278" r="3" fill="#22c55e"/>
  <circle cx="470" cy="278" r="3" fill="#22c55e"/>
  <circle cx="490" cy="278" r="3" fill="#22c55e"/>
  <circle cx="510" cy="278" r="3" fill="#22c55e"/>
  <circle cx="530" cy="278" r="3" fill="#22c55e"/>

  <text x="470" y="342" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#15803d">· (middle dot) — green circles above baseline</text>

  <!-- ===================== CAPTION ===================== -->
  <rect x="20" y="400" width="600" height="28" fill="#e0f2fe" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="320" y="418" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#2563eb">align-self: center moves the dots from baseline to x-height center, fixing the optical alignment</text>
</svg>
