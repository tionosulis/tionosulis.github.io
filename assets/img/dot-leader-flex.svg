<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <rect width="640" height="320" fill="#fafafa" rx="12"/>
  <text x="320" y="28" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Dot Leader — Pure CSS Flex Layout</text>

  <!-- The three boxes showing the flex layout -->
  <text x="40" y="58" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">How it works:</text>

  <!-- Full row showing the three flex children -->
  <rect x="40" y="70" width="560" height="50" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="320" y="86" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">display: flex on container</text>

  <!-- Title block -->
  <rect x="55" y="95" width="100" height="18" fill="#bbf7d0" rx="3"/>
  <text x="105" y="108" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#15803d" text-anchor="middle">Post title</text>
  <!-- flex: 0 1 auto -->

  <!-- Dots block (flex-grow) -->
  <rect x="160" y="95" width="280" height="18" fill="#e0f2fe" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="300" y="108" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#2563eb" text-anchor="middle">dots span: flex: 1</text>
  <!-- flex: 1 1 0 -->

  <!-- Date block -->
  <rect x="445" y="95" width="140" height="18" fill="#fef3c7" rx="3"/>
  <text x="515" y="108" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#b45309" text-anchor="middle">June 15, 2026</text>
  <!-- flex: 0 1 auto -->

  <!-- HTML markup -->
  <text x="40" y="148" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">The HTML:</text>
  <rect x="40" y="155" width="560" height="45" fill="#f0f0f0" rx="6"/>
  <text x="55" y="170" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a">&lt;a href="/posts/slug/" class="postlist-item"&gt;</text>
  <text x="55" y="184" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a">  &lt;span class="postlist-title"&gt;Post Title&lt;/span&gt;</text>
  <text x="55" y="198" font-family="ui-monospace,monospace" font-size="10" fill="#2563eb">  &lt;span class="postlist-dots" aria-hidden="true"&gt;&lt;/span&gt;</text>
  <text x="55" y="212" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a">  &lt;time&gt;June 15, 2026&lt;/time&gt;</text>
  <text x="55" y="226" font-family="ui-monospace,monospace" font-size="10" fill="#1a1a1a">&lt;/a&gt;</text>

  <!-- CSS -->
  <text x="40" y="255" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">The CSS:</text>
  <rect x="40" y="260" width="560" height="50" fill="#f0f0f0" rx="6"/>
  <text x="55" y="275" font-family="ui-monospace,monospace" font-size="10" fill="#b84d00">.postlist-item { display: flex; }</text>
  <text x="55" y="289" font-family="ui-monospace,monospace" font-size="10" fill="#2563eb">.postlist-dots { flex: 1; min-width: 1ch; }</text>
  <text x="55" y="303" font-family="ui-monospace,monospace" font-size="10" fill="#c92e3d">.postlist-dots::before { content: " . . . . . . . . . . . . . . . . "; }</text>
</svg>
