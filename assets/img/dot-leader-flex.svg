<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <rect width="640" height="460" fill="#fafafa" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Dot Leader: Flex Layout &amp; Vertical Alignment</text>

  <!-- ===================== TOP PANEL: Flex Layout ===================== -->
  <rect x="20" y="48" width="600" height="118" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <rect x="24" y="44" width="92" height="16" fill="#e0f2fe" rx="3"/>
  <text x="70" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#2563eb">display: flex</text>

  <!-- Title box -->
  <rect x="40" y="70" width="155" height="40" fill="#fff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="117" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">Post Title</text>
  <text x="117" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#636b78">max-width: 65%</text>

  <!-- Arrow right from title -->
  <polygon points="200,90 210,90 205,84" fill="#d1d5db"/>

  <!-- Dot leader box -->
  <rect x="215" y="70" width="200" height="40" fill="#fff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="315" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2563eb">· · · · · · · · · · · · ·</text>
  <text x="315" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#2563eb">flex: 1  ·  min-width: 4em</text>

  <!-- Arrow right from dots -->
  <polygon points="420,90 430,90 425,84" fill="#d1d5db"/>

  <!-- Date box -->
  <rect x="435" y="70" width="145" height="40" fill="#fff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="507" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">13 June 2026</text>
  <text x="507" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#636b78">flex-shrink: 0</text>

  <!-- ===================== BOTTOM PANEL: Before/After ===================== -->
  <rect x="20" y="182" width="600" height="248" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <text x="320" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Before vs After: Vertical Alignment</text>

  <!-- ===================== BEFORE ===================== -->
  <rect x="30" y="212" width="280" height="160" fill="#fff" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="170" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Before — Period on Baseline</text>

  <!-- "Post Title" teks -->
  <text x="45" y="280" font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#1a1a1a">Post Title</text>

  <!-- "13 June" teks -->
  <text x="298" y="280" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#636b78">13 June 2026</text>

  <!-- Garis BASELINE merah tipis saja sebagai referensi utama -->
  <line x1="38" y1="280" x2="305" y2="280" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Dots (period) duduk DI BASELINE = cy=280 -->
  <circle cx="128" cy="280" r="2.5" fill="#ef4444"/>
  <circle cx="145" cy="280" r="2.5" fill="#ef4444"/>
  <circle cx="162" cy="280" r="2.5" fill="#ef4444"/>
  <circle cx="179" cy="280" r="2.5" fill="#ef4444"/>
  <circle cx="196" cy="280" r="2.5" fill="#ef4444"/>
  <circle cx="213" cy="280" r="2.5" fill="#ef4444"/>

  <!-- Keterangan -->
  <text x="170" y="308" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#b91c1c">. (period) menempel di baseline</text>
  <text x="170" y="322" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#b91c1c">terlihat terlalu rendah / turun</text>
  <text x="170" y="356" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#9ca3af">align-items: baseline (default)</text>

  <!-- ===================== AFTER ===================== -->
  <rect x="330" y="212" width="280" height="160" fill="#fff" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="470" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#15803d">After — Middle Dot Centered</text>

  <!-- Teks sama persis, baseline y=280 -->
  <text x="345" y="280" font-family="system-ui,sans-serif" font-size="16" font-weight="500" fill="#1a1a1a">Post Title</text>
  <text x="608" y="280" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#636b78">13 June 2026</text>

  <!-- Garis CENTER hijau tipis saja sebagai referensi utama -->
  <line x1="338" y1="275" x2="608" y2="275" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Dots (middle dot) tepat di CENTER = cy=275 -->
  <circle cx="428" cy="275" r="2.5" fill="#22c55e"/>
  <circle cx="445" cy="275" r="2.5" fill="#22c55e"/>
  <circle cx="462" cy="275" r="2.5" fill="#22c55e"/>
  <circle cx="479" cy="275" r="2.5" fill="#22c55e"/>
  <circle cx="496" cy="275" r="2.5" fill="#22c55e"/>
  <circle cx="513" cy="275" r="2.5" fill="#22c55e"/>

  <!-- Keterangan -->
  <text x="470" y="308" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#15803d">· (middle dot) di tengah tinggi font</text>
  <text x="470" y="322" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#15803d">sejajar optik dengan teks</text>
  <text x="470" y="356" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#9ca3af">align-self: center + top: 0.05em</text>

  <!-- ===================== CAPTION BAR ===================== -->
  <rect x="20" y="438" width="600" height="18" fill="#e0f2fe" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="320" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#2563eb">align-self: center overrides align-items: baseline — dot duduk tepat di tengah tinggi huruf</text>
</svg>
