<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <rect width="640" height="380" fill="#fafafa" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Dot Leader: Flex Layout &amp; Vertical Alignment</text>

  <!-- ===================== TOP PANEL: Flex Layout ===================== -->
  <rect x="20" y="44" width="600" height="130" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <rect x="24" y="40" width="92" height="16" fill="#e0f2fe" rx="3"/>
  <text x="70" y="51" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#2563eb">display: flex</text>

  <rect x="40" y="72" width="160" height="40" fill="#fff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="120" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">Post Title</text>
  <text x="120" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#636b78">max-width: 65%</text>

  <rect x="220" y="72" width="200" height="40" fill="#fff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="320" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2563eb">· · · · · · · · · · · · ·</text>
  <text x="320" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#2563eb">flex: 1 · min-width: 4em</text>

  <rect x="440" y="72" width="140" height="40" fill="#fff" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
  <text x="510" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">13 June 2026</text>
  <text x="510" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#636b78">flex-shrink: 0</text>

  <text x="44" y="162" font-family="system-ui,sans-serif" font-size="8" fill="#636b78">flex item</text>
  <text x="224" y="162" font-family="system-ui,sans-serif" font-size="8" fill="#2563eb">flex item · overflows into hidden</text>
  <text x="444" y="162" font-family="system-ui,sans-serif" font-size="8" fill="#636b78">flex item</text>

  <polygon points="205,92 215,92 210,86" fill="#d1d5db"/>
  <polygon points="425,92 435,92 430,86" fill="#d1d5db"/>

  <!-- ===================== BOTTOM PANEL: Before/After ===================== -->
  <rect x="20" y="190" width="600" height="170" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <text x="320" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Before vs After: Vertical Alignment</text>

  <!-- BEFORE -->
  <rect x="30" y="220" width="280" height="100" fill="#fff" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="170" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Before (Baseline)</text>

  <text x="45" y="278" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">Post Title</text>
  <text x="145" y="278" font-family="system-ui,sans-serif" font-size="14" fill="#636b78">. . . . . .</text>
  <text x="295" y="278" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" fill="#636b78">13 June 2026</text>

  <line x1="40" y1="273" x2="220" y2="273" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="225" y="276" font-family="system-ui,sans-serif" font-size="8" fill="#ef4444">baseline</text>

  <text x="170" y="308" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#b91c1c">. (period) sits on baseline</text>

  <!-- AFTER -->
  <rect x="330" y="220" width="280" height="100" fill="#fff" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="470" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#15803d">After (Centered)</text>

  <text x="345" y="278" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">Post Title</text>
  <text x="445" y="273" font-family="system-ui,sans-serif" font-size="14" fill="#636b78">· · · · · ·</text>
  <text x="595" y="278" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" fill="#636b78">13 June 2026</text>

  <line x1="340" y1="269" x2="520" y2="269" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="525" y="272" font-family="system-ui,sans-serif" font-size="8" fill="#22c55e">x-height center</text>

  <text x="470" y="308" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#15803d">· (middle dot) centered + 0.05em nudge</text>

  <!-- CAPTION -->
  <rect x="20" y="348" width="600" height="24" fill="#e0f2fe" stroke="#2563eb" stroke-width="1" rx="6"/>
  <text x="320" y="363" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#2563eb">align-self: center overrides parent's align-items: baseline for proper vertical centering</text>
</svg>
