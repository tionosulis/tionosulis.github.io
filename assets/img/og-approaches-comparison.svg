<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="headBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E1B4B"/>
      <stop offset="100%" style="stop-color:#312E81"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="340" fill="#F8FAFC" rx="8"/>

  <!-- Table header -->
  <rect x="0" y="0" width="800" height="36" rx="8" fill="url(#headBg)"/>
  <rect x="0" y="20" width="800" height="16" fill="url(#headBg)"/>

  <text x="20" y="23" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#A5B4FC" letter-spacing="1">APPROACH</text>
  <text x="220" y="23" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#A5B4FC" letter-spacing="1">WHAT IT DOES</text>
  <text x="440" y="23" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#A5B4FC" letter-spacing="1">COMPLEXITY</text>
  <text x="560" y="23" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#A5B4FC" letter-spacing="1">BEST FOR</text>

  <!-- Divider -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Row 1: Manual PNG Render -->
  <rect x="0" y="36" width="800" height="74" fill="#FFFFFF"/>
  <text x="20" y="65" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#6366F1">Manual PNG</text>
  <rect x="20" y="75" width="76" height="20" rx="10" fill="#6366F1" opacity="0.1"/>
  <text x="58" y="89" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#6366F1" letter-spacing="0.3">BEST VALUE</text>
  <text x="220" y="65" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">Render SVG to PNG once via sharp,</text>
  <text x="220" y="83" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">save to assets, reference in frontmatter.</text>
  <text x="450" y="75" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#10B981">Low</text>
  <text x="570" y="75" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">Occasional hero images</text>

  <!-- Divider -->
  <line x1="0" y1="110" x2="800" y2="110" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Row 2: Auto Shortcode -->
  <rect x="0" y="110" width="800" height="74" fill="#FAFAFA"/>
  <text x="20" y="139" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#8B5CF6">Auto Shortcode</text>
  <rect x="20" y="149" width="76" height="20" rx="10" fill="#8B5CF6" opacity="0.1"/>
  <text x="58" y="163" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#8B5CF6" letter-spacing="0.3">SCALABLE</text>
  <text x="220" y="139" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">Eleventy shortcode converts SVG to</text>
  <text x="220" y="157" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">PNG at build time automatically.</text>
  <text x="450" y="149" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#F59E0B">Medium</text>
  <text x="570" y="149" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">Many posts with hero images</text>

  <!-- Divider -->
  <line x1="0" y1="184" x2="800" y2="184" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Row 3: Hybrid + Fallback -->
  <rect x="0" y="184" width="800" height="74" fill="#FFFFFF"/>
  <text x="20" y="213" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="#10B981">Hybrid + Fallback</text>
  <rect x="20" y="223" width="76" height="20" rx="10" fill="#10B981" opacity="0.1"/>
  <text x="58" y="237" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#10B981" letter-spacing="0.3">CHOSEN</text>
  <text x="220" y="213" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">Frontmatter override for posts with</text>
  <text x="220" y="231" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">hero + default favicon for all others.</text>
  <text x="450" y="223" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#10B981">Low</text>
  <text x="570" y="223" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#475569">Mix of posts with/without hero</text>

  <!-- Divider -->
  <line x1="0" y1="258" x2="800" y2="258" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Column dividers -->
  <line x1="200" y1="36" x2="200" y2="258" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="430" y1="36" x2="430" y2="258" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="520" y1="36" x2="520" y2="258" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Footer note -->
  <text x="400" y="300" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#94A3B8" font-style="italic">The hybrid approach keeps complexity low while giving full control when needed.</text>

  <!-- Source tag -->
  <text x="780" y="330" text-anchor="end" font-family="'Courier New',monospace" font-size="8" fill="#CBD5E1">Comparison table — tionosulis.github.io</text>
</svg>
