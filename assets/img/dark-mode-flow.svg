<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340">
  <rect width="640" height="340" fill="#fafafa" rx="12"/>
  <text x="320" y="28" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Dark Mode Initialization — No Flicker</text>

  <!-- Step 1 -->
  <rect x="30" y="50" width="180" height="100" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <text x="120" y="72" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. User visits page</text>
  <text x="120" y="90" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">Browser loads HTML</text>
  <text x="120" y="106" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">System: prefers-color-scheme</text>
  <text x="120" y="122" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">localStorage: previous choice</text>

  <line x1="210" y1="100" x2="240" y2="100" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="235,95 245,100 235,105" fill="#2563eb"/>

  <!-- Step 2 - inline script -->
  <rect x="245" y="50" width="180" height="100" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="335" y="72" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">2. Inline script runs</text>
  <text x="335" y="92" font-family="ui-monospace,monospace" font-size="9" fill="#1a1a1a" text-anchor="middle">localStorage.getItem("theme")</text>
  <text x="335" y="108" font-family="ui-monospace,monospace" font-size="9" fill="#636b78" text-anchor="middle">? "dark" : matchMedia(...)</text>
  <text x="335" y="128" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">Sets data-theme attribute</text>
  <text x="335" y="142" font-family="system-ui,sans-serif" font-size="9" fill="#636b78" text-anchor="middle">Before any paint</text>

  <line x1="425" y1="100" x2="455" y2="100" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="450,95 460,100 450,105" fill="#2563eb"/>

  <!-- Step 3 - CSS -->
  <rect x="455" y="50" width="155" height="100" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5" rx="8"/>
  <text x="532" y="72" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">3. CSS loads</text>
  <text x="532" y="94" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">:root — light vars</text>
  <text x="532" y="112" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">[data-theme="dark"]</text>
  <text x="532" y="128" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">@media fallback</text>
  <text x="532" y="144" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">Renders correctly</text>

  <!-- Timeline bar -->
  <rect x="30" y="170" width="580" height="70" fill="#f0f0f0" rx="6"/>
  <text x="320" y="190" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">Timeline: page load</text>

  <rect x="50" y="202" width="80" height="14" fill="#fecaca" rx="4"/>
  <text x="90" y="213" font-family="system-ui,sans-serif" font-size="8" fill="#b91c1c" text-anchor="middle">HTML parse</text>

  <rect x="140" y="202" width="100" height="14" fill="#e0f2fe" rx="4"/>
  <text x="190" y="213" font-family="system-ui,sans-serif" font-size="8" fill="#2563eb" text-anchor="middle">Inline script</text>

  <rect x="250" y="202" width="80" height="14" fill="#bbf7d0" rx="4"/>
  <text x="290" y="213" font-family="system-ui,sans-serif" font-size="8" fill="#15803d" text-anchor="middle">data-theme set</text>

  <!-- Flicker zone comparison -->
  <text x="320" y="240" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">Flicker happens if script runs here →</text>

  <rect x="420" y="228" width="170" height="14" fill="#fecaca" rx="4"/>
  <text x="505" y="239" font-family="system-ui,sans-serif" font-size="8" fill="#b91c1c" text-anchor="middle">CSS paint (first render)</text>

  <rect x="50" y="252" width="540" height="14" fill="#f0f0f0" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="320" y="263" font-family="system-ui,sans-serif" font-size="8" fill="#636b78" text-anchor="middle">DOMContentLoaded — full page interactive</text>

  <!-- Key insight -->
  <rect x="30" y="280" width="580" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="320" y="298" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">Key: script in &lt;head&gt; runs BEFORE first paint</text>
  <text x="320" y="313" font-family="system-ui,sans-serif" font-size="10" fill="#636b78" text-anchor="middle">data-theme is set before CSS applies = zero flicker</text>
</svg>
