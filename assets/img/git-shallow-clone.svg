<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340">
<rect width="640" height="340" fill="#fafafa" rx="12"/>
<text x="320" y="28" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Shallow Clone vs Full Clone</text>
<text x="160" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#ef4444" text-anchor="middle">Shallow (--depth 1)</text>
<circle cx="160" cy="80" r="18" fill="#ef4444" opacity="0.15"/>
<text x="160" y="85" font-family="ui-monospace,monospace" font-size="10" fill="#ef4444" text-anchor="middle">HEAD</text>
<line x1="160" y1="98" x2="160" y2="115" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="160" cy="125" r="16" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
<text x="160" y="130" font-family="ui-monospace,monospace" font-size="9" fill="#6b7280" text-anchor="middle">???</text>
<line x1="144" y1="125" x2="35" y2="125" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/>
<text x="65" y="120" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">missing</text>
<text x="480" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#22c55e" text-anchor="middle">Full Clone</text>
<circle cx="480" cy="80" r="18" fill="#22c55e" opacity="0.15"/>
<text x="480" y="85" font-family="ui-monospace,monospace" font-size="10" fill="#22c55e" text-anchor="middle">HEAD</text>
<line x1="480" y1="98" x2="480" y2="110" stroke="#22c55e" stroke-width="1.5"/>
<circle cx="480" cy="125" r="12" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
<text x="480" y="129" font-family="ui-monospace,monospace" font-size="8" fill="#166534" text-anchor="middle">3</text>
<line x1="468" y1="125" x2="430" y2="145" stroke="#22c55e" stroke-width="1"/>
<line x1="492" y1="125" x2="530" y2="145" stroke="#22c55e" stroke-width="1"/>
<circle cx="430" cy="160" r="12" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
<text x="430" y="164" font-family="ui-monospace,monospace" font-size="8" fill="#166534" text-anchor="middle">2</text>
<circle cx="530" cy="160" r="12" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
<text x="530" y="164" font-family="ui-monospace,monospace" font-size="8" fill="#166534" text-anchor="middle">4</text>
<line x1="430" y1="172" x2="430" y2="190" stroke="#22c55e" stroke-width="1"/>
<line x1="530" y1="172" x2="530" y2="190" stroke="#22c55e" stroke-width="1"/>
<circle cx="430" cy="205" r="12" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
<text x="430" y="209" font-family="ui-monospace,monospace" font-size="8" fill="#166534" text-anchor="middle">1</text>
<circle cx="530" cy="205" r="12" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
<text x="530" y="209" font-family="ui-monospace,monospace" font-size="8" fill="#6b7280" text-anchor="middle">5</text>
<line x1="530" y1="217" x2="530" y2="235" stroke="#d1d5db" stroke-width="1"/>
<circle cx="530" cy="250" r="12" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
<text x="530" y="254" font-family="ui-monospace,monospace" font-size="8" fill="#6b7280" text-anchor="middle">6</text>
<rect x="50" y="265" width="540" height="60" fill="#fff" rx="8" stroke="#d1d5db" stroke-width="1"/>
<text x="320" y="286" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">Push Scenario</text>
<text x="320" y="304" font-family="system-ui,sans-serif" font-size="11" fill="#5c6370" text-anchor="middle">git push → remote checks ancestry → shallow clone: missing commits → REJECTED</text>
<text x="320" y="319" font-family="system-ui,sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">Full clone: all ancestors present → ACCEPTED</text>
