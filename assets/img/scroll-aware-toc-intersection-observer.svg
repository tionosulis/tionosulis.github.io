        filter="url(#cardShadow)"/>


  <!-- Article header area -->
  <rect x="420" y="100" width="680" height="56" rx="10" fill="#f9f9f9"/>
  <rect x="420" y="140" width="680" height="16" fill="#f9f9f9"/>
  <text x="450" y="124" font-family="ui-monospace,monospace" font-size="15"
        fill="#1a1a1a" font-weight="700">Chasing 100: A Field Guide</text>
  <text x="450" y="144" font-family="ui-monospace,monospace" font-size="10"
        fill="#5c6370">10 June 2026  ·  meta, performance</text>
  <line x1="420" y1="156" x2="1100" y2="156" stroke="#e0e0e0" stroke-width="0.5"/>


  <!-- Intro body text -->
  <text x="450" y="180" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">The day after publishing my blog revamp, I ran Google PageSpeed Insights.</text>
  <text x="450" y="196" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">I expected validation — weeks of careful optimization surely deserved</text>
  <text x="450" y="212" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">a perfect score.</text>
  <text x="450" y="234" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">I got a 99.</text>


  <line x1="450" y1="248" x2="1080" y2="248" stroke="#e0e0e0" stroke-width="0.5"/>


  <!-- Section heading 1 -->
  <text x="450" y="272" font-family="ui-monospace,monospace" font-size="13"
        fill="#1a1a1a" font-weight="700">The Almost Perfect Score</text>
  <text x="450" y="292" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">Not a 98, not a 95 — a 99. One single point away from perfection.</text>


  <line x1="450" y1="308" x2="1080" y2="308" stroke="#e0e0e0" stroke-width="0.5"/>


  <!-- Section heading 2 -->
  <text x="450" y="332" font-family="ui-monospace,monospace" font-size="13"
        fill="#1a1a1a" font-weight="700">The Forced Reflow</text>
  <text x="450" y="352" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">PageSpeed's warning: A forced reflow occurs when JavaScript queries</text>
  <text x="450" y="368" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">geometric properties after styles have been invalidated.</text>


  <line x1="450" y1="384" x2="1080" y2="384" stroke="#e0e0e0" stroke-width="0.5"/>


  <!-- Section heading 3 — THE CLS CULPRIT (active, currently in reading zone) -->
  <text x="450" y="408" font-family="ui-monospace,monospace" font-size="13"
        fill="#1a1a1a" font-weight="700">The CLS Culprit</text>
  <text x="450" y="428" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">Cumulative Layout Shift: images without dimensions cause the browser</text>
  <text x="450" y="444" font-family="ui-monospace,monospace" font-size="10" fill="#4a4e5a">to recalculate layout as assets load in.</text>


  <!-- ── Reading zone indicator ── -->
  <!-- Amber highlight band across article width at active heading -->
  <rect x="420" y="396" width="680" height="58"
        fill="#B45309" opacity="0.05"/>
  <!-- Top edge dashed line -->
  <line x1="420" y1="396" x2="1100" y2="396"
