  <!-- Bottom edge dashed line -->
  <line x1="420" y1="454" x2="1100" y2="454"
        stroke="#B45309" stroke-width="1" opacity="0.15" stroke-dasharray="4 3"/>
  <!-- Label -->
  <text x="1092" y="422" text-anchor="end"
        font-family="ui-monospace,monospace" font-size="8"
        fill="#B45309" opacity="0.8">reading zone</text>


