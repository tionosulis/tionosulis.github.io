<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="6"  flood-color="#000000" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#B45309" flood-opacity="0.10"/>
    </filter>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#B45309" flood-opacity="0.12"/>
    </filter>
    <pattern id="dotgrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.9" fill="#B45309" opacity="0.14"/>
    </pattern>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="55%" stop-color="#f5f5f5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5f5f5" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="leftScreenClip">
      <rect x="148" y="136" width="304" height="432"/>
    </clipPath>
  </defs>


  <!-- Transparent background + dot grid -->
  <rect width="1200" height="675" fill="url(#dotgrid)"/>


  <!-- Offset +20px vertical to center content in 675px canvas -->
  <g transform="translate(0,14)">


  <!-- ── TITLE ── -->
  <text x="600" y="44" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="17" font-weight="700"
        fill="#B45309" letter-spacing="0.5">Responsive Tables</text>
  <text x="600" y="64" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="11"
        fill="#B45309" opacity="0.55" letter-spacing="2">BEFORE  ·  AFTER</text>
  <line x1="80" y1="76" x2="1120" y2="76" stroke="#B45309" stroke-width="0.5" opacity="0.25"/>


  <!-- Center divider -->
  <line x1="600" y1="84" x2="600" y2="620"
        stroke="#B45309" stroke-width="0.5" opacity="0.2" stroke-dasharray="5 5"/>


  <!-- ══ LEFT — Before ══ -->
  <text x="300" y="100" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="11" font-weight="600"
        fill="#EF4444" letter-spacing="1">&#10007;  BEFORE: Uncontained Overflow</text>


  <!-- Phone body -->
  <rect x="135" y="112" width="330" height="468" rx="22"
        fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1.5" filter="url(#phoneShadow)"/>
  <!-- Screen -->
  <rect x="148" y="134" width="304" height="432" rx="6" fill="#f5f5f5"/>
  <!-- Red status bar -->
  <rect x="148" y="134" width="304" height="5" rx="2" fill="#EF4444" opacity="0.75"/>
  <!-- Notch -->
  <rect x="255" y="112" width="120" height="18" rx="9" fill="#0d0d0d"/>
  <circle cx="370" cy="121" r="3" fill="#2a2a2a"/>


  <!-- Table content clipped to screen -->
  <g clip-path="url(#leftScreenClip)">
    <!-- Table header — intentionally wider than screen -->
    <rect x="148" y="148" width="390" height="30" fill="#e2e2e2"/>
    <line x1="228" y1="148" x2="228" y2="178" stroke="#c8c8c8" stroke-width="0.5"/>
    <line x1="308" y1="148" x2="308" y2="178" stroke="#c8c8c8" stroke-width="0.5"/>
    <line x1="388" y1="148" x2="388" y2="178" stroke="#c8c8c8" stroke-width="0.5"/>
    <text x="188" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#1a1a1a" font-weight="600">Issue</text>
    <text x="268" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#1a1a1a" font-weight="600">Cause</text>
    <text x="348" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#1a1a1a" font-weight="600">Fix</text>
    <text x="438" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#1a1a1a" font-weight="600">Impact</text>


    <rect x="148" y="182" width="390" height="26" fill="#ffffff"/>
    <line x1="228" y1="182" x2="228" y2="208" stroke="#ebebeb" stroke-width="0.5"/>
    <line x1="308" y1="182" x2="308" y2="208" stroke="#ebebeb" stroke-width="0.5"/>
    <line x1="388" y1="182" x2="388" y2="208" stroke="#ebebeb" stroke-width="0.5"/>
    <text x="188" y="199" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Reflow</text>
    <text x="268" y="199" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">JS calls</text>
    <text x="348" y="199" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Transform</text>
    <text x="438" y="199" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#B45309">99 → 100</text>


    <rect x="148" y="212" width="390" height="26" fill="#fafafa"/>
    <line x1="228" y1="212" x2="228" y2="238" stroke="#ebebeb" stroke-width="0.5"/>
    <line x1="308" y1="212" x2="308" y2="238" stroke="#ebebeb" stroke-width="0.5"/>
    <line x1="388" y1="212" x2="388" y2="238" stroke="#ebebeb" stroke-width="0.5"/>
    <text x="188" y="229" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Shift</text>
    <text x="268" y="229" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">No dims</text>
    <text x="348" y="229" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">W+H attrs</text>
    <text x="438" y="229" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">CLS fix</text>


    <rect x="148" y="242" width="390" height="26" fill="#ffffff"/>
    <line x1="228" y1="242" x2="228" y2="268" stroke="#ebebeb" stroke-width="0.5"/>
    <line x1="308" y1="242" x2="308" y2="268" stroke="#ebebeb" stroke-width="0.5"/>
    <line x1="388" y1="242" x2="388" y2="268" stroke="#ebebeb" stroke-width="0.5"/>
    <text x="188" y="259" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Contrast</text>
    <text x="268" y="259" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Shiki</text>
    <text x="348" y="259" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Override</text>
    <text x="438" y="259" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">A11y 100</text>


    <!-- Fade overlay to simulate viewport clip -->
    <rect x="390" y="134" width="62" height="432" fill="url(#fadeRight)"/>


    <!-- Overflow warning annotation -->
    <rect x="148" y="284" width="304" height="48" rx="4"
          fill="#FEF2F2" stroke="#EF4444" stroke-width="0.75" stroke-opacity="0.4"/>
    <text x="300" y="305" text-anchor="middle" font-family="ui-monospace,monospace"
          font-size="9" fill="#EF4444" font-weight="600">&#9888;  4th column clipped by viewport</text>
    <text x="300" y="321" text-anchor="middle" font-family="ui-monospace,monospace"
          font-size="8.5" fill="#EF4444" opacity="0.8">table overflows past screen edge</text>


    <!-- No scrollbar track -->
    <rect x="148" y="346" width="304" height="9" rx="4.5" fill="#ebebeb"/>
    <text x="300" y="372" text-anchor="middle" font-family="ui-monospace,monospace"
          font-size="8.5" fill="#EF4444">no scrollbar  &#x2717;</text>


    <!-- Code block -->
    <rect x="148" y="390" width="304" height="62" rx="4" fill="#1e1e1e"
          stroke="#EF4444" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="158" y="408" font-family="ui-monospace,monospace" font-size="8" fill="#6b7280">&lt;!-- &#x274C; no wrapper --&gt;</text>
    <text x="158" y="424" font-family="ui-monospace,monospace" font-size="8" fill="#EF4444">&lt;table&gt;</text>
    <text x="168" y="440" font-family="ui-monospace,monospace" font-size="8" fill="#9ca3af">  &lt;thead&gt;...&lt;/thead&gt;</text>
  </g>


  <!-- ══ RIGHT — After ══ -->
  <text x="900" y="100" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="11" font-weight="600"
        fill="#16A34A" letter-spacing="1">&#10003;  AFTER: Table-Wrap Container</text>


  <!-- Phone body -->
  <rect x="735" y="112" width="330" height="468" rx="22"
        fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1.5" filter="url(#phoneShadow)"/>
  <!-- Screen -->
  <rect x="748" y="134" width="304" height="432" rx="6" fill="#f5f5f5"/>
  <!-- Green status bar -->
  <rect x="748" y="134" width="304" height="5" rx="2" fill="#16A34A" opacity="0.75"/>
  <!-- Notch -->
  <rect x="855" y="112" width="120" height="18" rx="9" fill="#0d0d0d"/>
  <circle cx="970" cy="121" r="3" fill="#2a2a2a"/>


  <!-- Wrapper chip label -->
  <rect x="748" y="148" width="304" height="20" rx="3"
        fill="#f0fdf4" stroke="#16A34A" stroke-width="0.75" stroke-opacity="0.6"/>
  <text x="900" y="162" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="7.5" fill="#16A34A" font-weight="600"
        letter-spacing="0.3">div.table-wrap  {  overflow-x: auto  }</text>


  <!-- Dashed wrapper outline -->
  <rect x="748" y="148" width="304" height="148" rx="4"
        fill="none" stroke="#16A34A" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.55"/>


  <!-- Table header -->
  <rect x="748" y="172" width="304" height="28" fill="#e2e2e2" rx="2"/>
  <line x1="824" y1="172" x2="824" y2="200" stroke="#c8c8c8" stroke-width="0.5"/>
  <line x1="896" y1="172" x2="896" y2="200" stroke="#c8c8c8" stroke-width="0.5"/>
  <line x1="968" y1="172" x2="968" y2="200" stroke="#c8c8c8" stroke-width="0.5"/>
  <text x="786" y="191" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a1a1a" font-weight="600">Issue</text>
  <text x="860" y="191" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a1a1a" font-weight="600">Cause</text>
  <text x="932" y="191" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a1a1a" font-weight="600">Fix</text>
  <text x="1014" y="191" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1a1a1a" font-weight="600">Impact</text>


  <rect x="748" y="204" width="304" height="26" fill="#ffffff"/>
  <line x1="824" y1="204" x2="824" y2="230" stroke="#ebebeb" stroke-width="0.5"/>
  <line x1="896" y1="204" x2="896" y2="230" stroke="#ebebeb" stroke-width="0.5"/>
  <line x1="968" y1="204" x2="968" y2="230" stroke="#ebebeb" stroke-width="0.5"/>
  <text x="786" y="221" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Reflow</text>
  <text x="860" y="221" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">JS calls</text>
  <text x="932" y="221" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Transform</text>
  <text x="1014" y="221" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#16A34A">99 → 100</text>


  <rect x="748" y="234" width="304" height="26" fill="#fafafa"/>
  <line x1="824" y1="234" x2="824" y2="260" stroke="#ebebeb" stroke-width="0.5"/>
  <line x1="896" y1="234" x2="896" y2="260" stroke="#ebebeb" stroke-width="0.5"/>
  <line x1="968" y1="234" x2="968" y2="260" stroke="#ebebeb" stroke-width="0.5"/>
  <text x="786" y="251" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Shift</text>
  <text x="860" y="251" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">No dims</text>
  <text x="932" y="251" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">W+H attrs</text>
  <text x="1014" y="251" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#16A34A">CLS fix</text>


  <rect x="748" y="264" width="304" height="26" fill="#ffffff"/>
  <line x1="824" y1="264" x2="824" y2="290" stroke="#ebebeb" stroke-width="0.5"/>
  <line x1="896" y1="264" x2="896" y2="290" stroke="#ebebeb" stroke-width="0.5"/>
  <line x1="968" y1="264" x2="968" y2="290" stroke="#ebebeb" stroke-width="0.5"/>
  <text x="786" y="281" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Contrast</text>
  <text x="860" y="281" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Shiki</text>
  <text x="932" y="281" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#555">Override</text>
  <text x="1014" y="281" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#16A34A">A11y 100</text>


  <!-- Scrollbar track + thumb -->
  <rect x="748" y="304" width="304" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="748" y="304" width="145" height="8" rx="4" fill="#16A34A" opacity="0.6"/>
  <text x="900" y="328" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="8.5" fill="#16A34A">&#8592; scrollable &#8594;  &#10003;</text>


  <!-- All visible annotation -->
  <rect x="748" y="344" width="304" height="48" rx="4"
        fill="#F0FDF4" stroke="#16A34A" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="900" y="365" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="9" fill="#16A34A" font-weight="600">&#10003;  All columns accessible</text>
  <text x="900" y="381" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="8.5" fill="#16A34A" opacity="0.8">horizontal scroll, semantics intact</text>


  <!-- Code block -->
  <rect x="748" y="408" width="304" height="74" rx="4" fill="#1e1e1e"
        stroke="#16A34A" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="758" y="425" font-family="ui-monospace,monospace" font-size="8" fill="#6b7280">&lt;!-- &#x2705; wrapper always present --&gt;</text>
  <text x="758" y="442" font-family="ui-monospace,monospace" font-size="8" fill="#16A34A">&lt;div class="table-wrap"&gt;</text>
  <text x="768" y="458" font-family="ui-monospace,monospace" font-size="8" fill="#9ca3af">  &lt;table&gt;</text>
  <text x="778" y="474" font-family="ui-monospace,monospace" font-size="8" fill="#9ca3af">    &lt;thead&gt;...&lt;/thead&gt;</text>


  <!-- ── LEGEND ── -->
  <line x1="80" y1="616" x2="1120" y2="616" stroke="#B45309" stroke-width="0.5" opacity="0.2"/>
  <circle cx="260" cy="638" r="5" fill="#EF4444" opacity="0.85"/>
  <text x="272" y="643" font-family="ui-monospace,monospace" font-size="10"
        fill="#EF4444" opacity="0.75">No wrapper — content overflows, last column clipped</text>
  <circle cx="700" cy="638" r="5" fill="#16A34A" opacity="0.85"/>
  <text x="712" y="643" font-family="ui-monospace,monospace" font-size="10"
        fill="#16A34A" opacity="0.75">With div.table-wrap — clean scroll, semantics preserved</text>
  </g>
</svg>