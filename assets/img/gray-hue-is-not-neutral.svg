<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.5" fill="#B45309" opacity="0.12"/>
    </pattern>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A38"/>
      <stop offset="100%" stop-color="#1A2430"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dot-grid)"/>

  <rect x="38" y="38" width="1124" height="599" rx="10" fill="#000" opacity="0.25"/>

  <rect x="36" y="36" width="1128" height="603" rx="10" fill="#1B1B1D" stroke="#3D536A" stroke-width="1.5"/>

  <rect x="36" y="36" width="1128" height="38" rx="10" fill="#222225"/>
  <rect x="36" y="56" width="1128" height="18" fill="#222225"/>

  <circle cx="62" cy="55" r="4.5" fill="#B45309"/>
  <circle cx="82" cy="55" r="4.5" fill="#B45309" opacity="0.55"/>
  <circle cx="102" cy="55" r="4.5" fill="#B45309" opacity="0.25"/>

  <text x="600" y="60" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#878f9d" text-anchor="middle" dominant-baseline="middle">~/gray-hue — bash</text>

  <g font-family="ui-monospace,SFMono-Regular,monospace">
    <text x="66" y="110" font-size="16" fill="#878f9d">~/blog</text>
    <text x="140" y="110" font-size="16" fill="#878f9d"> $</text>
    <text x="168" y="110" font-size="16" fill="#B45309"> ./hue --check --secondary</text>

    <line x1="66" y1="145" x2="1134" y2="145" stroke="#3D536A" stroke-width="0.5" stroke-opacity="0.4"/>

    <text x="310" y="180" font-size="14" fill="#a78bfa" text-anchor="middle" letter-spacing="2" font-weight="600">PURPLE-GRAY</text>
    <text x="890" y="180" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="2" font-weight="600">BLUE-GRAY</text>

    <text x="310" y="205" font-size="13" fill="#878f9d" text-anchor="middle">HSL 265° 10% 65%</text>
    <text x="890" y="205" font-size="13" fill="#878f9d" text-anchor="middle">HSL 215° 16% 65%</text>

    <text x="600" y="260" font-size="14" fill="#5e6173" text-anchor="middle">vs</text>

    <rect x="120" y="248" width="380" height="72" rx="6" fill="#9a8fac"/>
    <text x="310" y="290" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600" letter-spacing="1">#9A8FAC  —  purple-gray</text>

    <rect x="700" y="248" width="380" height="72" rx="6" fill="#94a3b8"/>
    <text x="890" y="290" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600" letter-spacing="1">#94A3B8  —  slate-400</text>

    <line x1="600" y1="155" x2="600" y2="510" stroke="#B45309" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>

    <rect x="120" y="345" width="380" height="28" rx="4" fill="#2d1512"/>
    <text x="140" y="363" font-size="13" fill="#B45309">⚠</text>
    <text x="162" y="363" font-size="13" fill="#878f9d">hue orphaned — no purple anchor in system</text>

    <rect x="120" y="382" width="380" height="28" rx="4" fill="#2d1512"/>
    <text x="140" y="400" font-size="13" fill="#B45309">⚠</text>
    <text x="162" y="400" font-size="13" fill="#878f9d">warm accent + purple-gray = 3 competing hues</text>

    <rect x="700" y="345" width="380" height="28" rx="4" fill="#183023"/>
    <text x="720" y="363" font-size="13" fill="#10D9A8">✓</text>
    <text x="742" y="363" font-size="13" fill="#878f9d">warm accent + cool gray = temperature harmony</text>

    <rect x="700" y="382" width="380" height="28" rx="4" fill="#183023"/>
    <text x="720" y="400" font-size="13" fill="#10D9A8">✓</text>
    <text x="742" y="400" font-size="13" fill="#878f9d">consistent hue family across light &amp; dark mode</text>

    <line x1="66" y1="440" x2="1134" y2="440" stroke="#3D536A" stroke-width="0.5" stroke-opacity="0.4"/>

    <text x="310" y="480" font-size="13" fill="#a78bfa" text-anchor="middle" opacity="0.6">⟵ violet quadrant · requires purple accent</text>
    <text x="890" y="480" font-size="13" fill="#94a3b8" text-anchor="middle" opacity="0.6">⟵ blue quadrant · works with any warm accent</text>

    <text x="600" y="535" font-size="14" fill="#5e6173" text-anchor="middle">─────────────────────────────────</text>

    <text x="600" y="575" font-size="16" fill="#C8D8E8" text-anchor="middle">Gray carries a hue. Make it a deliberate one.</text>
  </g>

  <text x="1134" y="630" font-family="ui-monospace,SFMono-Regular,monospace" font-size="34" fill="#B45309" text-anchor="end" font-weight="bold">&gt;_S</text>

  <g stroke-linecap="round" fill="none">
    <path d="M 2 22 L 2 2 L 22 2" stroke="#F5A623" stroke-width="2.5"/>
    <path d="M 1178 2 L 1198 2 L 1198 22" stroke="#F5A623" stroke-width="2.5"/>
    <path d="M 2 653 L 2 673 L 22 673" stroke="#10D9A8" stroke-width="2.5"/>
    <path d="M 1178 673 L 1198 673 L 1198 653" stroke="#10D9A8" stroke-width="2.5"/>

    <path d="M 1184 316" stroke="#3D536A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 1184 338" stroke="#3D536A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 1184 360" stroke="#3D536A" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
