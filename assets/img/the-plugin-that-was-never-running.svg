<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#B45309" opacity="0.08"/>
    </pattern>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rounded">
      <rect width="1200" height="630" rx="10" ry="10"/>
    </clipPath>
  </defs>


  <g clip-path="url(#rounded)">
    <rect width="1200" height="630" fill="#161616"/>
    <rect width="1200" height="630" fill="url(#dots)"/>
    <rect width="1200" height="630" fill="url(#amberGlow)"/>


    <!-- Inner frame -->
    <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#B45309" stroke-width="1" stroke-opacity="0.2"/>
    <path d="M 32 80 L 32 32 L 80 32"          fill="none" stroke="#B45309" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M 1120 32 L 1168 32 L 1168 80"    fill="none" stroke="#B45309" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M 32 550 L 32 598 L 80 598"       fill="none" stroke="#B45309" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M 1168 550 L 1168 598 L 1120 598" fill="none" stroke="#B45309" stroke-width="2" stroke-opacity="0.45"/>


    <!-- Title bar -->
    <rect x="0" y="0" width="1200" height="40" fill="#B45309" fill-opacity="0.07"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#B45309" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="50" cy="20" r="5" fill="#ff5f57" opacity="0.75"/>
    <circle cx="70" cy="20" r="5" fill="#febc2e" opacity="0.75"/>
    <circle cx="90" cy="20" r="5" fill="#28c840" opacity="0.75"/>
    <text x="120" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#B45309" opacity="0.8" letter-spacing="0.3" dominant-baseline="middle">eleventy.config.js</text>


    <!-- Prompt -->
    <text x="80" y="80" font-family="'JetBrains Mono', monospace" font-size="15" fill="#FBBF24" opacity="0.85">$ diff before.html after.html</text>


    <!-- ══════════════════════════════════
         LEFT — BEFORE (broken)
    ══════════════════════════════════ -->


    <!-- Panel header -->
    <rect x="80" y="96" width="500" height="32" fill="#ef4444" fill-opacity="0.12" rx="3"/>
    <text x="100" y="117" font-family="'JetBrains Mono', monospace" font-size="16" fill="#ef4444" font-weight="700">✗  BEFORE — extensions: "jpg,png,gif"</text>


    <!-- Config block -->
    <rect x="80" y="136" width="500" height="148" fill="#1e1e1e" rx="3" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Line numbers -->
    <text x="96" y="162" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">1</text>
    <text x="96" y="184" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">2</text>
    <text x="96" y="206" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">3</text>
    <text x="96" y="228" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">4</text>
    <text x="96" y="250" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">5</text>
    <text x="96" y="272" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">6</text>
    <!-- Code -->
    <text x="116" y="162" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">addPlugin(imageTransform, {</text>
    <!-- Broken line highlight -->
    <rect x="80" y="170" width="500" height="24" fill="#ef4444" fill-opacity="0.1"/>
    <text x="116" y="187" font-family="'JetBrains Mono', monospace" font-size="15" fill="#ef4444">  extensions: <tspan fill="#fca5a5">"jpg,png,gif"</tspan>,</text>
    <text x="116" y="209" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">  formats: <tspan fill="#86efac">["avif","webp"]</tspan>,</text>
    <text x="116" y="231" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">  defaultAttributes: {</text>
    <text x="116" y="253" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">    loading: <tspan fill="#86efac">"lazy"</tspan>,</text>
    <text x="116" y="275" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">  }</text>


    <!-- Output HTML — broken -->
    <rect x="80" y="298" width="500" height="110" fill="#1e1e1e" rx="3" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
    <text x="96" y="320" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280">output HTML</text>
    <line x1="80" y1="328" x2="580" y2="328" stroke="#333" stroke-width="1"/>
    <text x="96" y="350" font-family="'JetBrains Mono', monospace" font-size="15" fill="#ef4444">&lt;img src="/hero.svg"</text>
    <text x="116" y="372" font-family="'JetBrains Mono', monospace" font-size="15" fill="#ef4444">     alt="..."&gt;</text>
    <text x="96" y="396" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280">no width · no srcset · no avif · untouched</text>


    <!-- Months counter -->
    <rect x="80" y="422" width="500" height="56" fill="#ef4444" fill-opacity="0.06" rx="3"/>
    <text x="330" y="443" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280" text-anchor="middle">images optimized across</text>
    <text x="330" y="465" font-family="'JetBrains Mono', monospace" font-size="28" fill="#ef4444" font-weight="700" text-anchor="middle">0 builds</text>


    <!-- ══════════════════════════════════
         VERTICAL DIVIDER + ARROW
    ══════════════════════════════════ -->
    <line x1="608" y1="56" x2="608" y2="570" stroke="#B45309" stroke-width="1" stroke-opacity="0.2"/>
    <text x="608" y="318" font-family="'JetBrains Mono', monospace" font-size="32" fill="#FBBF24" opacity="0.7" text-anchor="middle">→</text>


    <!-- ══════════════════════════════════
         RIGHT — AFTER (fixed)
    ══════════════════════════════════ -->


    <!-- Panel header -->
    <rect x="636" y="96" width="524" height="32" fill="#28c840" fill-opacity="0.1" rx="3"/>
    <text x="656" y="117" font-family="'JetBrains Mono', monospace" font-size="16" fill="#28c840" font-weight="700">✓  AFTER — extensions: "html"</text>


    <!-- Config block -->
    <rect x="636" y="136" width="524" height="148" fill="#1e1e1e" rx="3" stroke="#28c840" stroke-width="1" stroke-opacity="0.3"/>
    <text x="652" y="162" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">1</text>
    <text x="652" y="184" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">2</text>
    <text x="652" y="206" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">3</text>
    <text x="652" y="228" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">4</text>
    <text x="652" y="250" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">5</text>
    <text x="652" y="272" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4b5563">6</text>
    <!-- Code — fixed line highlighted -->
    <text x="672" y="162" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">addPlugin(imageTransform, {</text>
    <rect x="636" y="170" width="524" height="24" fill="#28c840" fill-opacity="0.08"/>
    <text x="672" y="187" font-family="'JetBrains Mono', monospace" font-size="15" fill="#28c840">  extensions: <tspan fill="#86efac">"html"</tspan>,</text>
    <text x="672" y="209" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">  formats: <tspan fill="#86efac">["avif","webp"]</tspan>,</text>
    <text x="672" y="231" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">  defaultAttributes: {</text>
    <text x="672" y="253" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">    decoding: <tspan fill="#86efac">"auto"</tspan>,</text>
    <text x="672" y="275" font-family="'JetBrains Mono', monospace" font-size="15" fill="#94a3b8">  }</text>


    <!-- Output HTML — fixed -->
    <rect x="636" y="298" width="524" height="110" fill="#1e1e1e" rx="3" stroke="#28c840" stroke-width="1" stroke-opacity="0.3"/>
    <text x="652" y="320" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280">output HTML</text>
    <line x1="636" y1="328" x2="1160" y2="328" stroke="#333" stroke-width="1"/>
    <text x="652" y="350" font-family="'JetBrains Mono', monospace" font-size="15" fill="#28c840">&lt;picture&gt;</text>
    <text x="668" y="371" font-family="'JetBrains Mono', monospace" font-size="14" fill="#d4d4d8">&lt;source type="image/avif" srcset="..."&gt;</text>
    <text x="668" y="391" font-family="'JetBrains Mono', monospace" font-size="14" fill="#d4d4d8">&lt;img width="1200" height="630" loading=...</text>


    <!-- Result counter -->
    <rect x="636" y="422" width="524" height="56" fill="#28c840" fill-opacity="0.06" rx="3"/>
    <text x="898" y="443" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280" text-anchor="middle">[11ty/eleventy-img]</text>
    <text x="898" y="465" font-family="'JetBrains Mono', monospace" font-size="28" fill="#28c840" font-weight="700" text-anchor="middle">45 images optimized</text>


    <!-- ── Bottom hint ── -->
    <rect x="80" y="492" width="1040" height="1" fill="#B45309" opacity="0.15"/>
    <text x="600" y="520" font-family="'JetBrains Mono', monospace" font-size="15" fill="#6b7280" text-anchor="middle">extensions maps to <tspan fill="#FBBF24">output file types</tspan>, not image formats · one word fixed everything</text>
    <text x="600" y="544" font-family="'JetBrains Mono', monospace" font-size="13" fill="#B45309" opacity="0.55" text-anchor="middle">200KB PNG → 19KB AVIF · 90% reduction · zero visual difference</text>


    <!-- Status bar -->
    <rect x="0" y="606" width="1200" height="24" fill="#B45309" fill-opacity="0.05"/>
    <line x1="0" y1="606" x2="1200" y2="606" stroke="#B45309" stroke-width="1" stroke-opacity="0.15"/>
    <text x="20" y="620" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B45309" opacity="0.35">NORMAL</text>
    <text x="900" y="620" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" opacity="0.5">the most impactful fix was deleting 8 words</text>
  </g>


  <rect width="1200" height="630" rx="10" ry="10" fill="none" stroke="#B45309" stroke-width="1.5" stroke-opacity="0.35"/>
</svg>
