*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: 2rem; }

body {

.home-terminal .output {
  color: var(--text-secondary);
  margin: 0.25rem 0 1.25rem 1.2rem;
  line-height: 1.7;
}
.home-terminal .output a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  text-decoration-color: var(--accent);
  &:hover { color: var(--accent-hover); }
}
.home-terminal .cursor-line {
  margin-top: 0.5rem;
}
.home-terminal .blinking-cursor {
  color: var(--accent);
  animation: cursor-blink 1.1s step-end infinite;
}

/* Sidebar hidden on posts page */
.layout--posts .topbar { display: none; }
.layout--posts main { margin: 0; }

/* Desktop */
@media (min-width: 768px) {
  body { padding: 0 3rem; }

  .layout {
    padding: 3rem 0;
  }

  .topbar {
    margin-bottom: 3.236rem;
    padding-bottom: 2rem;
  }
}

/* Print */
@media print {
  .topbar, footer.site-footer, .theme-toggle, .links-nextprev, .posts-page .page-footer { display: none; }
  body { font-size: 12pt; color: #000; background: #fff; }
  a { color: #000; text-decoration: underline; }
  pre { white-space: pre-wrap; border: 1px solid #ccc; }
